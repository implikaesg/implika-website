*,:before,:after{box-sizing:border-box;border-width:0;border-style:solid;border-color:#e5e7eb}
html{line-height:1.5;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
h1,h2,h3,h4,p,figure,blockquote{margin:0;font-size:inherit;font-weight:inherit}
ul,ol{list-style:none;margin:0;padding:0}
img,svg{display:block;vertical-align:middle}
img{max-width:100%;height:auto}
button,input,select,textarea{font:inherit;color:inherit;margin:0;padding:0}
button{border:0;cursor:pointer;background:transparent}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid #7fae54;outline-offset:3px}

:root{font-family:Manrope,"Segoe UI",Helvetica,Arial,sans-serif;color:#17201d;background:#f4f5f0;font-synthesis:none;
--ink:#17201d;--muted:#66716c;--line:#d9ded7;--paper:#f4f5f0;--white:#fbfcf9;--forest:#173a2d;--green:#7fae54;--mint:#dcebd8;--orange:#c96443;
--mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace}
body{margin:0;min-width:320px;background:var(--paper);color:var(--ink);font-family:Manrope,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px}
h1,h2,h3{text-wrap:balance}
.container{width:min(1180px,calc(100% - 64px));margin:0 auto}

/* Header */
.site-header{height:88px;border-bottom:1px solid rgba(23,32,29,.08);position:relative;z-index:10;background:#f4f5f0f5}
.nav-wrap{height:100%;display:flex;align-items:center;justify-content:space-between;gap:28px}
.logo{width:170px;height:42px;display:inline-flex;align-items:center}
.logo-img{height:40px;width:auto;object-fit:contain}
.main-nav{display:flex;align-items:center;gap:22px;margin-left:auto}
.nav-item{position:relative}
.nav-item>a,.nav-item>button{display:flex;align-items:center;gap:5px;background:transparent;color:#4c5851;font-size:12px;font-weight:600;padding:16px 0;transition:color .2s}
.nav-item>a:hover,.nav-item>button:hover,.nav-item>a.current{color:var(--forest)}
.nav-item svg{transition:transform .2s}
.nav-item.open>button svg{transform:rotate(180deg)}
.dropdown{display:none;position:absolute;min-width:210px;top:47px;left:-18px;padding:8px;background:var(--white);border:1px solid var(--line);box-shadow:0 16px 34px #1a2c221a}
.nav-item.open .dropdown{display:grid}
.dropdown a{padding:11px 12px;font-size:12px;color:var(--muted)}
.dropdown a:hover{background:var(--mint);color:var(--forest)}
.dropdown-parent{font-weight:700;color:var(--forest)!important;border-bottom:1px solid var(--line);margin-bottom:4px}
.nav-actions{display:flex;align-items:center;gap:20px}
.button{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 20px;background:var(--forest);color:#fff;border:1px solid var(--forest);font-size:12px;font-weight:700;letter-spacing:.01em;transition:background .2s,transform .2s}
.button:hover{background:#245843;transform:translateY(-2px)}
.button-small{padding:11px 14px;font-size:11px}
.button svg{transition:transform .2s}
.button:hover svg{transform:translate(3px)}
.button.ghost{background:transparent;color:var(--forest)}
.button.ghost:hover{background:var(--mint)}
.text-link{display:inline-flex;align-items:center;gap:8px;color:var(--forest);font-weight:700;font-size:12px}
.text-link svg{transition:transform .2s}
.text-link:hover svg{transform:translate(3px,-3px)}
.menu-button{display:none;background:none;color:var(--forest);padding:5px}

/* Hero */
.hero{min-height:650px;background:var(--paper);position:relative;overflow:hidden}
.hero-grid{min-height:595px;display:grid;grid-template-columns:54% 46%;align-items:center}
.hero-grid>*{min-width:0}
.hero-copy{padding:72px 0 65px;position:relative;z-index:1;max-width:630px}
.eyebrow{display:flex;align-items:center;gap:9px;color:var(--orange);font:10px var(--mono);text-transform:uppercase;letter-spacing:.11em;margin-bottom:20px}
.eyebrow span{width:25px;height:1px;background:var(--orange);display:inline-block;flex:0 0 auto}
.hero h1{max-width:680px;color:var(--forest);font-size:clamp(46px,5vw,75px);line-height:1.02;letter-spacing:-.07em;margin:0 0 25px;font-weight:700}
h1 em,h2 em{color:var(--green);font-style:normal}
.hero-copy>p{color:var(--muted);line-height:1.8;max-width:550px;font-size:14px;margin:0 0 28px}
.hero-actions{display:flex;align-items:center;gap:27px;flex-wrap:wrap}
.hero-footnote{display:flex;gap:8px;align-items:center;color:#89948b;font:10px var(--mono);margin-top:57px}
.hero-art{height:530px;position:relative;display:flex;align-items:center;justify-content:center}
.data-visual{width:405px;height:405px;position:relative}
.visual-grid{position:absolute;top:11%;right:-12%;bottom:-9%;left:3%;opacity:.3;background-image:linear-gradient(#9daaa0 1px,transparent 1px),linear-gradient(90deg,#9daaa0 1px,transparent 1px);background-size:30px 30px;transform:perspective(600px) rotateX(57deg) rotate(-25deg);-webkit-mask-image:linear-gradient(to bottom,transparent,black 35%,transparent 90%);mask-image:linear-gradient(to bottom,transparent,black 35%,transparent 90%)}
.visual-orbit{position:absolute;border:1px solid #b2c5ad;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-28deg)}
.orbit-one{width:355px;height:160px}
.orbit-two{width:250px;height:360px;transform:translate(-50%,-50%) rotate(42deg);border-color:#cad8c5}
.visual-core{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);height:104px;width:104px;display:grid;align-content:center;justify-items:center;gap:5px;background:var(--forest);color:#fff;border-radius:50%;box-shadow:0 0 0 15px #7fae5421,0 0 0 40px #7fae540d}
.visual-core span{font:9px var(--mono);text-align:center;letter-spacing:.12em}
.visual-node{position:absolute;display:grid;place-items:center;background:var(--white);width:44px;height:44px;border-radius:50%;color:var(--orange);border:1px solid #cbd8c7;box-shadow:0 5px 15px #1e3f2d14}
.node-one{top:35px;left:58px}.node-two{top:85px;right:18px;color:#658e52}.node-three{bottom:40px;left:45px;color:#8b8066}
.visual-line{position:absolute;height:1px;background:#aec2a9;transform-origin:left}
.line-one{width:93px;left:95px;top:93px;transform:rotate(31deg)}
.line-two{width:87px;right:44px;top:118px;transform:rotate(157deg)}
.line-three{width:105px;left:79px;bottom:73px;transform:rotate(-28deg)}
.art-label{position:absolute;font:9px var(--mono);letter-spacing:.17em;color:#8b978b;line-height:1.7}
.art-label strong{color:var(--forest);font-weight:500}
.label-top{top:45px;right:18px}.label-bottom{bottom:22px;left:20px}
.label-bottom span{color:var(--orange);padding:0 5px}
.hero-scroll{position:absolute;bottom:22px;left:max(32px,calc((100vw - 1180px)/2));display:flex;align-items:center;gap:11px;color:#9da9a0;font:10px var(--mono)}
.hero-scroll div{width:55px;height:1px;background:#b7c3ba}
.hero-scroll span:first-child{color:var(--forest)}
@media (prefers-reduced-motion:no-preference){
 .orbit-one{animation:spin1 40s linear infinite}.orbit-two{animation:spin2 55s linear infinite}
 @keyframes spin1{to{transform:translate(-50%,-50%) rotate(332deg)}}
 @keyframes spin2{to{transform:translate(-50%,-50%) rotate(-318deg)}}
}

/* Sections */
.flow-section,.audience-section,.all-products{background:var(--white)}
.flow-section{padding:115px 0 120px}
.section-heading.centered{text-align:center;max-width:680px;margin:0 auto 62px}
.section-heading.centered .eyebrow{justify-content:center}
.section-heading h2,.section-heading.split h2{color:var(--forest);font-size:clamp(30px,3.3vw,48px);line-height:1.08;letter-spacing:-.06em;margin:0;font-weight:700}
.section-heading p{color:var(--muted);font-size:13px;line-height:1.8;margin:17px auto 0;max-width:530px}
.flow-line{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.flow-step{position:relative;padding:25px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.flow-step:not(:last-child):after{content:"";position:absolute;right:0;top:0;height:100%;width:1px;background:var(--line)}
.flow-step>svg{position:absolute;right:-8px;top:50%;color:var(--green);background:var(--white);z-index:1}
.flow-step span,.product-index,.large-number{color:var(--orange);font:10px var(--mono)}
.flow-step strong{color:var(--forest);font-size:14px}
.solutions-section{padding:123px 0;background:var(--paper)}
.solutions-section.compact{padding:90px 0}
.section-heading.split{display:flex;align-items:flex-end;justify-content:space-between;gap:50px;margin-bottom:55px}
.section-heading.split>div{max-width:650px}
.section-heading.split p{margin:0;width:330px;font-size:13px;line-height:1.75}
.solution-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.solution-card{min-height:310px;padding:25px 22px;background:var(--white);border:1px solid #e4e8e1;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s,background .25s}
.solution-card:hover{transform:translateY(-6px);background:var(--forest);color:#fff;box-shadow:0 18px 34px #153b2c24}
.card-top{display:flex;justify-content:space-between;color:var(--green);margin-bottom:45px}
.solution-card:hover .card-top{color:#a9ce89}
.card-top span{font:10px var(--mono)}
.solution-card h3{font-size:18px;letter-spacing:-.04em;color:var(--forest);margin:0 0 15px;font-weight:700}
.solution-card:hover h3{color:#fff}
.solution-card p{color:var(--muted);font-size:12px;line-height:1.7;margin:0 0 24px}
.solution-card:hover p{color:#c3d3c9}
.card-link{display:flex;align-items:center;gap:7px;margin-top:auto;color:var(--forest);font-size:11px;font-weight:700}
.solution-card:hover .card-link{color:#fff}
.audience-section{padding:115px 0}
.audience-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.audience-card{padding:42px;background:var(--mint);position:relative;overflow:hidden;min-height:330px}
.audience-card:nth-child(2){background:#e7e7da}
.audience-icon{color:var(--forest);margin-bottom:47px}
.audience-card h3{color:var(--forest);font-size:26px;margin:0 0 12px;letter-spacing:-.05em;font-weight:700}
.audience-card p{color:#5c6d60;font-size:13px;line-height:1.75;max-width:420px}
.audience-card ul{display:flex;flex-wrap:wrap;gap:9px 21px;padding:11px 0 20px;margin:0;color:#56675b;font-size:11px}
.audience-card li{display:flex;align-items:center;gap:7px}
.audience-card li svg{color:var(--orange)}
.products-section{padding:117px 0;background:var(--paper)}
.product-list{border-top:1px solid var(--line)}
.product-row{min-height:90px;display:grid;grid-template-columns:60px 1.2fr 2fr 150px 24px;align-items:center;gap:20px;border-bottom:1px solid var(--line);transition:padding .2s,background .2s}
.product-row:hover{padding:0 16px;background:var(--white)}
.product-row>svg{color:var(--green)}
.product-name{color:var(--forest);font-size:16px;font-weight:700}
.product-description{color:var(--muted);font-size:11px;line-height:1.5}
.status{justify-self:start;padding:6px 9px;border:1px solid #cbd2ca;color:#7b867d;font:9px var(--mono)}
.status.available{color:#5e8c48;border-color:#b9d2ad}
.cta-band{background:var(--forest);color:#fff;padding:92px 0;position:relative;overflow:hidden}
.cta-band:after{content:"";position:absolute;width:420px;height:420px;border:1px solid rgba(177,210,155,.2);border-radius:50%;right:8%;top:-130px;box-shadow:0 0 0 54px #b1d29b0d,0 0 0 112px #b1d29b08}
.cta-inner{display:flex;align-items:center;justify-content:space-between;gap:30px;position:relative;z-index:1}
.cta-band .eyebrow,.accent-intro .eyebrow,.about-closing .eyebrow,.iaas-section .eyebrow{color:#a8cb8c}
.cta-band .eyebrow span,.accent-intro .eyebrow span,.about-closing .eyebrow span,.iaas-section .eyebrow span{background:#a8cb8c}
.cta-band h2{font-size:clamp(34px,4.2vw,58px);line-height:1.06;letter-spacing:-.06em;margin:0;font-weight:700}
.cta-band h2 em{color:#a8cb8c}
.cta-band .button{background:#b0d28d;color:var(--forest);border-color:#b0d28d}
.cta-band .button:hover{background:#fff}

/* Inner pages */
.page-intro{padding:100px 0 105px;background:var(--paper)}
.page-intro h1{color:var(--forest);max-width:820px;font-size:clamp(44px,5.2vw,72px);line-height:1.03;letter-spacing:-.07em;margin:0 0 25px;font-weight:700}

  s1eb:'İmplika kimdir?',s1h:'Sistem Global ve BTS’nin girişimiyle kurulduk.',s1p:['İmplika A.Ş., Sistem Global ve BTS’nin girişimiyle kuruldu. BTS’nin sürdürülebilirlik ve ESG’nin hukuk ve regülasyon tarafındaki birikimiyle, NTT DATA ile birlikte platformumuzu geliştirdik. İmplika, GRI Licensed Software &amp; Tools Partner’dır.','Platform; şirketlerin sürdürülebilirlik olgunluğunu ölçmesini, geliştirmesini ve KPI’larını izlemesini sağlarken, bankaların ve uluslararası finans kuruluşlarının bu veriyi kredi süreçlerinde kullanmasına olanak tanır.'],
  s2eb:'Çıkış noktamız',s2h:'Sürdürülebilirlik neden yalnızca büyük şirketlerin konusu olsun?',s2p:['Sürdürülebilirlik ölçümü ve raporlaması bugüne kadar pahalı ve uzun süreçler gerektirdi. Bu yüzden sürdürülebilirlik bağlantılı finansman da çoğunlukla büyük şirketlere ulaştı.','Amacımız, KOBİ’lerin de sürdürülebilirlik olgunluklarını kolay ve erişilebilir şekilde ölçebilmesini, geliştirebilmesini ve bu gelişimi finansmana ve yeni pazarlara dönüştürebilmesini sağlamak.'],
  exEb:'Uzmanlık ekosistemi',exH:'Dört bakış açısı.<br>Tek platform.',ex:[['Teknoloji','Dijital platform, veri altyapısı, yazılım ve entegrasyon.'],['Sürdürülebilirlik ve ESG','GRI uyumlu olgunluk ölçümü, KPI setleri ve raporlama.'],['Saha ve Doğrulama','Mali müşavir, hukukçu ve yeşil uzmanlardan oluşan ölçüm ve doğrulama ağı.'],['Regülasyon ve Finans','Uluslararası standartlar, kredi çerçevelerine uyum ve sürdürülebilir finansman.']],
  ecoEb:'Kurucular ve ortaklar',ecoH:'Farklı uzmanlıklar,<br>aynı hedef.',ecoP:'İmplika; teknolojiyi, sahadaki erişim gücünü, hukuk ve regülasyon birikimini ve finansal karar alma süreçlerini aynı yapıda buluşturur.',
  eco:[['Teknoloji ve Platform','Sürdürülebilirlik platformu ve veri altyapısı; GRI Licensed Software &amp; Tools Partner.'],['Kurucu Ortak · Saha ve Doğrulama','Mali müşavir ağıyla KOBİ’lere erişim, saha ölçümü ve doğrulama.'],['Kurucu Ortak · Hukuk ve Regülasyon','Sürdürülebilirliğin hukuk ve regülasyon tarafı; standartlara ve kredi çerçevelerine uyum mimarisi.'],['Teknoloji Ortağı','Platform geliştirme, teknik altyapı ve entegrasyon.']],

 mods:{
  lite:{name:'Lite Module',card:'Measure your sustainability maturity against GRI-aligned criteria and get your maturity score.',row:'GRI-aligned maturity assessment, maturity score and improvement guidance.',status:'Available',
   intro:'GRI-aligned maturity assessment, maturity score and an improvement roadmap for SMEs and companies.',h2:'Measure your<br>maturity.',
   lead:'The first step in any sustainability journey is knowing where you stand today. The Lite Module measures it quickly, clearly and in line with recognised standards.',
   caps:['28-criterion GRI-aligned SME set','Maturity score','Recommended actions','Training and expert content'],
   how:'The company answers the criteria on the platform. Implika assesses the answers against the GRI standard and turns them into a maturity score, together with recommended actions, expert comments and training content. The score can also be used for pre-assessment in sustainability-linked finance programmes.'},
  mrv:{name:'KPI Monitoring & Validation',card:'Monitor your KPIs on one platform, validate them through our expert network and report on them.',row:'Extended KPI set, expert validation and bank reporting.',status:'Available',
   intro:'Infrastructure that monitors, validates and reports sustainability KPIs throughout a programme or loan (measurement, reporting and verification).',h2:'Monitor.<br>Validate.',
   lead:'A KPI can only support financial decisions once it is reliably measured and validated. Implika brings monitoring, validation and reporting into a single flow.',
   caps:['60-KPI set based on international standards','Continuous KPI monitoring','Measurement and validation by experts','Reporting to banks and IFIs'],
   how:'The KPI set is built on international standards, and the programme framework decides which KPIs apply. The company tracks its progress on the platform, while the bank uses the same data in its own reporting. Measurement and validation are supported by our network of accountants, lawyers and green finance experts.'},
  supply:{name:'Supply Chain',card:'Manage the sustainability maturity and Scope 3 data of your supplier and seller network.',row:'Supplier onboarding, maturity tracking and Scope 3 data.',status:'Available',
   intro:'Make sustainability maturity, data and risks visible across every link of your supply chain.',h2:'Make your network<br>visible.',
   lead:'A large company’s sustainability performance cannot be separated from that of its suppliers. Implika brings the supply chain into a single data infrastructure.',
   caps:['Supplier and seller onboarding','Maturity tracking','Scope 3 data','Automated sustainability audits'],
   how:'Suppliers and sellers are invited to the platform, complete their maturity assessment and track their progress. The ecosystem owner gets an overall view of the network’s maturity and Scope 3 data in one place.'},
  finance:{name:'Sustainable Finance',card:'Programme infrastructure that connects SMEs to sustainability-linked loans (SLLs).',row:'Maturity score, KPI monitoring and reporting for SLL programmes.',status:'Pilot in preparation'}

  p:'Implika is a sustainability technology platform. It measures the ESG and sustainability maturity of SMEs and companies, turns it into a maturity score, and monitors and validates their KPIs. Companies use it to manage their progress and prepare for sustainability-linked finance, while banks and financial institutions use the same trusted data in credit assessment and reporting.',
  b1:'Request a Demo',b2:'Explore Modules',aud:'Built for:',audList:[['SMEs & companies','companies'],['Banks & IFIs','institutions'],['Ecosystem owners','ecosystem']],

  iaasEb:'Technology and expertise',iaasH:'A platform and an expert validation network in one.',iaasP:'Implika delivers its technology through SaaS and APIs. For measurement and validation, it draws on the network of accountants, lawyers and green finance experts of our founding partner Sistem Global. Our founding partner BTS designs the architecture for standards and regulatory compliance.',pills:['SaaS Platform','API Integration','GRI-Aligned','Expert Validation Network'],
  flowEb:'How it works',flowH:'One flow from measurement to finance.',flowP:'Implika is not a one-off assessment tool. It is a living platform that companies use throughout their sustainability journey.',

  whyEb:'Why now?',whyH:'Sustainability is now a condition for markets and finance.',

 modulesPage:{title:'Modules',eb:'Modules',h1:'Modular infrastructure from measurement to finance.',p:'Maturity assessment, KPI monitoring and validation, supply chain and sustainable finance modules.'},
 financePage:{title:'Sustainable Finance',eb:'Sustainable Finance',h1:'Connecting SMEs to sustainability-linked finance.',p:'Implika provides the measurement, monitoring and reporting infrastructure that lets international finance reach SMEs as working capital through sustainability-linked loans (SLLs).',
  pEb:'The problem',pH:'Why doesn’t green finance reach SMEs?',pP:['Funding from international financial institutions (IFIs) makes up a significant share of Turkish banks’ corporate loan books. But the green and social loans funded this way are project-based: the financing is tied to a specific green transition project.','What SMEs actually need is working capital. Sustainability-linked loans carry no project requirement, yet maturity assessment and KPI tracking have so far been costly and slow, so these loans have mostly gone to large companies.'],
  sEb:'Our solution',sH:'Bringing sustainability-linked lending to SME scale.',sP:['Implika measures an SME’s sustainability maturity against the GRI standard at an accessible cost and turns it into a maturity score. That score is the SME’s first gate into credit assessment.','Throughout the loan, KPIs are monitored on the platform, validated by our expert network and made ready for the bank’s reporting. As the SME meets its KPIs its score rises and, depending on programme terms, better tenor and pricing can be linked to that progress.'],
  flowEb:'How the programme works',flowH:'Sustainability-linked finance in five steps.',
  steps:[['Programme framework','IFIs and participating banks set the funding, KPI set and terms'],['Assessment and score','The SME completes its GRI-aligned maturity assessment on Implika'],['Credit assessment','The score is shared with the bank, which makes the credit decision'],['Monitoring and validation','KPIs are monitored, validated by experts and reported'],['Progress and benefits','As the score rises, programme terms can reward progress']],
  rolesEb:'Who does what?',rolesH:'Clear roles for every party.',
  roles:[['International financial institution','Sets the programme framework, funding pool and KPI set.'],['Participating bank','Makes the credit decision and runs pricing, disbursement and risk assessment.'],['Ecosystem owner','Announces the programme to its supplier and seller network, invites them and champions it.'],['Implika','Provides the maturity assessment, score, KPI monitoring, validation infrastructure and reporting.']],
  note:'Implika does not lend, does not take part in credit decisions and carries no risk. The ecosystem owner is not a lending channel either; its role is to make it easier to reach SMEs.',
  stdEb:'Aligned with international frameworks',stdH:'Measurement and monitoring built on standards.',stdP:'The maturity assessment is based on the GRI standard, and the KPI set on international principles for sustainability-linked loans. Which KPIs apply is decided within each programme framework.',stdPills:['GRI Standards','LMA / APLMA / LSTA SLL Principles','28-criterion SME set','60-KPI extended set']},
 companies:{title:'SMEs & Companies',eb:'For SMEs and companies',h1:'Measure your maturity. Get ready for finance and new markets.',p:'GRI-aligned maturity assessment, an improvement roadmap and KPI tracking for SMEs, exporters, suppliers and corporates.',h2:'Turn sustainability from a burden into an advantage.',lead:'Implika measures where your company stands today, shows what to improve, and links that progress to finance and commercial opportunities.',list:['Get your GRI-aligned maturity score','Improve with recommended actions and training','Track your KPIs on one platform','Prepare for sustainability-linked finance','Get ready for EU export requirements and CBAM','Manage your corporate (TSRS) reporting inputs'],btn:'See how it works'},
 institutions:{title:'Banks & IFIs',eb:'For banks and international financial institutions',h1:'Make sustainability-linked lending measurable at SME scale.',p:'Maturity scoring, KPI monitoring, validation and reporting infrastructure for banks and international financial institutions.',h2:'Reach a wider SME base with data you can trust.',lead:'Implika makes an SME’s sustainability maturity visible at the start of the credit process and keeps its KPIs trackable and reportable for the life of the loan.',list:['Pre-assessment with a GRI-aligned maturity score','KPI monitoring and reporting throughout the loan','Measurement and validation by our expert network','Training and improvement platform for SMEs','Firm-level impact measurement','API integration with banking systems'],note:'Credit decisions, pricing and risk assessment remain entirely with the bank. The Implika score is a first gate for bringing an SME into assessment.',btn:'See how it works'},
 ecosystem:{title:'Ecosystem Owners',eb:'For ecosystem owners',h1:'Raise the maturity of your supplier and seller network.',p:'A sustainability and access-to-finance programme for large companies, marketplaces and industry associations with supplier or seller networks.',h2:'A stronger network makes a stronger business.',lead:'The ecosystem owner announces and champions the programme; Implika takes care of assessment, improvement and monitoring. Your network gains both sustainability maturity and financial resilience.',list:['Announce the programme to your suppliers and sellers','Track your network’s maturity progress','Access Scope 3 data in one place','Ease your network’s access to affordable finance','Prepare your network for EU regulation and export requirements'],note:'The ecosystem owner is neither a lending channel nor a risk-bearing party. Its role is to announce the programme and make it easier to reach its network.',btn:'See how it works'},
 about:{title:'About',eb:'About Implika',h1:'Bridging data, expertise and finance.',p:'Implika is a sustainability technology platform that measures and improves the sustainability maturity of SMEs and companies and connects it to finance.',
  s1eb:'Who we are',s1h:'Founded by Sistem Global and BTS.',s1p:['Implika was founded as a joint initiative of Sistem Global and BTS. Built on BTS’s expertise in the legal and regulatory side of sustainability and ESG, we developed our platform together with NTT DATA. Implika is a GRI Licensed Software &amp; Tools Partner.','The platform helps companies measure and improve their sustainability maturity and track their KPIs, while enabling banks and international financial institutions to use that data in their lending processes.'],
  s2eb:'Where we started',s2h:'Why should sustainability be reserved for large companies?',s2p:['Sustainability measurement and reporting have long been costly and slow. As a result, sustainability-linked finance has mostly reached large companies.','Our goal is to let SMEs measure and improve their sustainability maturity easily and affordably, and turn that progress into finance and new markets.'],
  exEb:'Expertise ecosystem',exH:'Four perspectives.<br>One platform.',ex:[['Technology','Digital platform, data infrastructure, software and integration.'],['Sustainability & ESG','GRI-aligned maturity assessment, KPI sets and reporting.'],['Field & Validation','A measurement and validation network of accountants, lawyers and green finance experts.'],['Regulation & Finance','International standards, loan framework compliance and sustainable finance.']],
  ecoEb:'Founders and partners',ecoH:'Different expertise,<br>one goal.',ecoP:'Implika brings technology, field reach, legal and regulatory expertise and financial decision-making together in one structure.',
  eco:[['Technology & Platform','Sustainability platform and data infrastructure; GRI Licensed Software &amp; Tools Partner.'],['Founding Partner · Field & Validation','SME reach through its accountant network, field measurement and validation.'],['Founding Partner · Legal & Regulatory','The legal and regulatory side of sustainability; architecture for compliance with standards and loan frameworks.'],['Technology Partner','Platform development, technical infrastructure and integration.']],
  closeEb:'Our vision',closeH:'From sustainability maturity to financial value.',closeP:'Implika is the technology infrastructure that brings companies, banks and international financial institutions together around the same trusted data.'},

 const t=T(),n=t.nav,fo=t.footer,d=t.demo;
 document.getElementById('header-inner').innerHTML=`
 <a class="logo" href="#home" aria-label="${n.home}"><img src="${LOGO}" alt="${t.brand} — powered by BTS Dijital" class="logo-img" width="120" height="40"></a>
 <nav class="main-nav" id="main-nav" aria-label="${n.mainNav}">

 <div class="nav-actions">

  <button class="menu-button" type="button" aria-label="${n.menu}" aria-controls="main-nav" aria-expanded="false"><i data-i="menu" s="24"></i></button>
 </div>`;
 document.getElementById('footer-inner').innerHTML=`
 <div class="footer-top">
  <div><a class="logo" href="#home" aria-label="${n.home}"><img src="${LOGO}" alt="${t.brand} — powered by BTS Dijital" class="logo-img" width="120" height="40"></a><p>${fo.p}</p></div>
  <div class="footer-columns">
   <div><strong>${fo.c1}</strong><a href="#modules">${n.modules}</a><a href="#finance">${n.finance}</a><a href="#about">${n.about}</a><a href="#insights">${n.insights}</a></div>
   <div><strong>${fo.c2}</strong><a href="#companies">${n.companies}</a><a href="#institutions">${n.institutions}</a><a href="#ecosystem">${n.ecosystem}</a></div>
   <div><strong>${fo.c3}</strong><a href="#contact">${n.demo}</a><span>${fo.city}</span><a href="mailto:${EMAIL}">${EMAIL}</a></div>

 demoInner.innerHTML=`<button class="demo-close" type="button" aria-label="${d.close}" data-close><i data-i="x" s="20"></i></button>

  <label for="d-module">${d.module}<select id="d-module" name="${d.module}" data-role="module" required><option value="">${t.contact.f.select}</option>${MOD_META.map(m=>`<option>${t.mods[m.id].name}</option>`).join('')}</select></label>

const app=document.getElementById('app');
const demo=document.getElementById('demo');
const demoInner=document.getElementById('demo-inner');
let currentKey='home';
function closeMenus(){document.querySelectorAll('.nav-item.open').forEach(n=>{n.classList.remove('open');n.querySelector('button')?.setAttribute('aria-expanded','false')})}
function render(keepScroll){
 const key=(location.hash||'').replace(/^#\/?/,'')||'home';
 currentKey=PAGES[key]?key:'home';
 const page=PAGES[currentKey]();
 app.innerHTML=page.html;hydrate(app);
 document.title=currentKey==='home'?page.title:`${page.title} — ${T().brand}`;
 document.querySelectorAll('.nav-item>a').forEach(a=>a.classList.toggle('current',a.getAttribute('href')==='#'+currentKey));
 closeMenus();const nav=document.getElementById('main-nav');nav&&nav.classList.remove('open');
 if(!keepScroll)window.scrollTo(0,0);
}
function setLang(l){if(l===lang)return;lang=l;try{localStorage.setItem('implika-lang',l)}catch(_){}const wasOpen=!demo.hidden;renderChrome();render(true);if(wasOpen)openDemo()}
window.addEventListener('hashchange',()=>render(false));

document.addEventListener('click',e=>{
 const lb=e.target.closest('[data-lang]');if(lb){setLang(lb.dataset.lang);return}
 const nb=e.target.closest('.nav-item>button');
 if(nb){e.stopPropagation();const item=nb.parentElement;const was=item.classList.contains('open');closeMenus();if(!was){item.classList.add('open');nb.setAttribute('aria-expanded','true')}return}
 if(!e.target.closest('.nav-item'))closeMenus();
 const mb=e.target.closest('.menu-button');if(mb){const nav=document.getElementById('main-nav');const o=nav.classList.toggle('open');mb.setAttribute('aria-expanded',String(o));return}
 if(e.target.closest('[data-demo]')){openDemo();return}
 if(e.target===demo||e.target.closest('[data-close]')){closeDemo();return}
 const cb=e.target.closest('[data-copy]');if(cb)copyText(cb.dataset.copy,cb);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDemo();closeMenus()}});
function openDemo(){renderDemoForm();demo.hidden=false;demo.querySelector('input')?.focus()}
function renderDemoForm(){if(!demoInner.querySelector('form')){renderChrome()}}
function closeDemo(){demo.hidden=true}

async function copyText(text,btn){
 const label=btn.innerHTML,c=T().copy;
 try{await navigator.clipboard.writeText(text);btn.textContent=c.done}
 catch(_){const tgt=btn.closest('.sent')?.querySelector('pre')||btn.closest('.mail-line')?.querySelector('a');if(tgt){const r=document.createRange();r.selectNodeContents(tgt);const s=getSelection();s.removeAllRanges();s.addRange(r)}btn.textContent=c.sel}
 setTimeout(()=>{btn.innerHTML=label},2200);
}

document.addEventListener('submit',e=>{
 const f=e.target.closest('form[data-form]');if(!f)return;
 e.preventDefault();
 if(!f.checkValidity()){f.reportValidity();return}
 const t=T(),isDemo=f.dataset.form==='demo';
 const company=f.querySelector('[data-role="company"]').value.trim();
 const subject=isDemo?t.demo.subj(f.querySelector('[data-role="module"]').value,company):t.contact.subj(company);
 const msgEl=f.querySelector('[data-role="message"]');
 const lines=[...f.querySelectorAll('input,select')].filter(el=>el.value.trim()).map(el=>`${el.name}: ${el.value.trim()}`);
 if(msgEl)lines.push('',msgEl.value.trim());
 const body=lines.join('\n');
 const full=`${t.sent.to}: ${EMAIL}\n${t.sent.subject}: ${subject}\n\n${body}`;
 const mailto=`mailto:${EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
 const wrap=f.closest('[data-form-wrap]');
 wrap.innerHTML=`<div class="sent"><h3><i data-i="circle-check" s="22"></i>${t.sent.h}</h3><p>${t.sent.p}</p><pre></pre><div class="actions"><a class="button" href="${mailto}" target="_blank" rel="noopener">${t.sent.open} <i data-i="mail" s="16"></i></a><button class="button ghost" type="button" data-copy="">${t.sent.copy} <i data-i="copy" s="16"></i></button></div></div>`;
 wrap.querySelector('pre').textContent=full;
 wrap.querySelector('[data-copy]').dataset.copy=full;
 hydrate(wrap);
});

renderChrome();
render(false);
</script>

</body>
