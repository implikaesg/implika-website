*,:before,:after{box-sizing:border-box;border-width:0;border-style:solid;border-color:#e5e7eb}
html{line-height:1.5;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
h1,h2,h3,h4,p,figure,blockquote{margin:0;font-size:inherit;font-weight:inherit}
ul,ol{list-style:none;margin:0;padding:0}
img,svg{display:block;vertical-align:middle}
img{max-width:100%;height:auto}
button,input,select,textarea{font:inherit;color:inherit;margin:0;padding:0}
button{border:0;cursor:pointer;background:transparent}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid #7fae54;outline-offset:3px}

:root{font-family:Manrope,"Segoe UI",Helvetica,Arial,sans-serif;color:#17201d;background:#f4f5f0;font-synthesis:none;
--ink:#17201d;--muted:#66716c;--line:#d9ded7;--paper:#f4f5f0;--white:#fbfcf9;--forest:#173a2d;--green:#7fae54;--mint:#dcebd8;--orange:#c96443;
--mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace}
body{margin:0;min-width:320px;background:var(--paper);color:var(--ink);font-family:Manrope,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px}
h1,h2,h3{text-wrap:balance}
.container{width:min(1180px,calc(100% - 64px));margin:0 auto}

/* Header */
.site-header{height:88px;border-bottom:1px solid rgba(23,32,29,.08);position:relative;z-index:10;background:#f4f5f0f5}
.nav-wrap{height:100%;display:flex;align-items:center;justify-content:space-between;gap:28px}
.logo{width:170px;height:42px;display:inline-flex;align-items:center}
.logo-img{height:40px;width:auto;object-fit:contain}
.main-nav{display:flex;align-items:center;gap:22px;margin-left:auto}
.nav-item{position:relative}
.nav-item>a,.nav-item>button{display:flex;align-items:center;gap:5px;background:transparent;color:#4c5851;font-size:12px;font-weight:600;padding:16px 0;transition:color .2s}
.nav-item>a:hover,.nav-item>button:hover,.nav-item>a.current{color:var(--forest)}
.nav-item svg{transition:transform .2s}
.nav-item.open>button svg{transform:rotate(180deg)}
.dropdown{display:none;position:absolute;min-width:210px;top:47px;left:-18px;padding:8px;background:var(--white);border:1px solid var(--line);box-shadow:0 16px 34px #1a2c221a}
.nav-item.open .dropdown{display:grid}
.dropdown a{padding:11px 12px;font-size:12px;color:var(--muted)}
.dropdown a:hover{background:var(--mint);color:var(--forest)}
.dropdown-parent{font-weight:700;color:var(--forest)!important;border-bottom:1px solid var(--line);margin-bottom:4px}
.nav-actions{display:flex;align-items:center;gap:20px}
.button{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 20px;background:var(--forest);color:#fff;border:1px solid var(--forest);font-size:12px;font-weight:700;letter-spacing:.01em;transition:background .2s,transform .2s}
.button:hover{background:#245843;transform:translateY(-2px)}
.button-small{padding:11px 14px;font-size:11px}
.button svg{transition:transform .2s}
.button:hover svg{transform:translate(3px)}
.button.ghost{background:transparent;color:var(--forest)}
.button.ghost:hover{background:var(--mint)}
.text-link{display:inline-flex;align-items:center;gap:8px;color:var(--forest);font-weight:700;font-size:12px}
.text-link svg{transition:transform .2s}
.text-link:hover svg{transform:translate(3px,-3px)}
.menu-button{display:none;background:none;color:var(--forest);padding:5px}

/* Hero */
.hero{min-height:650px;background:var(--paper);position:relative;overflow:hidden}
.hero-grid{min-height:595px;display:grid;grid-template-columns:54% 46%;align-items:center}
.hero-grid>*{min-width:0}
.hero-copy{padding:72px 0 65px;position:relative;z-index:1;max-width:630px}
.eyebrow{display:flex;align-items:center;gap:9px;color:var(--orange);font:10px var(--mono);text-transform:uppercase;letter-spacing:.11em;margin-bottom:20px}
.eyebrow span{width:25px;height:1px;background:var(--orange);display:inline-block;flex:0 0 auto}
.hero h1{max-width:680px;color:var(--forest);font-size:clamp(46px,5vw,75px);line-height:1.02;letter-spacing:-.07em;margin:0 0 25px;font-weight:700}
h1 em,h2 em{color:var(--green);font-style:normal}
.hero-copy>p{color:var(--muted);line-height:1.8;max-width:550px;font-size:14px;margin:0 0 28px}
.hero-actions{display:flex;align-items:center;gap:27px;flex-wrap:wrap}
.hero-footnote{display:flex;gap:8px;align-items:center;color:#89948b;font:10px var(--mono);margin-top:57px}
.hero-art{height:530px;position:relative;display:flex;align-items:center;justify-content:center}
.data-visual{width:405px;height:405px;position:relative}
.visual-grid{position:absolute;top:11%;right:-12%;bottom:-9%;left:3%;opacity:.3;background-image:linear-gradient(#9daaa0 1px,transparent 1px),linear-gradient(90deg,#9daaa0 1px,transparent 1px);background-size:30px 30px;transform:perspective(600px) rotateX(57deg) rotate(-25deg);-webkit-mask-image:linear-gradient(to bottom,transparent,black 35%,transparent 90%);mask-image:linear-gradient(to bottom,transparent,black 35%,transparent 90%)}
.visual-orbit{position:absolute;border:1px solid #b2c5ad;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-28deg)}
.orbit-one{width:355px;height:160px}
.orbit-two{width:250px;height:360px;transform:translate(-50%,-50%) rotate(42deg);border-color:#cad8c5}
.visual-core{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);height:104px;width:104px;display:grid;align-content:center;justify-items:center;gap:5px;background:var(--forest);color:#fff;border-radius:50%;box-shadow:0 0 0 15px #7fae5421,0 0 0 40px #7fae540d}
.visual-core span{font:9px var(--mono);text-align:center;letter-spacing:.12em}
.visual-node{position:absolute;display:grid;place-items:center;background:var(--white);width:44px;height:44px;border-radius:50%;color:var(--orange);border:1px solid #cbd8c7;box-shadow:0 5px 15px #1e3f2d14}
.node-one{top:35px;left:58px}.node-two{top:85px;right:18px;color:#658e52}.node-three{bottom:40px;left:45px;color:#8b8066}
.visual-line{position:absolute;height:1px;background:#aec2a9;transform-origin:left}
.line-one{width:93px;left:95px;top:93px;transform:rotate(31deg)}
.line-two{width:87px;right:44px;top:118px;transform:rotate(157deg)}
.line-three{width:105px;left:79px;bottom:73px;transform:rotate(-28deg)}
.art-label{position:absolute;font:9px var(--mono);letter-spacing:.17em;color:#8b978b;line-height:1.7}
.art-label strong{color:var(--forest);font-weight:500}
.label-top{top:45px;right:18px}.label-bottom{bottom:22px;left:20px}
.label-bottom span{color:var(--orange);padding:0 5px}
.hero-scroll{position:absolute;bottom:22px;left:max(32px,calc((100vw - 1180px)/2));display:flex;align-items:center;gap:11px;color:#9da9a0;font:10px var(--mono)}
.hero-scroll div{width:55px;height:1px;background:#b7c3ba}
.hero-scroll span:first-child{color:var(--forest)}
@media (prefers-reduced-motion:no-preference){
 .orbit-one{animation:spin1 40s linear infinite}.orbit-two{animation:spin2 55s linear infinite}
 @keyframes spin1{to{transform:translate(-50%,-50%) rotate(332deg)}}
 @keyframes spin2{to{transform:translate(-50%,-50%) rotate(-318deg)}}
}

/* Sections */
.flow-section,.audience-section,.all-products{background:var(--white)}
.flow-section{padding:115px 0 120px}
.section-heading.centered{text-align:center;max-width:680px;margin:0 auto 62px}
.section-heading.centered .eyebrow{justify-content:center}
.section-heading h2,.section-heading.split h2{color:var(--forest);font-size:clamp(30px,3.3vw,48px);line-height:1.08;letter-spacing:-.06em;margin:0;font-weight:700}
.section-heading p{color:var(--muted);font-size:13px;line-height:1.8;margin:17px auto 0;max-width:530px}
.flow-line{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.flow-step{position:relative;padding:25px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.flow-step:not(:last-child):after{content:"";position:absolute;right:0;top:0;height:100%;width:1px;background:var(--line)}
.flow-step>svg{position:absolute;right:-8px;top:50%;color:var(--green);background:var(--white);z-index:1}
.flow-step span,.product-index,.large-number{color:var(--orange);font:10px var(--mono)}
.flow-step strong{color:var(--forest);font-size:14px}
.solutions-section{padding:123px 0;background:var(--paper)}
.solutions-section.compact{padding:90px 0}
.section-heading.split{display:flex;align-items:flex-end;justify-content:space-between;gap:50px;margin-bottom:55px}
.section-heading.split>div{max-width:650px}
.section-heading.split p{margin:0;width:330px;font-size:13px;line-height:1.75}
.solution-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card-layer{display:block;color:var(--orange);font:9px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin:4px 0 8px}.status.layer{color:var(--forest);border-color:var(--line)}.mod-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--forest);margin:0 0 40px}.mod-facts.wide{margin:0 0 56px}.mod-fact{padding:22px 20px 22px 0}.mod-fact strong{display:block;color:var(--forest);font-size:34px;line-height:1.05;letter-spacing:-.04em;font-weight:700;margin-bottom:8px}.mod-fact span{display:block;color:var(--muted);font-size:12px;line-height:1.5}.trust-section{padding:96px 0;border-top:1px solid var(--line)}.evidence-grid{margin-bottom:48px}.trust-grid{margin-top:8px}
.solution-card{min-height:310px;padding:25px 22px;background:var(--white);border:1px solid #e4e8e1;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s,background .25s}
.solution-card:hover{transform:translateY(-6px);background:var(--forest);color:#fff;box-shadow:0 18px 34px #153b2c24}
.card-top{display:flex;justify-content:space-between;color:var(--green);margin-bottom:45px}
.solution-card:hover .card-top{color:#a9ce89}
.card-top span{font:10px var(--mono)}
.solution-card h3{font-size:18px;letter-spacing:-.04em;color:var(--forest);margin:0 0 15px;font-weight:700}
.solution-card:hover h3{color:#fff}
.solution-card p{color:var(--muted);font-size:12px;line-height:1.7;margin:0 0 24px}
.solution-card:hover p{color:#c3d3c9}
.card-link{display:flex;align-items:center;gap:7px;margin-top:auto;color:var(--forest);font-size:11px;font-weight:700}
.solution-card:hover .card-link{color:#fff}
.audience-section{padding:115px 0}
.audience-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.audience-card{padding:42px;background:var(--mint);position:relative;overflow:hidden;min-height:330px}
.audience-card:nth-child(2){background:#e7e7da}
.audience-icon{color:var(--forest);margin-bottom:47px}
.audience-card h3{color:var(--forest);font-size:26px;margin:0 0 12px;letter-spacing:-.05em;font-weight:700}
.audience-card p{color:#5c6d60;font-size:13px;line-height:1.75;max-width:420px}
.audience-card ul{display:flex;flex-wrap:wrap;gap:9px 21px;padding:11px 0 20px;margin:0;color:#56675b;font-size:11px}
.audience-card li{display:flex;align-items:center;gap:7px}
.audience-card li svg{color:var(--orange)}
.products-section{padding:117px 0;background:var(--paper)}
.product-list{border-top:1px solid var(--line)}
.product-row{min-height:90px;display:grid;grid-template-columns:60px 1.2fr 2fr 150px 24px;align-items:center;gap:20px;border-bottom:1px solid var(--line);transition:padding .2s,background .2s}
.product-row:hover{padding:0 16px;background:var(--white)}
.product-row>svg{color:var(--green)}
.product-name{color:var(--forest);font-size:16px;font-weight:700}
.product-description{color:var(--muted);font-size:11px;line-height:1.5}
.status{justify-self:start;padding:6px 9px;border:1px solid #cbd2ca;color:#7b867d;font:9px var(--mono)}
.status.available{color:#5e8c48;border-color:#b9d2ad}
.cta-band{background:var(--forest);color:#fff;padding:92px 0;position:relative;overflow:hidden}
.cta-band:after{content:"";position:absolute;width:420px;height:420px;border:1px solid rgba(177,210,155,.2);border-radius:50%;right:8%;top:-130px;box-shadow:0 0 0 54px #b1d29b0d,0 0 0 112px #b1d29b08}
.cta-inner{display:flex;align-items:center;justify-content:space-between;gap:30px;position:relative;z-index:1}
.cta-band .eyebrow,.accent-intro .eyebrow,.about-closing .eyebrow,.iaas-section .eyebrow{color:#a8cb8c}
.cta-band .eyebrow span,.accent-intro .eyebrow span,.about-closing .eyebrow span,.iaas-section .eyebrow span{background:#a8cb8c}
.cta-band h2{font-size:clamp(34px,4.2vw,58px);line-height:1.06;letter-spacing:-.06em;margin:0;font-weight:700}
.cta-band h2 em{color:#a8cb8c}
.cta-band .button{background:#b0d28d;color:var(--forest);border-color:#b0d28d}
.cta-band .button:hover{background:#fff}

/* Inner pages */
.page-intro{padding:100px 0 105px;background:var(--paper)}
.page-intro h1{color:var(--forest);max-width:820px;font-size:clamp(44px,5.2vw,72px);line-height:1.03;letter-spacing:-.07em;margin:0 0 25px;font-weight:700}
.page-intro p{color:var(--muted);font-size:15px;line-height:1.8;max-width:650px;margin:0}
.accent-intro{background:var(--forest)}
.accent-intro h1{color:#fff}
.accent-intro p{color:#bfcec2}
.detail-section{background:var(--white);padding:125px 0}
.detail-grid{display:grid;grid-template-columns:minmax(0,37fr) minmax(0,63fr);gap:80px}
.feature-icon{display:grid;place-items:center;width:55px;height:55px;color:var(--orange);border:1px solid #dfc8be;margin-bottom:55px}
.detail-sticky .large-number{font-size:13px}
.detail-sticky h2{color:var(--forest);font-size:42px;line-height:1.04;letter-spacing:-.065em;margin:16px 0;font-weight:700}
.detail-content{padding-top:25px;min-width:0}
.content-block{margin-bottom:58px}
.lead{color:var(--forest);font-size:22px;line-height:1.45;letter-spacing:-.035em;margin:0}
.content-block h3{color:var(--forest);font-size:24px;margin:0 0 15px;letter-spacing:-.04em;font-weight:700}
.content-block p:not(.lead){color:var(--muted);line-height:1.8;font-size:14px;max-width:600px}
.capability-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 20px;margin-bottom:65px;border-top:1px solid var(--line)}
.capability{display:flex;gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}
.capability span{color:var(--orange);font:10px var(--mono);padding-top:3px}
.capability strong{color:var(--forest);font-size:13px}
.about-story{background:var(--white);padding:125px 0}
.about-story.alt{background:var(--paper)}
.about-story.alt .story-aside .large-number{color:var(--green)}
.expertise-icon{display:grid;place-items:center;width:44px;height:44px;color:var(--orange);border:1px solid #dfc8be;margin:18px 0 0}
.about-closing{background:var(--forest);color:#fff;padding:95px 0}
.about-closing h2{font-size:clamp(34px,4vw,54px);line-height:1.06;letter-spacing:-.065em;margin:0 0 20px;font-weight:700}
.about-closing p{color:#bfcec2;font-size:15px;line-height:1.8;max-width:620px;margin:0}
.about-board{background:var(--white);padding-top:120px}
.story-grid{display:grid;grid-template-columns:minmax(0,32fr) minmax(0,68fr);gap:80px}
.story-aside .large-number{display:block;font-size:13px;margin-bottom:95px}
.story-copy{min-width:0}
.story-copy h2{color:var(--forest);max-width:680px;font-size:45px;line-height:1.06;letter-spacing:-.065em;margin:0 0 27px;font-weight:700}
.story-copy p{color:var(--muted);font-size:14px;line-height:1.9;max-width:680px}
.story-copy p+p{margin-top:16px}
.expertise-section,.ecosystem-section{padding:120px 0;background:var(--paper)}
.expertise-grid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.expertise-item{padding:25px 24px 10px 0;border-right:1px solid var(--line);margin-right:24px}
.expertise-item:last-child{border:0;margin-right:0}
.expertise-item>span{color:var(--orange);font:10px var(--mono)}
.expertise-item h3{color:var(--forest);font-size:18px;letter-spacing:-.04em;margin:45px 0 13px;font-weight:700}
.expertise-item p,.ecosystem-card p{color:var(--muted);font-size:12px;line-height:1.7}
.ecosystem-section{background:var(--white)}
.ecosystem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.ecosystem-card{min-height:285px;padding:25px 20px;border:1px solid var(--line)}
.ecosystem-brand{height:42px;color:var(--orange);font:11px var(--mono)}
.mini-brand{display:grid;place-items:center;height:29px;width:29px;background:var(--forest);color:#fff;font:16px Manrope,sans-serif}
.ecosystem-card h3{color:var(--forest);font-size:19px;letter-spacing:-.05em;margin:28px 0 8px;font-weight:700}
.ecosystem-card strong{color:var(--green);font-size:11px}
.ecosystem-card p{margin-top:16px}
.audience-detail{background:var(--white);padding:125px 0}
.audience-detail-grid{display:grid;grid-template-columns:minmax(0,46fr) minmax(0,54fr);gap:90px}
.audience-detail-grid h2{color:var(--forest);font-size:43px;line-height:1.06;letter-spacing:-.065em;margin:0;font-weight:700}
.audience-detail-grid>div:last-child{padding-top:34px;min-width:0}
.check-list{padding:18px 0 25px;margin:24px 0 0;border-top:1px solid var(--line)}
.check-list li{display:flex;align-items:center;gap:13px;color:var(--forest);font-size:13px;padding:11px 0;border-bottom:1px solid var(--line)}
.check-list li span{display:grid;place-items:center;height:21px;width:21px;border-radius:50%;background:var(--mint);color:var(--green);flex:0 0 auto}
.board-section{background:var(--white);padding:115px 0 140px}
.board-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}
.board-card{border:1px solid var(--line);padding:16px}
.portrait{height:330px;background:#dfe7dc;position:relative;display:grid;place-items:center;overflow:hidden}
.portrait:after{content:"";height:215px;width:215px;border:1px solid rgba(23,58,45,.25);border-radius:50%;position:absolute}
.portrait span{position:relative;z-index:1;color:var(--forest);font-size:48px;font-weight:700;letter-spacing:-.1em}
.portrait-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(23,58,45,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(23,58,45,.1) 1px,transparent 1px);background-size:28px 28px;opacity:.35;transform:rotate(18deg) scale(1.4)}
.board-index{display:block;margin-top:24px;color:var(--orange);font:10px var(--mono)}
.board-card h2{color:var(--forest);font-size:20px;letter-spacing:-.05em;margin:13px 0 7px;font-weight:700}
.board-card p{color:var(--green);font-size:11px;margin:0 0 12px}
.insights-videos{background:var(--white);padding:100px 0 80px}
.video-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.video-card{border:1px solid var(--line);background:var(--paper);overflow:hidden;transition:transform .25s,box-shadow .25s}
.video-card:hover{transform:translateY(-5px);box-shadow:0 14px 28px #173a2d1a}
.video-thumb{height:180px;background:var(--forest);position:relative;display:grid;place-items:center}
.play-btn{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:#ffffff26;border:1px solid rgba(255,255,255,.3);color:#fff;transition:background .2s,transform .2s}
.video-card:hover .play-btn{background:var(--green);transform:scale(1.1)}
.video-topic{position:absolute;top:12px;left:12px;font:9px var(--mono);color:#a8cb8c;letter-spacing:.12em;text-transform:uppercase}
.video-meta{padding:18px 16px 22px}
.video-meta strong{display:block;color:var(--forest);font-size:14px;line-height:1.35;letter-spacing:-.03em;margin-bottom:7px}
.video-meta span{color:var(--muted);font-size:11px}
.insights-articles{background:var(--paper);padding:80px 0 120px}
.article-list{border-top:1px solid var(--line)}
.article-row{display:grid;grid-template-columns:130px 1fr 90px 22px;align-items:center;gap:20px;padding:24px 0;border-bottom:1px solid var(--line);transition:padding .2s,background .2s}
.article-row:hover{padding:24px 14px;background:var(--white)}
.article-tag{color:var(--orange);font:9px var(--mono);text-transform:uppercase;letter-spacing:.1em}
.article-row strong{color:var(--forest);font-size:15px;letter-spacing:-.03em}
.article-date{color:var(--muted);font:10px var(--mono)}
.article-row svg{color:var(--green)}
.iaas-section{background:var(--forest);color:#fff;padding:90px 0}
.iaas-grid{display:grid;grid-template-columns:minmax(0,38fr) minmax(0,62fr);gap:70px;align-items:center}
.iaas-section h2{color:#fff;font-size:clamp(28px,3vw,42px);line-height:1.08;letter-spacing:-.06em;margin:0;font-weight:700}
.iaas-body p{color:#bfcec2;font-size:14px;line-height:1.85;margin:0 0 28px}
.iaas-pills{display:flex;flex-wrap:wrap;gap:10px}
.iaas-pills span{padding:8px 16px;border:1px solid rgba(168,203,140,.3);color:#a8cb8c;font:11px var(--mono);border-radius:99px}

/* Forms */
.demo-overlay{position:fixed;inset:0;background:#17201d99;backdrop-filter:blur(4px);z-index:1000;display:grid;place-items:center;padding:20px;overflow-y:auto}
.demo-modal{background:var(--white);max-width:480px;width:100%;padding:40px;position:relative;box-shadow:0 24px 60px #173a2d33}
.demo-close{position:absolute;top:16px;right:16px;color:var(--muted);padding:4px}
.demo-close:hover{color:var(--forest)}
.demo-header h2{color:var(--forest);font-size:28px;line-height:1.1;letter-spacing:-.05em;margin:0;font-weight:700}
.form{display:grid;gap:22px}
.demo-modal .form{margin-top:28px;gap:20px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.form label{display:grid;gap:9px;color:var(--forest);font-size:11px;font-weight:700}
.form input,.form textarea,.form select{width:100%;border:0;border-bottom:1px solid #cbd3cb;background:transparent;color:var(--ink);padding:10px 0;outline:none;border-radius:0;resize:vertical;font-weight:500;font-size:14px}
.form input:focus,.form textarea:focus,.form select:focus{border-color:var(--green)}
.form .button{justify-self:start;margin-top:8px}
.demo-modal .form .button{justify-self:stretch}
.form small{color:#89948b;font-size:10px;line-height:1.5}
.contact-section{background:var(--white);padding:120px 0}
.contact-grid{display:grid;grid-template-columns:minmax(0,38fr) minmax(0,62fr);gap:95px}
.contact-grid>*{min-width:0}
.contact-aside h2{color:var(--forest);font-size:42px;line-height:1.06;letter-spacing:-.065em;margin:0 0 24px;font-weight:700}
.contact-aside>p{color:var(--muted);line-height:1.8;font-size:13px}
.contact-mail{display:grid;gap:8px;margin-top:36px;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.contact-mail small{color:var(--orange);font:10px var(--mono);text-transform:uppercase;letter-spacing:.11em}
.mail-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mail-line a{color:var(--forest);font-size:20px;font-weight:700;letter-spacing:-.03em;user-select:all}
.copy-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);padding:6px 10px;color:var(--forest);font:10px var(--mono);background:var(--white)}
.copy-btn:hover{background:var(--mint)}
.contact-note{display:flex;gap:11px;color:#718074;font-size:11px;line-height:1.5;margin-top:36px}
.contact-note svg{flex:0 0 auto;color:var(--green)}
.sent{display:grid;gap:16px;padding:26px;background:var(--mint)}
.sent h3{color:var(--forest);font-size:20px;letter-spacing:-.04em;font-weight:700;display:flex;gap:10px;align-items:center}
.sent h3 svg{color:var(--green)}
.sent p{color:#4c5851;font-size:13px;line-height:1.7}
.sent pre{margin:0;white-space:pre-wrap;word-break:break-word;background:var(--white);border:1px solid #c9dcc4;padding:14px;font:12px/1.6 var(--mono);color:var(--ink);max-height:220px;overflow:auto}
.sent .actions{display:flex;gap:12px;flex-wrap:wrap}

/* Footer */
.site-footer{background:#122c23;color:#c6d2c8;padding:75px 0 25px}
.footer-top{display:grid;grid-template-columns:1fr 1fr;gap:80px;padding-bottom:75px}
.footer-top>div>p{max-width:315px;color:#92a499;font-size:11px;line-height:1.8;margin-top:27px}
.footer-columns{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.footer-columns>div{display:flex;flex-direction:column;gap:13px;min-width:0}
.footer-columns strong{color:#96c57a;font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.footer-columns a,.footer-columns span{color:#aebcb1;font-size:11px}
.footer-columns a:hover{color:#fff}
.footer-bottom{display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(201,218,204,.16);padding-top:23px;color:#84978b;font:10px var(--mono)}
.socials{display:flex;gap:14px}
.socials a{display:grid;place-items:center;color:#aebcb1}
.socials a:hover{color:#fff}

/* ---- Astrolabe (hero background) ---- */
.astro-wrap{position:absolute;left:50%;top:50%;width:780px;height:853px;transform:translate(-50%,-52%);pointer-events:none;color:var(--forest);opacity:.075;z-index:0}

.legal-links a{color:inherit}.legal-links a:hover{text-decoration:underline}
@media (max-width:1080px){.sc-steps{grid-template-columns:repeat(2,minmax(0,1fr))}.sc-phases{display:none}.sc-ph{display:block}.sc-step{min-height:0}.sc-num{margin-bottom:4px}.levels-section .levels-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

   caps:['Tek tedarikçi kaydı; müşteriye ve markaya özel gereksinim profilleri','Kategori ve tier bazlı tedarikçi tanımı, kritiklik','Merkezi soru havuzundan dinamik denetim formları','Soruya bağlı kanıt ve belge yükleme','Belge geçerlilik takibi ve otomatik uyarılar','Kural tabanlı skor, insan onaylı yapay zekâ sınıflandırması','Sorumlu ve terminle aksiyon; kanıtla kapanış','Etiketlerle bölge, marka ve kategori bazlı raporlar','Tedarikçi performans karşılaştırması','Kapsam 3 verisi (emisyon hesaplama entegrasyonuyla)'],
   how:'Tedarikçiler kategori, tier, sektör ve kritiklik bilgileriyle tanımlanır ve platforma davet edilir. Müşteri ve marka gereksinimleri soruya dönüştürülür; her tedarikçiye profiline uygun dinamik form gönderilir. Yanıtlar ve kanıtlar kural tabanlı skorlama motorunda puanlanır, yapay zekânın emin olmadığı her sonuç insan onayına düşer. Uyumsuzluklara sorumlu ve termin atanır; aksiyon ancak kanıtla kapanır. Belgelerin geçerlilik süresi yaklaştığında sistem uyarır. Alıcı, ağının uyum ve performans görünümüne, raporlara ve Kapsam 3 verisine tek yerden ulaşır.'},

 financePage:{title:'Sürdürülebilir Finans',eb:'Sürdürülebilir Finans',h1:'KOBİ’leri sürdürülebilirlik bağlantılı finansmana bağlıyoruz.',p:'İmplika, uluslararası finans kaynaklarının sürdürülebilirlik bağlantılı krediler (SLL) aracılığıyla KOBİ’lere işletme sermayesi olarak ulaşabilmesi için gereken ölçüm, izleme ve raporlama altyapısını sağlar.',
  pEb:'Sorun',pH:'Yeşil finansman KOBİ’ye neden ulaşamıyor?',pP:['Uluslararası finans kuruluşlarının (IFI) sağladığı kaynaklar, Türkiye’de bankaların kurumsal kredi portföyünde önemli bir yer tutuyor. Ancak bu kaynaklardan sağlanan yeşil ve sosyal krediler proje bazlıdır; finansman belirli bir yeşil dönüşüm projesine bağlanır.','KOBİ’nin asıl ihtiyacı ise işletme sermayesidir. Sürdürülebilirlik bağlantılı krediler proje şartı taşımaz; fakat olgunluk ölçümü ve KPI takibi bugüne kadar pahalı ve uzun süreçler olduğu için bu krediler çoğunlukla büyük şirketlere gidiyor.'],

  flowEb:'Program nasıl işler?',flowH:'Beş adımda sürdürülebilirlik bağlantılı finansman.',
  steps:[['Program çerçevesi','IFI ve katılımcı bankalar kaynağı, KPI setini ve koşulları belirler'],['Ölçüm ve skor','KOBİ, İmplika’da olgunluk ölçümünü tamamlar'],['Kredi değerlendirmesi','Skor bankayla paylaşılır; kredi kararını banka verir'],['İzleme ve doğrulama','KPI’lar izlenir, yetkin uzmanlarca doğrulanır ve raporlanır'],['Gelişim ve avantaj','Skor yükseldikçe program koşullarına göre avantaj sağlanabilir']],

  stdEb:'Uluslararası çerçevelerle uyumlu',stdH:'Standartlara dayalı ölçüm ve izleme.',stdP:'Olgunluk ölçümü uluslararası sürdürülebilirlik çerçevelerine, KPI seti ise sürdürülebilirlik bağlantılı kredilere yönelik uluslararası ilkelere dayanır. Hangi KPI’ların uygulanacağına program çerçevesinde karar verilir.',stdPills:['LMA / APLMA / LSTA SLL İlkeleri','KOBİ’lere özel kriter seti','Programa göre seçilen KPI kütüphanesi']},
 companies:{title:'KOBİ’ler ve Şirketler',eb:'KOBİ’ler ve şirketler için',h1:'Olgunluğunuzu ölçün, finansmana ve pazarlara hazırlanın.',p:'KOBİ’ler, ihracatçılar, tedarikçiler ve kurumsal şirketler için olgunluk ölçümü, gelişim yol haritası ve KPI takibi.',h2:'Sürdürülebilirliği bir yük değil, avantaj hâline getirin.',lead:'İmplika, şirketinizin bugün nerede durduğunu ölçer, neyi geliştirmeniz gerektiğini gösterir ve bu gelişimi finansmana ve ticari fırsatlara bağlar.',list:['Sürdürülebilirlik olgunluk skorunuzu öğrenin','Önerilen aksiyonlar ve eğitimlerle gelişin','KPI’larınızı tek platformda izleyin','Sürdürülebilirlik bağlantılı finansmana hazırlanın','AB ihracat kriterlerine ve SKDM’ye hazırlanın','Kurumsal raporlama (TSRS) girdilerinizi yönetin'],btn:'Nasıl çalıştığını görün'},
 institutions:{title:'Bankalar ve IFI’lar',eb:'Bankalar ve uluslararası finans kuruluşları için',h1:'Sürdürülebilirlik bağlantılı krediyi KOBİ ölçeğinde ölçülebilir kılın.',p:'Bankalar ve uluslararası finans kuruluşları için olgunluk skoru, KPI izleme, doğrulama ve raporlama altyapısı.',h2:'Güvenilir veriyle daha geniş bir KOBİ kitlesine ulaşın.',lead:'İmplika, KOBİ’nin sürdürülebilirlik olgunluğunu kredi sürecinin başında görünür kılar ve kredi süresince KPI’ları izlenebilir ve raporlanabilir hâle getirir.',list:['Olgunluk skoruyla ön değerlendirme','Kredi süresince KPI izleme ve raporlama','Kanıt seviyeli veri ve katmanlı doğrulama','KOBİ eğitimi ve gelişim platformu','Firma düzeyinde etki ölçümü','API ile bankacılık sistemlerine entegrasyon'],note:'Kredi kararı, fiyatlama ve risk değerlendirmesi tamamen bankanındır. İmplika skoru, KOBİ’nin değerlendirmeye alınması için bir ön kapıdır.',btn:'Nasıl çalıştığını görün'},
 ecosystem:{title:'Ekosistem Sahipleri',eb:'Ekosistem sahipleri için',h1:'Tedarikçi ve satıcı ağınızın olgunluğunu yükseltin.',p:'Tedarikçi ve satıcı ağı olan büyük şirketler, pazaryerleri ve sektör birlikleri için sürdürülebilirlik ve finansmana erişim programı.',h2:'Ağınız güçlendikçe siz de güçlenirsiniz.',lead:'Ekosistem sahibi programı ağına duyurur ve sahiplenir; İmplika ölçümü, gelişimi ve izlemeyi üstlenir. Ağınız hem sürdürülebilirlik olgunluğu hem de finansal dayanıklılık kazanır.',list:['Programı tedarikçi ve satıcı ağınıza duyurun','Ağınızın olgunluk gelişimini izleyin','Kapsam 3 verisine tek yerden ulaşın','Ağınızın uygun finansmana erişimini kolaylaştırın','Ağınızı AB mevzuatına ve ihracat kriterlerine hazırlayın'],note:'Ekosistem sahibi kredi kanalı ya da risk taşıyan taraf değildir. Rolü, programı duyurmak ve ağına erişimi kolaylaştırmaktır.',btn:'Nasıl çalıştığını görün'},
 about:{title:'Hakkımızda',eb:'İmplika hakkında',filmEb:'Tanıtım filmi',filmH:'İmplika’yı <em>90 saniyede</em> tanıyın.',filmP:'Yeşil dönüşümü ölçülebilir ve finanse edilebilir kılan platformumuzu kısa filmimizle keşfedin.',filmTR:'Türkçe',filmEN:'English',filmDur:'90 sn',h1:'Veri, uzmanlık ve finans arasında köprü kuruyoruz.',p:'İmplika, KOBİ’lerin ve şirketlerin sürdürülebilirlik olgunluğunu ölçen, geliştiren ve finansmana bağlayan bir sürdürülebilirlik teknolojisi platformudur.',
  s1eb:'İmplika kimdir?',s1h:'Sistem Global ve BTS’nin girişimiyle kurulduk.',s1p:['İmplika A.Ş., Sistem Global ve BTS’nin girişimiyle kuruldu. BTS’nin sürdürülebilirlik ve ESG’nin hukuk ve regülasyon tarafındaki birikimiyle, NTT DATA ile birlikte platformumuzu geliştirdik. İmplika, GRI Licensed Software &amp; Tools Partner’dır.','Platform; şirketlerin sürdürülebilirlik olgunluğunu ölçmesini, geliştirmesini ve KPI’larını izlemesini sağlarken, bankaların ve uluslararası finans kuruluşlarının bu veriyi kredi süreçlerinde kullanmasına olanak tanır.'],
  s2eb:'Çıkış noktamız',s2h:'Sürdürülebilirlik neden yalnızca büyük şirketlerin konusu olsun?',s2p:['Sürdürülebilirlik ölçümü ve raporlaması bugüne kadar pahalı ve uzun süreçler gerektirdi. Bu yüzden sürdürülebilirlik bağlantılı finansman da çoğunlukla büyük şirketlere ulaştı.','Amacımız, KOBİ’lerin de sürdürülebilirlik olgunluklarını kolay ve erişilebilir şekilde ölçebilmesini, geliştirebilmesini ve bu gelişimi finansmana ve yeni pazarlara dönüştürebilmesini sağlamak.'],
  exEb:'Uzmanlık ekosistemimiz',exH:'Dört bakış açısı.<br>Tek platform.',ex:[['Teknoloji','Dijital platform, veri altyapısı, yazılım ve entegrasyon.'],['Sürdürülebilirlik ve ESG','Olgunluk ölçümü, KPI setleri ve raporlama.'],['Saha ve Ön İnceleme','Mali müşavir, hukukçu ve yeşil uzmanlardan oluşan saha ve ön inceleme ağı; doğrulama bağımsızlık kurallarına bağlı uzmanlarca yapılır.'],['Regülasyon ve Finans','Uluslararası standartlar, kredi çerçevelerine uyum ve sürdürülebilir finansman.']],
  ecoEb:'Kurucular ve ortaklar',ecoH:'Farklı uzmanlıklar,<br>aynı hedef.',ecoP:'İmplika; teknolojiyi, sahadaki erişim gücünü, hukuk ve regülasyon birikimini ve finansal karar alma süreçlerini aynı yapıda buluşturur.',
  eco:[['Teknoloji ve Platform','Sürdürülebilirlik platformu ve veri altyapısı; GRI Licensed Software &amp; Tools Partner.'],['Kurucu Ortak · Saha ve Ön İnceleme','Mali müşavir ağıyla KOBİ’lere erişim, saha desteği ve ön inceleme.'],['Kurucu Ortak · Hukuk ve Regülasyon','Sürdürülebilirliğin hukuk ve regülasyon tarafı; standartlara ve kredi çerçevelerine uyum mimarisi.'],['Teknoloji Ortağı','Platform geliştirme, teknik altyapı ve entegrasyon.']],
  closeEb:'Vizyonumuz',closeH:'Sürdürülebilirlik olgunluğundan finansal değere.',closeP:'İmplika; şirketleri, bankaları ve uluslararası finans kuruluşlarını aynı güvenilir veri üzerinde buluşturan teknoloji altyapısı olarak konumlanır.'},
 aboutNav:{company:'Şirket hakkında',gov:'Kurumsal yönetişim',who:'İmplika Kimdir?',origin:'Çıkış Noktamız',vision:'Vizyon &amp; Misyon',values:'Değerlerimiz',eco:'Uzmanlık Ekosistemimiz',board:'Yönetim Kurulu',advisory:'Danışma Kurulu',team:'Ekip',lead:'Veri, uzmanlık ve finans arasında köprü kuruyoruz.',all:'Genel bakış'},
 vm:{eb:'Vizyon &amp; Misyon',h:'Sürdürülebilirlik olgunluğundan finansal değere.',vT:'Vizyonumuz',v:'Sürdürülebilirlik verisinin, her ölçekteki şirket için finansmana ve yeni pazarlara erişimin ortak dili olduğu bir ekonomi.',mT:'Misyonumuz',m:'KOBİ’lerin ve şirketlerin sürdürülebilirlik olgunluğunu güvenilir, doğrulanabilir ve erişilebilir biçimde ölçmek; bu veriyi bankalar ve uluslararası finans kuruluşları için karar alınabilir hale getirerek yeşil dönüşümü finanse edilebilir kılmak.'},
 values:{eb:'Değerlerimiz',h:'Bizi yönlendiren ilkeler.',items:[['Güvenilir veri','Ölçtüğümüz her veri izlenebilir, doğrulanabilir ve uluslararası standartlarla uyumludur.'],['Erişilebilirlik','Sürdürülebilirliği büyük şirketlerin ayrıcalığı olmaktan çıkarıp her ölçekteki işletme için ulaşılabilir kılarız.'],['Şeffaflık','Metodolojimizi, skorlarımızı ve süreçlerimizi paydaşlarımızla açıkça paylaşırız.'],['Ölçülebilir etki','Başarıyı raporla değil; finansmana erişim, gelişen KPI’lar ve gerçek dönüşümle ölçeriz.']]},
 gov:{title:'Kurumsal Yönetişim',eb:'Kurumsal yönetişim',h1:'Güçlü yönetişim, uzun vadeli değer.',p:'İmplika’nın stratejik yönünü belirleyen Yönetim Kurulu, danışma sürecine katkı sunan Danışma Kurulu ve platformu hayata geçiren ekibimiz.'},
 meth:{title:'Metodoloji',eb:'Metodoloji',h1:'Skor nasıl hesaplanır?',p:'İmplika skoru; çevre, sosyal ve yönetişim başlıklarını kapsayan bir soru seti, kanıt seviyeli yanıtlar, katmanlı doğrulama ve programa göre seçilen KPI’larla dönemsel izlemeden oluşur. Skor kural tabanlı hesaplanır; şirketin ve bankanın aynı skora güvenebilmesi için her puan izlenebilirdir.',
  stepsEb:'Beş adımda skor',stepsH:'Sorudan doğrulanmış veriye.',
  steps:[['Soru seti','Çevre, sosyal ve yönetişim başlıklarını kapsayan, şirketin ölçeğine ve sektörüne göre uyarlanan soru seti: kurumsal şirketler için GRI Standartlarına dayanan genişletilmiş set, KOBİ’ler için sadeleştirilmiş Lite set.'],['Yanıt ve kanıt','Evet/hayır, çoktan seçmeli, sayısal ve belge yüklemeli yanıt tipleri. Belgeyle desteklenen yanıtlar skora daha yüksek güvenle yansır.'],['Puanlama','Her soru önem derecesine göre ağırlıklandırılır; başlık skorları ve genel olgunluk skoru hesaplanır, şirket bir olgunluk seviyesine yerleştirilir.'],['Doğrulama','Platform her veriyi otomatik kontrol eder; kanıtlar KPI türüne göre yetkin uzmanlarca incelenip onaylanır, gerektiğinde akredite bir kuruluş doğrular. Onaylanan veri platformda doğrulanmış olarak işaretlenir.'],['İzleme ve raporlama','LMA SLL İlkeleri ile uyumlu KPI kütüphanesinden programa göre seçilen KPI’lar dönemsel olarak izlenir; skor güncellenir, raporlar banka ve paydaşlarla paylaşılmaya hazır hâle gelir.']],
  evEb:'Güven katmanı',evH:'Her veri noktasının bir kanıt seviyesi var.',evP:'Skorun ne kadar güvenilir olduğu, dayandığı kanıta bağlıdır. İmplika her veri noktasını dört kanıt seviyesinden birine yerleştirir; doğrulama ilerledikçe skorun güven seviyesi yükselir.',
  nums:[['1.204','GRI Standartlarına eşlenmiş aktif soru'],['63','soruluk KOBİ (Lite) seti'],['0–3','kanıt seviyesi'],['0–100','olgunluk skoru, beş seviye']],
  ev:[['Beyan','Şirketin kendi yanıtı; destekleyici belge yok.'],['Belge','Yanıt; fatura, politika, sertifika gibi bir belgeyle destekleniyor.'],['Uzman doğrulaması','Kanıt, KPI türüne göre yetkin bir uzman (mali müşavir ya da teknik/ESG uzmanı) tarafından incelenip onaylandı.'],['Akredite doğrulama','Veri, akredite bağımsız bir kuruluş tarafından doğrulandı (ör. ISO 14064 sera gazı doğrulaması); gerektiğinde devreye girer.']],
  vEb:'Doğrulama modeli',vH:'Üç katmanda doğrulama.',vP:'Her veri, kullanıldığı kararın gerektirdiği kadar doğrulanır. Doğrulamanın derinliği programa ve kredi büyüklüğüne göre belirlenir.',
  vl:[['Sistem kontrolü','Zorunlu alan, birim, tutarlılık, önceki döneme göre sapma ve kanıtın yüklenip yüklenmediği otomatik kontrol edilir; hatalı veri bir sonraki adıma geçmez.'],['Uzman doğrulaması','KPI türüne göre mali müşavir ya da teknik/ESG uzmanı kanıtı kaynak kayıtla karşılaştırır, gerekirse yeniden hesaplar ve onaylar. Programa göre ikinci, farklı nitelikte bir uzman da onay verir.'],['Akredite kuruluş','Gerektiğinde (ör. sürdürülebilirlik bağlantılı kredide hedef test tarihinde) akredite bağımsız bir kuruluş doğrular.']],
  vrT:'Bağımsızlık kuralları',vr:['Bir şirkete danışmanlık veren kişi veya kuruluş, o şirketin verisini doğrulayamaz.','Aynı kişi iki doğrulama katmanını birlikte onaylayamaz.','Her doğrulayıcı platformda rolü, yetki alanı ve bağımsızlık beyanıyla tanımlıdır; her onay iz kaydına yazılır.'],
  pr:[['Yapay zekâ puan üretmez','Yapay zekâ yalnızca yanıtları sınıflandırır, belgelerden gösterge çıkarır ve eksik yanıtları işaretler. Puanı tanımlı kurallar hesaplar.'],['İnsan onayı','Yapay zekânın emin olmadığı her sonuç uzman onayına düşer; onaylanmayan sonuç skora girmez.'],['Denetim izi','Her puanın hangi kurala, yanıta ve kanıta dayandığı kayıt altındadır ve dışa aktarılabilir.'],['Sürüm yönetimi','Standart, soru ve skorlama kuralı değişiklikleri izlenir; her değerlendirmenin hangi sürümle yapıldığı korunur.']],
  lvlEb:'Olgunluk seviyeleri',lvlH:'Skor, şirketin nerede durduğunu ve neyi geliştirmesi gerektiğini gösterir.',
  levels:[['Başlangıç','Sürdürülebilirlik yönetimi yeni başlıyor; temel veriler ve politikalar oluşturulmalı.','0–20'],['Gelişmekte','İlk uygulamalar var; veri toplama düzensiz, sorumluluklar henüz netleşmemiş.','20–40'],['Tanımlı','Politikalar ve süreçler tanımlı; veri sistematik toplanıyor, hedefler belirleniyor.','40–60'],['Yönetilen','Hedefler ve KPI’lar düzenli izleniyor; performans ölçülüyor ve raporlanıyor.','60–80'],['Lider','Sürdürülebilirlik iş stratejisine entegre; doğrulanmış veri finansman ve pazar avantajına dönüşüyor.','80–100']],
  isEb:'Skorun kapsamı',isH:'Skor neyi gösterir, neyi göstermez?',isT:'Gösterir',isntT:'Göstermez',
  is:['Şirketin sürdürülebilirlik olgunluğunu ve verisinin güvenilirliğini','Gelişim alanlarını ve önceliklendirilmiş aksiyonları','Zaman içindeki ilerlemeyi ve KPI performansını'],
  isnt:['Bir kredi notu ya da kredi kararı değildir; kredi kararı tamamen bankanındır','Bir güvence (assurance) denetimi ya da sertifika değildir','Şirketin finansal durumunu değerlendirmez'],
  stdEb:'Dayandığımız çerçeveler',stdH:'Uluslararası standartlara dayalı ölçüm.',stdPills:['GRI Standartları','LMA / APLMA / LSTA SLL İlkeleri','TSRS ile uyumlu veri yapısı','SLL İlkeleriyle uyumlu KPI kütüphanesi'],
  griEb:'GRI lisansı',griH:'GRI Licensed Software &amp; Tools Partner · 2026',griP:'İmplika, GRI’ın 2026 dönemi lisanslı yazılım ve araç ortakları arasında yer alır. Platformda kullanılan GRI Standartları içerikleri GRI’ın izniyle kullanılmaktadır. GRI’ın doğrulaması yalnızca GRI Standartları içeriğinin doğru kullanımıyla sınırlıdır; GRI, platformun ya da platformla üretilen çıktıların doğruluğu, uygunluğu veya kalitesi hakkında herhangi bir beyanda bulunmaz ve bu çıktıları onaylamaz.',griCap1:'Software and Tools Partner 2026',griCap2:'Content Used with Permission 2026'},
 sec:{title:'Veri Güvenliği',eb:'Veri güvenliği ve gizlilik',h1:'Veriniz sizindir.',p:'İmplika’ya yüklediğiniz veri, onayınız olmadan kimseyle paylaşılmaz, yalnızca yetkili kişilerce görülür ve 6698 sayılı Kişisel Verilerin Korunması Kanunu’na (KVKK) uygun işlenir.',
  hEb:'İlkelerimiz',h:'Güvenliğin altı ilkesi.',
  items:[['Veri sahipliği','Platforma girdiğiniz tüm veri ve belgeler şirketinize aittir; dilediğiniz zaman dışa aktarabilir ya da silinmesini talep edebilirsiniz.','database'],['Onaya dayalı paylaşım','Skorunuz ve raporlarınız bir bankayla ya da ekosistem sahibiyle yalnızca açık onayınızla paylaşılır; neyin kiminle paylaşıldığını görürsünüz.','check'],['KVKK uyumu','Kişisel veriler KVKK’ya uygun olarak, belirli ve meşru amaçlarla sınırlı şekilde işlenir; aydınlatma ve rıza süreçleri platforma entegredir.','shield-check'],['Rol bazlı erişim','Şirket kullanıcıları, ön inceleme uzmanları, bağımsız doğrulayıcılar ve finans kuruluşları yalnızca rollerinin gerektirdiği veriyi görür.','network'],['Şifreleme','Veri, aktarım sırasında ve saklanırken şifrelenir.','target'],['İz kaydı','Kim, neyi, ne zaman girdi, değiştirdi ya da onayladı; tüm işlemler kayıt altındadır.','chart-column']],
  note:'Doğrulama uzmanları yalnızca kendilerine atanan şirketin kanıtlarına, gizlilik taahhüdüyle erişir. Veri koruma süreçlerimiz BTS &amp; Partners’ın veri koruma ve uyum uzmanlığıyla tasarlanır.',ask:'Veri güvenliğiyle ilgili sorularınız için'},
 start:{
  companies:{eb:'Nasıl başlarım?',h:'Dört adımda ilk skorunuz.',steps:[['Başvurun','Formu doldurun; ekibimiz sizinle iletişime geçsin.'],['Hesabınızı açın','Kısa bir tanışma görüşmesinin ardından hesabınız açılır ve size uygun soru seti tanımlanır.'],['Yanıtlayın, belge yükleyin','Soruları çevrim içi yanıtlayın, belgelerinizi yükleyin; uzmanlarımız süreç boyunca yanınızda.'],['Skorunuzu alın','Olgunluk skorunuz, gelişim önerileriniz ve bankayla paylaşılabilir raporunuz hazır.']],needT:'Hazırlamanız gerekenler',needs:['Temel şirket bilgileri ve faaliyet alanı','Enerji, su ve atık kayıtları (fatura ya da sayaç verileri)','Çalışan, iş sağlığı ve güvenliği ve eğitim kayıtları','Varsa politika ve prosedür belgeleri'],note:'Uygun durumlarda kamu destek programlarından yararlanmanız için yönlendirme sağlıyoruz.',btn:'Ölçüme başlayın'},
  institutions:{eb:'Nasıl başlarız?',h:'Portföyünüz için bir pilotla başlayın.',steps:[['Tanışma','Hedef KOBİ segmentinizi ve mevcut kredi süreçlerinizi birlikte değerlendiririz.'],['Program tasarımı','KPI setini, skor eşiklerini ve raporlama formatını birlikte belirleriz.'],['Pilot','Seçilen KOBİ grubuyla ölçüm, skor ve izleme süreci işletilir.'],['Ölçekleme','Sonuçlara göre program portföye yayılır; API ile sistemlerinize bağlanır.']],btn:'Pilot görüşmesi talep edin'},
  ecosystem:{eb:'Nasıl başlarız?',h:'Ağınız için programı birlikte kuralım.',steps:[['Tanışma','Tedarikçi ve satıcı ağınızı, önceliklerinizi ve hedeflerinizi konuşuruz.'],['Program tasarımı','Kapsamı, soru setini ve ağınıza sunulacak avantajları belirleriz.'],['Duyuru ve katılım','Programı ağınıza duyurursunuz; ölçüm ve destek süreci İmplika’dadır.'],['İzleme','Ağınızın olgunluk gelişimini ve Kapsam 3 verisini tek panelden izlersiniz.']],btn:'Program görüşmesi talep edin'}},
 advisory:{eb:'Danışma Kurulu',h:'Danışma Kurulu',p:'İmplika’nın danışma sürecine katkı sunan kişiler ve iş ortakları. Finans, regülasyon ve sürdürülebilirlik alanlarındaki deneyimleriyle stratejik önceliklere ve ürün yol haritasına yön verirler.',member:'Danışma Kurulu Üyesi',partner:'Stratejik Ortak'},
 team:{members:{gozde:{role:'Takım Lideri · GRI Sertifikalı',bio:'Gözde, İmplika ekibine liderlik eden GRI sertifikalı bir sürdürülebilirlik uzmanıdır. 20 yılı aşkın deneyime sahip bir hukukçu olarak 15 yıl Alshaya Group’ta şirket içi hukuk müşaviri olarak çalıştı; Türkiye, Azerbaycan ve Gürcistan’da Hukuk biriminin yanı sıra Etik ve Uyum, Veri Gizliliği ve Disiplin kurullarına başkanlık etti, üst yönetim ekibinde yer aldı. BTS &amp; Partners’ta sürdürülebilirlik, uyum ve ticaret hukuku alanlarında Ortak’tır. İstanbul Üniversitesi Hukuk Fakültesi mezunudur, İstanbul Bilgi Üniversitesi’nde Ticaret Hukuku yüksek lisansı yapmıştır.'},ada:{role:'Sürdürülebilirlik ve Uyum',bio:'Ada, ağırlıklı olarak sürdürülebilirlik ve uyum alanlarında, bunların yanı sıra özel hukukun farklı alanlarında çalışıyor. BTS &amp; Partners’a katılmadan önce çeşitli çok uluslu firmalarda deniz ticareti, iş ve sigorta hukuku konularında görev aldı. İmplika’da sürdürülebilirlik ve uyum çalışmalarına destek veriyor. Galatasaray Üniversitesi Hukuk Fakültesi mezunudur.'},kaan:{role:'GRI Sertifikalı ESG Uzmanı',bio:'Kaan, GRI sertifikalı bir sürdürülebilirlik uzmanıdır. BTS &amp; Partners’ta Kıdemli Avukat olarak uyum, kişisel verilerin korunması ve gizlilik, bilişim ve telekomünikasyon ile medya alanlarında çalışıyor. Veri ve teknolojiyle büyüyen şirketlere, özellikle girişimlerin değişen regülasyona uyum sağlamasına danışmanlık veriyor; veriden yararlanarak hukuki hizmetlerin dijitalleştirilmesine ve müşteri deneyimi tasarımına yönelik ürün geliştirme projelerinde yer alıyor.'}},eb:'Ekip',h:'İmplika’yı hayata geçiren ekip.',hint:'Biyografi için fotoğrafın üzerine gelin ya da dokunun.',flip:'Biyografiyi göster',role:'Müdür',bio:'Mehmet, sürdürülebilirlik, iklim regülasyonu ve yeşil finansın kesişiminde 11 yılı aşkın deneyime sahiptir. PwC Türkiye, Corpera ve Sistem Global’de CSRD/ESRS ve TSRS uyumu, çifte önemlilik analizleri, TCFD/NGFS iklim riski senaryoları ve IFC/EBRD standartlarında çevresel ve sosyal (Ç&amp;S) değerlendirme çalışmalarına liderlik etti. İmplika’da şirketlerin ve finansal kuruluşların sürdürülebilirlik verisini finansmana erişimin kapısını açan, ölçülebilir ve doğrulanabilir bir varlığa dönüştürmesine yardımcı oluyor. Boğaziçi Üniversitesi ve İstanbul Bilgi Üniversitesi mezunudur; Springer yayınları bulunan bir yazar olup sürdürülebilirlik dersleri vermektedir.'},
 board:{title:'Yönetim Kurulu',eb:'Yönetim Kurulu',h:'Uzun vadeli gelişim için stratejik yön.',p:'İmplika’nın stratejik yönünü ve uzun vadeli gelişimini şekillendiren Yönetim Kurulu.',role:'Yönetim Kurulu Üyesi',chair:'Yönetim Kurulu Başkanı',bios:['İhsan Uğur Delikanlı, ODTÜ Kamu Yönetimi Bölümü’nden mezun olmuş; University of Exeter’de Finansal Yönetim alanında MBA, Gazi Üniversitesi’nde İktisat Teorisi alanında yüksek lisans ve kredi türevleri üzerine çalışmasıyla Başkent Üniversitesi’nde Muhasebe-Finansman alanında doktora yapmıştır; doçenttir. Kariyerine 1992’de TBMM’de başlamış, Hazine Müsteşarlığı ve BDDK’da 12 yıl Yeminli Banka Denetçisi olarak görev yapmıştır. BDDK Yönetim Kurulu Üyeliği ve Başkan Yardımcılığı yapmış, Aktif Yatırım Bankası ile Karadeniz Ticaret ve Kalkınma Bankası’nda başkanlık görevlerinde bulunmuştur. Fimple ve Mint Finansman A.Ş. yönetim kurullarında görev almakta; Vergi Konseyi, Türkiye Muhasebe Standartları Kurulu ve Basel Komitesi dahil pek çok kurulda üye olarak yer almıştır.', 'Yasin Beceni, BTS &amp; Partners’ın Kıdemli Ortağıdır. Yaklaşık yirmi yıldır bilgi ve iletişim teknolojileri hukuku, politika ve stratejileri, regülasyon hukuku ve dijital teknolojiler alanında büyük iş gruplarına, Fortune 500 teknoloji şirketlerine ve Türkiye ekonomisinin önde gelen kuruluşlarına danışmanlık vermektedir. 2001’den bu yana dijital ekonomi ve bilgi toplumu üzerine akademik çalışmalara katkı sunmakta; İstanbul Bilgi Üniversitesi’nde BT Hukuku yüksek lisans programında ve Sabancı Üniversitesi’nde Veri Analitiği yüksek lisans programında ders vermektedir. TÜBİSAD Baş Hukuk Danışmanıdır. Marmara Üniversitesi Hukuk Fakültesi mezunudur; İstanbul Bilgi Üniversitesi’nde Ekonomi Hukuku yüksek lisansı yapmıştır.', 'Zafer Yıldız, Sistem Global Danışmanlık’ta Yönetim Kurulu Üyesi ve Partner, Sistem Global Antalya’nın kurucu ortağıdır. Grubun sürdürülebilirlik şirketi Sgreen’in Yönetim Kurulu Başkanı olarak görev yapmaktadır. Sistem Global, 1996’dan bu yana vergi, finans, Ar-Ge, uyum ve dijital çözümler alanında KOBİ’lerden büyük ölçekli şirketlere uzanan geniş bir müşteri kitlesine hizmet veren bir profesyonel hizmetler grubudur.']},

 legal:{
  privacy:{title:'Gizlilik ve KVKK',eb:'Yasal',h1:'Gizlilik ve KVKK Aydınlatma Metni',p:'Son güncelleme: 8 Ekim 2026',
   s:[['Veri sorumlusu',['Bu aydınlatma metni, 6698 sayılı Kişisel Verilerin Korunması Kanunu (“KVKK”) uyarınca veri sorumlusu sıfatıyla İmplika Teknoloji ve Danışmanlık A.Ş. (“İmplika”) tarafından hazırlanmıştır. Adres: Huzur Mah. Fatih Cad. No: 67 İç Kapı No: 17 Sarıyer / İstanbul. E-posta: <a href="mailto:info@implika.co">info@implika.co</a>.']],
   ['İşlenen kişisel veriler',['<strong>Web sitesi formları:</strong> İletişim ve demo formlarında paylaştığınız ad, soyad, kurum, e-posta, telefon, kurum türü, ilgi alanı ve mesaj içeriği.','<strong>Platform kullanıcıları:</strong> Kullanıcı hesabı için gerekli kimlik ve iletişim bilgileri, kullanıcı rolü, giriş ve işlem kayıtları.','<strong>Tarayıcı tercihleri:</strong> Site, dil tercihinizi yalnızca kendi tarayıcınızda saklar. Videolar oynatıldığında YouTube’un gelişmiş gizlilik modu (youtube-nocookie.com) kullanılır.']],
   ['İşleme amaçları',['Talebinizi değerlendirmek ve size dönüş yapmak; demo, teklif ve sözleşme süreçlerini yürütmek; platform hizmetini sunmak ve kullanıcı hesaplarını yönetmek; bilgi güvenliğini ve işlem kayıtlarını sağlamak; yasal yükümlülükleri yerine getirmek.']],
   ['Hukuki sebepler',['Kişisel verileriniz KVKK’nın 5. maddesinde yer alan; bir sözleşmenin kurulması veya ifasıyla doğrudan ilgili olması, veri sorumlusunun hukuki yükümlülüğünü yerine getirmesi ve temel hak ve özgürlüklerinize zarar vermemek kaydıyla meşru menfaat hukuki sebeplerine dayanılarak, gerektiğinde ise açık rızanızla işlenir.']],
   ['Aktarım',['Kişisel verileriniz, yalnızca yukarıdaki amaçlar için ve gerektiği ölçüde; barındırma ve bulut altyapısı (Microsoft Azure), yazılım geliştirme ve teknik destek hizmeti aldığımız tedarikçilerimize, talebinizin gerektirdiği hâllerde uygulama ortaklarımız Sistem Global ve BTS &amp; Partners’a ve yetkili kamu kurum ve kuruluşlarına aktarılabilir. Yurt dışına aktarım gerektiğinde KVKK’nın 9. maddesindeki şartlara uyulur.','Platformda oluşan skorunuz ve raporlarınız bir bankayla ya da ekosistem sahibiyle yalnızca açık onayınızla paylaşılır.']],
   ['Saklama süresi',['Kişisel veriler, işleme amacının gerektirdiği süre ve ilgili mevzuatta öngörülen süreler boyunca saklanır; sürenin sonunda silinir, yok edilir ya da anonim hâle getirilir.']],
   ['Haklarınız',['KVKK’nın 11. maddesi uyarınca; kişisel verilerinizin işlenip işlenmediğini öğrenme, işlenmişse bilgi talep etme, işleme amacını ve amacına uygun kullanılıp kullanılmadığını öğrenme, yurt içinde veya yurt dışında aktarıldığı üçüncü kişileri bilme, eksik ya da yanlış işlenmişse düzeltilmesini, KVKK’nın 7. maddesi çerçevesinde silinmesini veya yok edilmesini isteme, bu işlemlerin aktarıldığı üçüncü kişilere bildirilmesini isteme, münhasıran otomatik sistemlerle analiz edilmesi sonucu aleyhinize bir sonuca itiraz etme ve kanuna aykırı işleme nedeniyle uğradığınız zararın giderilmesini talep etme haklarına sahipsiniz.']],
   ['Başvuru',['Haklarınıza ilişkin taleplerinizi <a href="mailto:info@implika.co">info@implika.co</a> adresine e-posta ile ya da yukarıdaki adrese yazılı olarak iletebilirsiniz. Başvurular, Veri Sorumlusuna Başvuru Usul ve Esasları Hakkında Tebliğ uyarınca en geç 30 gün içinde sonuçlandırılır.']]]},
  terms:{title:'Kullanım Koşulları',eb:'Yasal',h1:'Kullanım Koşulları',p:'Son güncelleme: 8 Ekim 2026',
   s:[['Kapsam',['Bu koşullar, İmplika Teknoloji ve Danışmanlık A.Ş. (“İmplika”) tarafından işletilen implika.co web sitesinin kullanımına uygulanır. Siteyi kullanarak bu koşulları kabul etmiş olursunuz. İmplika platformunun kullanımı, ayrıca imzalanan sözleşme ve lisans koşullarına tabidir.']],
   ['Bilgilendirme amacı',['Sitedeki içerikler genel bilgilendirme amaçlıdır; teklif, taahhüt, hukuki, mali ya da yatırım tavsiyesi niteliği taşımaz. Platform modüllerinin kapsamı ve sunulma koşulları, müşteriyle yapılan sözleşmeyle belirlenir.']],
   ['Skor ve doğrulama',['İmplika skoru bir kredi notu, kredi kararı, güvence (assurance) denetimi ya da sertifika değildir. Kredi kararı, fiyatlama ve risk değerlendirmesi tamamen ilgili finans kuruluşuna aittir; İmplika kredi vermez ve risk taşımaz.']],
   ['Fikri mülkiyet',['Sitedeki metin, tasarım, logo ve diğer içeriklerin hakları İmplika’ya veya lisans verenlerine aittir; izinsiz çoğaltılamaz ve kullanılamaz. GRI Standartları içerikleri ve GRI logoları GRI’ın izniyle kullanılmaktadır ve GRI’a aittir.']],
   ['Dış bağlantılar',['Site, üçüncü kişilere ait sitelere bağlantılar içerebilir. Bu sitelerin içeriğinden ve gizlilik uygulamalarından İmplika sorumlu değildir.']],
   ['Sorumluluğun sınırlandırılması',['İmplika, sitedeki bilgilerin doğru ve güncel olması için makul özeni gösterir; ancak bu bilgilerin kullanımından doğabilecek doğrudan ya da dolaylı zararlardan, yürürlükteki mevzuatın izin verdiği ölçüde sorumlu tutulamaz.']],
   ['Değişiklikler ve uygulanacak hukuk',['İmplika bu koşulları önceden bildirmeksizin güncelleyebilir; güncel metin bu sayfada yayımlanır. Bu koşullara Türk hukuku uygulanır; uyuşmazlıklarda İstanbul mahkemeleri ve icra daireleri yetkilidir.']],
   ['İletişim',['Sorularınız için: <a href="mailto:info@implika.co">info@implika.co</a> · Huzur Mah. Fatih Cad. No: 67 İç Kapı No: 17 Sarıyer / İstanbul']]]}},

en:{
 brand:'Implika',
 meta:{title:'Implika — Turn Sustainability Data into Value',desc:'Implika, a GRI Licensed Software & Tools Partner, is a technology platform that measures the sustainability maturity of SMEs and companies, monitors and validates their KPIs, and connects them to sustainability-linked finance.'},
 nav:{modules:'Modules',allModules:'All Modules',who:'Who It’s For',companies:'SMEs & Companies',institutions:'Banks & IFIs',ecosystem:'Ecosystem Owners',finance:'Sustainable Finance',about:'About',board:'Board of Directors',insights:'Insights',contact:'Contact',meth:'Methodology',sec:'Data Security',modLead:'Modules that manage sustainability data on one platform, from SMEs to banks.',whoLead:'Who uses Implika, and for what?',modTitle:'Platform modules',whoTitle:'Who we serve',financeLink:'Sustainable Finance',demo:'Request a Demo',menu:'Open menu',home:'Implika home',lang:'Language',mainNav:'Main navigation'},
 cta:{eb:'Let’s move forward together',h2:'Where does your<br><em>sustainability maturity stand?</em>',btn:'Request a Demo'},
 sol:{eb:'Modules',h2:'Modular infrastructure from measurement to finance.',p:'Each module works on its own. Together, they form a single flow from maturity assessment to access to finance.',link:'Explore module'},
 mods:{
  lite:{name:'Lite Module',layer:'Measure',card:'Measure your sustainability maturity and get your maturity score.',row:'A 63-question set for SMEs, maturity score and recommended actions.',
   intro:'Maturity assessment, maturity score and an improvement roadmap for SMEs and companies.',h2:'Measure your<br>maturity.',
   lead:'The first step in any sustainability journey is knowing where you stand today. The Lite Module measures it quickly, clearly and in line with recognised standards.',
   facts:[['63','question SME set'],['43 + 20','core and advanced questions'],['5','maturity levels · 0–100 score']],
   caps:['A 63-question set designed for SMEs','Completed from invoices, payroll and social security records','Scope 1 and 2 emissions calculated automatically from energy data','A 0–100 maturity score and five maturity levels','Required / Recommended / Conditional actions','Red-flag rule: critical risks are shown separately','Three outputs: SME scorecard, bank data package, channel report','Training and expert content'],
   how:'The company answers the criteria on the platform. Implika assesses the answers against defined rules and turns them into a maturity score. The report shows where points were lost and the actions needed to reach a full score, marked Required, Recommended or Conditional, together with expert comments and training content. The score can also be used for pre-assessment in sustainability-linked finance programmes. The set is completed again every year, and year-on-year change and progress against targets are reported.'},
  rating:{name:'ESG Rating',layer:'Measure',card:'Evidence-weighted ESG assessment and scoring for corporates.',row:'Extended question set, evidence-weighted score and audit trail.',
   intro:'ESG scoring and rating infrastructure for corporates.',h2:'Score it<br>with evidence.',
   lead:'Corporate ESG performance is measured with an extended question set based on the GRI Standards. Every point is calculated with a trail showing the answer, rule and evidence behind it.',
   facts:[['1,204','active questions mapped to the GRI Standards'],['0–3','evidence levels'],['3','score layers: disclosure, quality, performance']],
   caps:['Extended question set based on the GRI Standards','Weighting by topic, sector and size','A confidence layer based on evidence levels','Rule-based, repeatable scoring','An audit trail for every point','Sector benchmarking'],
   how:'The company answers the question set assigned to its profile and uploads its evidence. The scoring engine calculates topic and overall scores against defined rules; AI only helps classify answers and never produces the score. As evidence passes expert validation and, where needed, accredited verification, the confidence level of the score rises. The result can be used for investor, bank, customer and supply chain requests.'},
  mrv:{name:'Validation & KPI Monitoring',layer:'Validate',card:'Validate your data by evidence level, monitor your KPIs periodically and report on them.',row:'Evidence levels, layered validation, KPI monitoring and bank reporting.',
   intro:'Infrastructure that validates, monitors and reports sustainability data and KPIs throughout a programme or loan (measurement, reporting and verification).',h2:'Validate.<br>Monitor.',
   lead:'Data can only support financial decisions once it is reliably measured and validated. Implika assigns an evidence level to every data point and brings validation, monitoring and reporting into a single flow.',
   facts:[['0–3','evidence levels'],['3','validation layers'],['LMA','KPI library aligned with the SLL Principles']],
   caps:['Evidence levels: disclosure, document, expert validation, accredited verification','System checks, expert validation and accredited verification where needed','KPI library aligned with the LMA SLL Principles; KPIs selected per programme','Periodic KPI monitoring and deviation tracking','Standard data package for banks and IFIs','An audit trail for every action'],
   how:'The KPI set is built on international standards; the programme framework decides which KPIs apply, and the selected KPIs are monitored periodically. Every data point is first checked automatically on the platform; evidence is then reviewed and approved by an accountant or technical expert depending on the KPI, an accredited body verifies it where needed, and the result feeds into the score. No person or firm advising a company may validate that company’s data. The company tracks its progress on the platform, while the bank uses the same data in its own reporting. Validation is not an assurance engagement.'},
  supply:{name:'Supply Chain',layer:'Create value',card:'Set up, assess and score your suppliers on one record, and close actions with evidence.',row:'Supplier assessment, scoring, evidence-based action closure and Scope 3 data.',
   intro:'Manage sustainability, quality and compliance requirements on a single supplier record.',h2:'Make your network<br>visible.',
   lead:'Every customer and brand asks its suppliers for something different, and the same supplier often serves several buyers. Implika asks the shared questions once, adds customer- and brand-specific requirements as profiles, and runs the whole cycle on one platform, from setting up the supplier to actions closed with evidence.',
   caps:['One supplier record with customer- and brand-specific requirement profiles','Supplier set-up by category and tier, with criticality','Dynamic audit forms from a central question pool','Evidence and document upload linked to each question','Document validity tracking and automatic alerts','Rule-based scoring with human-approved AI classification','Actions with owner and deadline, closed with evidence','Region, brand and category reports through tagging','Supplier performance comparison','Scope 3 data (through emissions calculation integration)'],
   how:'Suppliers are set up by category, tier, sector and criticality, and invited to the platform. Customer and brand requirements are turned into questions, and each supplier receives a dynamic form that fits its profile. Answers and evidence are scored by a rule-based engine, and any result the AI is not confident about goes to human approval. Non-conformities get an owner and a deadline, and an action closes only with evidence. The system alerts you as documents near expiry. The buyer sees its network’s compliance and performance view, reports and Scope 3 data in one place.'},
  finance:{name:'Sustainable Finance',layer:'Create value',card:'Programme infrastructure that connects SMEs to sustainability-linked loans (SLLs).',row:'Score, KPI monitoring, bank data package and portfolio view for SLL programmes.'},
  tsrs:{name:'TSRS Reporting',layer:'Report',card:'Data, mapping and report-preparation infrastructure for your TSRS report.',row:'TSRS/ISSB mapping, emissions calculation and report drafting.',
   intro:'Data collection, mapping and report-preparation infrastructure for companies in scope of the Turkish Sustainability Reporting Standards (TSRS).',h2:'Build your report<br>from data.',
   lead:'A TSRS report should be built from verifiable data, not scattered spreadsheets. Implika maps platform data to TSRS requirements and brings report preparation into a single flow.',
   caps:['Data structure mapped to TSRS 1 and TSRS 2 requirements','Scope 1 and 2 emissions calculation','Value chain data (with the Supply Chain module)','Alerts for missing and inconsistent data','AI-assisted report drafting','An evidence archive ready for external assurance'],
   how:'The company completes questions and data requests mapped to TSRS requirements on the platform. Emissions are calculated with up-to-date factors from official sources, and the method and factors stay traceable in the report. The report draft relies only on platform data; the company’s team edits and approves the final text.'}

  iaasEb:'Technology and expertise',iaasH:'Platform, expert network and layered validation in one.',iaasP:'Implika delivers its technology through SaaS and APIs. Field support draws on our ecosystem’s expert network: Sistem Global’s accountants and green transition experts, and the legal and regulatory team of BTS &amp; Partners. Validation runs in three layers: automatic platform checks, approval by qualified experts and, where needed, verification by an accredited body. No person or firm advising a company may validate that company’s data.',pills:['SaaS Platform','API Integration','Licensed GRI Content','Three-Layer Validation'],
