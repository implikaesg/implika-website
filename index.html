 modulesPage:{title:'Modules',eb:'Modules',h1:'Six modules on one shared data backbone.',p:'Six modules run on one shared data and methodology backbone: measure (Lite, ESG Rating), validate (Validation & KPI Monitoring), report (TSRS Reporting) and create value (Supply Chain, Sustainable Finance).',svEb:'Services',svH:'Services delivered with the platform.',svP:'Implika does not provide traditional sustainability consulting; it provides expert support to set up, tailor and run the platform.',sv:[['Programme set-up','Designing the question set, KPI selection, score thresholds and supplier onboarding campaign for a bank, IFI or ecosystem programme.'],['Expert network and validation','Review of evidence by accountants or technical experts depending on the KPI, and management of a validator network bound by independence rules.'],['Reporting support','Producing score, KPI and TSRS reports from the platform and preparing them for banks and stakeholders.']],svNote:'Validation is not an assurance engagement; the score does not replace a credit rating or a certification.'},
 financePage:{title:'Sustainable Finance',eb:'Sustainable Finance',h1:'Connecting SMEs to sustainability-linked finance.',p:'Implika provides the measurement, monitoring and reporting infrastructure that lets international finance reach SMEs as working capital through sustainability-linked loans (SLLs).',
  pEb:'The problem',pH:'Why doesn’t green finance reach SMEs?',pP:['Funding from international financial institutions (IFIs) makes up a significant share of Turkish banks’ corporate loan books. But the green and social loans funded this way are project-based: the financing is tied to a specific green transition project.','What SMEs actually need is working capital. Sustainability-linked loans carry no project requirement, yet maturity assessment and KPI tracking have so far been costly and slow, so these loans have mostly gone to large companies.'],
  sEb:'Our solution',sH:'Bringing sustainability-linked lending to SME scale.',sP:['Implika measures an SME’s sustainability maturity at an accessible cost and turns it into a maturity score. That score is the SME’s first gate into credit assessment.','Throughout the loan, KPIs are monitored on the platform, validated by qualified experts and made ready for the bank’s reporting. As the SME meets its KPIs its score rises and, depending on programme terms, better tenor and pricing can be linked to that progress.'],
  flowEb:'How the programme works',flowH:'Sustainability-linked finance in five steps.',
  steps:[['Programme framework','IFIs and participating banks set the funding, KPI set and terms'],['Assessment and score','The SME completes its maturity assessment on Implika'],['Credit assessment','The score is shared with the bank, which makes the credit decision'],['Monitoring and validation','KPIs are monitored, validated by qualified experts and reported'],['Progress and benefits','As the score rises, programme terms can reward progress']],
  rolesEb:'Who does what?',rolesH:'Clear roles for every party.',
  diag:{chain:[['Provides the funding','International financial institution','Credit line, programme framework and KPI set'],['Makes the loan','Participating bank','Credit decision, pricing and credit risk'],['Uses the loan','SME','Compliance and efficiency investment, working capital']],arrows:['funding','loan'],imp:['Implika','Maturity score, KPI and target definition, monitoring over the loan term and reporting to the bank and IFI. Does not lend and carries no risk.'],ch:['Channel / ecosystem owner','Announces the programme and brings SMEs in. Takes no credit decision and no credit risk.'],span:'Measurement, monitoring and reporting for every party, on the same data'},
  roles:[['International financial institution','Sets the programme framework, funding pool and KPI set.'],['Participating bank','Makes the credit decision and runs pricing, disbursement and risk assessment.'],['Ecosystem owner','Announces the programme to its supplier and seller network, invites them and champions it.'],['Implika','Provides the maturity assessment, score, KPI monitoring, validation infrastructure and reporting.']],
  note:'Implika does not lend, does not take part in credit decisions and carries no risk. The ecosystem owner is not a lending channel either; its role is to make it easier to reach SMEs.',
  stdEb:'Aligned with international frameworks',stdH:'Measurement and monitoring built on standards.',stdP:'The maturity assessment is based on international sustainability frameworks, and the KPI set on international principles for sustainability-linked loans. Which KPIs apply is decided within each programme framework.',stdPills:['LMA / APLMA / LSTA SLL Principles','SME-specific criteria set','KPI library selected per programme']},
 companies:{title:'SMEs & Companies',eb:'For SMEs and companies',h1:'Measure your maturity. Get ready for finance and new markets.',p:'Maturity assessment, an improvement roadmap and KPI tracking for SMEs, exporters, suppliers and corporates.',h2:'Turn sustainability from a burden into an advantage.',lead:'Implika measures where your company stands today, shows what to improve, and links that progress to finance and commercial opportunities.',list:['Get your sustainability maturity score','Improve with recommended actions and training','Track your KPIs on one platform','Prepare for sustainability-linked finance','Get ready for EU export requirements and CBAM','Manage your corporate (TSRS) reporting inputs'],btn:'See how it works'},
 institutions:{title:'Banks & IFIs',eb:'For banks and international financial institutions',h1:'Make sustainability-linked lending measurable at SME scale.',p:'Maturity scoring, KPI monitoring, validation and reporting infrastructure for banks and international financial institutions.',h2:'Reach a wider SME base with data you can trust.',lead:'Implika makes an SME’s sustainability maturity visible at the start of the credit process and keeps its KPIs trackable and reportable for the life of the loan.',list:['Pre-assessment with a maturity score','KPI monitoring and reporting throughout the loan','Evidence-levelled data and layered validation','Training and improvement platform for SMEs','Firm-level impact measurement','API integration with banking systems'],note:'Credit decisions, pricing and risk assessment remain entirely with the bank. The Implika score is a first gate for bringing an SME into assessment.',btn:'See how it works'},
 ecosystem:{title:'Ecosystem Owners',eb:'For ecosystem owners',h1:'Raise the maturity of your supplier and seller network.',p:'A sustainability and access-to-finance programme for large companies, marketplaces and industry associations with supplier or seller networks.',h2:'A stronger network makes a stronger business.',lead:'The ecosystem owner announces and champions the programme; Implika takes care of assessment, improvement and monitoring. Your network gains both sustainability maturity and financial resilience.',list:['Announce the programme to your suppliers and sellers','Track your network’s maturity progress','Access Scope 3 data in one place','Ease your network’s access to affordable finance','Prepare your network for EU regulation and export requirements'],note:'The ecosystem owner is neither a lending channel nor a risk-bearing party. Its role is to announce the programme and make it easier to reach its network.',btn:'See how it works'},
 about:{title:'About',eb:'About Implika',filmEb:'Corporate film',filmH:'Meet Implika <em>in 90 seconds.</em>',filmP:'Discover the platform that makes the green transition measurable and financeable, in our short film.',filmTR:'Türkçe',filmEN:'English',filmDur:'90 sec',h1:'Bridging data, expertise and finance.',p:'Implika is a sustainability technology platform that measures and improves the sustainability maturity of SMEs and companies and connects it to finance.',
  s1eb:'Who we are',s1h:'Founded by Sistem Global and BTS.',s1p:['Implika was founded as a joint initiative of Sistem Global and BTS. Built on BTS’s expertise in the legal and regulatory side of sustainability and ESG, we developed our platform together with NTT DATA. Implika is a GRI Licensed Software &amp; Tools Partner.','The platform helps companies measure and improve their sustainability maturity and track their KPIs, while enabling banks and international financial institutions to use that data in their lending processes.'],
  s2eb:'Where we started',s2h:'Why should sustainability be reserved for large companies?',s2p:['Sustainability measurement and reporting have long been costly and slow. As a result, sustainability-linked finance has mostly reached large companies.','Our goal is to let SMEs measure and improve their sustainability maturity easily and affordably, and turn that progress into finance and new markets.'],
  exEb:'Expertise ecosystem',exH:'Four perspectives.<br>One platform.',ex:[['Technology','Digital platform, data infrastructure, software and integration.'],['Sustainability & ESG','Maturity assessment, KPI sets and reporting.'],['Field & Pre-review','A field and pre-review network of accountants, lawyers and green finance experts; validation is carried out by experts bound by independence rules.'],['Regulation & Finance','International standards, loan framework compliance and sustainable finance.']],
  ecoEb:'Founders and partners',ecoH:'Different expertise,<br>one goal.',ecoP:'Implika brings technology, field reach, legal and regulatory expertise and financial decision-making together in one structure.',
  eco:[['Technology & Platform','Sustainability platform and data infrastructure; GRI Licensed Software &amp; Tools Partner.'],['Founding Partner · Field & Pre-review','SME reach through its accountant network, field support and pre-review.'],['Founding Partner · Legal & Regulatory','The legal and regulatory side of sustainability; architecture for compliance with standards and loan frameworks.'],['Technology Partner','Platform development, technical infrastructure and integration.']],
  closeEb:'Our vision',closeH:'From sustainability maturity to financial value.',closeP:'Implika is the technology infrastructure that brings companies, banks and international financial institutions together around the same trusted data.'},
 aboutNav:{company:'The company',gov:'Corporate governance',who:'Who is Implika?',origin:'Our Starting Point',vision:'Vision &amp; Mission',values:'Our Values',eco:'Our Expertise Ecosystem',board:'Board of Directors',advisory:'Advisory Board',team:'Team',lead:'Bridging data, expertise and finance.',all:'Overview'},
 vm:{eb:'Vision &amp; Mission',h:'From sustainability maturity to financial value.',vT:'Our vision',v:'An economy where sustainability data is the common language that opens access to finance and new markets for companies of every size.',mT:'Our mission',m:'To measure the sustainability maturity of SMEs and companies in a reliable, verifiable and accessible way, and to make that data decision-ready for banks and international financial institutions, so that the green transition becomes financeable.'},
 values:{eb:'Our values',h:'The principles that guide us.',items:[['Trustworthy data','Every data point we measure is traceable, verifiable and aligned with international standards.'],['Accessibility','We make sustainability accessible to businesses of every size, rather than a privilege of large corporations.'],['Transparency','We share our methodology, scores and processes openly with our stakeholders.'],['Measurable impact','We measure success not by reports, but by access to finance, improving KPIs and real transformation.']]},
 gov:{title:'Corporate Governance',eb:'Corporate governance',h1:'Strong governance, long-term value.',p:'The Board of Directors that sets Implika’s strategic direction, the Advisory Board that contributes to our advisory process, and the team that brings the platform to life.'},
 meth:{title:'Methodology',eb:'Methodology',h1:'How is the score calculated?',p:'The Implika score combines a question set covering environmental, social and governance topics, evidence-levelled answers, layered validation and periodic monitoring of the KPIs selected for each programme. The score is rule-based, and every point is traceable, so the company and the bank can rely on the same score.',
  stepsEb:'Five steps to a score',stepsH:'From questions to validated data.',
  steps:[['Question set','A question set covering environmental, social and governance topics and tailored to the company’s size and sector: an extended set based on the GRI Standards for corporates, and a streamlined Lite set for SMEs.'],['Answers and evidence','Yes/no, multiple-choice, numeric and document-upload answer types. Answers supported by documents feed into the score with higher confidence.'],['Scoring','Each question is weighted by materiality; topic scores and an overall maturity score are calculated, and the company is placed on a maturity level.'],['Validation','The platform checks every data point automatically; evidence is reviewed and approved by qualified experts depending on the KPI, and an accredited body verifies it where needed. Approved data is marked as validated on the platform.'],['Monitoring and reporting','KPIs selected for the programme from a KPI library aligned with the LMA SLL Principles are monitored periodically; the score is updated and reports become ready to share with banks and stakeholders.']],
  evEb:'Confidence layer',evH:'Every data point has an evidence level.',evP:'How far a score can be trusted depends on the evidence behind it. Implika places every data point on one of four evidence levels; as validation progresses, the confidence level of the score rises.',
  nums:[['1,204','active questions mapped to the GRI Standards'],['63','question SME (Lite) set'],['0–3','evidence levels'],['0–100','maturity score, five levels']],
  ev:[['Disclosure','The company’s own answer, with no supporting document.'],['Document','The answer is supported by a document such as an invoice, policy or certificate.'],['Expert validation','The evidence has been reviewed and approved by a qualified expert (an accountant or a technical/ESG expert, depending on the KPI).'],['Accredited verification','The data has been verified by an accredited independent body (e.g. ISO 14064 GHG verification); used where needed.']],
  vEb:'Validation model',vH:'Validation in three layers.',vP:'Each data point is validated as far as the decision it supports requires. The depth of validation is set by the programme and the size of the loan.',
  vl:[['System checks','Mandatory fields, units, consistency, deviation from the previous period and whether evidence is attached are checked automatically; faulty data does not move to the next step.'],['Expert validation','Depending on the KPI, an accountant or technical/ESG expert reconciles the evidence with source records, recalculates where needed and approves it. Depending on the programme, a second expert with a different profile also signs off.'],['Accredited body','Where needed (for example on the target test date of a sustainability-linked loan), an accredited independent body verifies the data.']],
  vrT:'Independence rules',vr:['No person or firm advising a company may validate that company’s data.','The same person cannot approve two validation layers.','Every validator is registered on the platform with a role, scope and independence declaration, and every approval is logged.'],
  pr:[['AI never sets the score','AI only classifies answers, extracts indicators from documents and flags missing answers. Defined rules calculate the score.'],['Human approval','Any result the AI is not confident about goes to expert approval; unapproved results do not enter the score.'],['Audit trail','The rule, answer and evidence behind every point are logged and can be exported.'],['Version control','Changes to standards, questions and scoring rules are tracked, and the version used for each assessment is preserved.']],
  lvlEb:'Maturity levels',lvlH:'The score shows where a company stands and what it needs to improve.',
  levels:[['Starting','Sustainability management is just beginning; core data and policies need to be put in place.','0–20'],['Developing','First practices exist; data collection is irregular and responsibilities are not yet clear.','20–40'],['Defined','Policies and processes are defined; data is collected systematically and targets are being set.','40–60'],['Managed','Targets and KPIs are tracked regularly; performance is measured and reported.','60–80'],['Leading','Sustainability is embedded in strategy; validated data turns into finance and market advantages.','80–100']],
  isEb:'Scope of the score',isH:'What the score shows, and what it does not.',isT:'It shows',isntT:'It does not',
  is:['The company’s sustainability maturity and the reliability of its data','Areas for improvement and prioritised actions','Progress over time and KPI performance'],
  isnt:['It is not a credit rating or a credit decision; the credit decision rests entirely with the bank','It is not an assurance engagement or a certification','It does not assess the company’s financial position'],
  stdEb:'Frameworks we build on',stdH:'Measurement based on international standards.',stdPills:['GRI Standards','LMA / APLMA / LSTA SLL Principles','TSRS-compatible data structure','KPI library aligned with the SLL Principles'],
  griEb:'GRI licence',griH:'GRI Licensed Software &amp; Tools Partner · 2026',griP:'Implika is one of GRI’s licensed software and tools partners for 2026. Content from the GRI Standards used on the platform is used with GRI’s permission. GRI’s verification is limited to the accurate use of GRI Standards content; GRI makes no representation as to the correctness, fitness for purpose or quality of the platform or of any outputs produced with it, and does not approve such outputs.',griCap1:'Software and Tools Partner 2026',griCap2:'Content Used with Permission 2026'},
 sec:{title:'Data Security',eb:'Data security and privacy',h1:'Your data is yours.',p:'The data you upload to Implika is never shared without your consent, is visible only to authorised people and is processed in line with Türkiye’s Personal Data Protection Law No. 6698 (KVKK).',
  hEb:'Our principles',h:'Six principles of security.',
  items:[['Data ownership','All data and documents you enter belong to your company; you can export them or request their deletion at any time.','database'],['Consent-based sharing','Your score and reports are shared with a bank or ecosystem owner only with your explicit consent, and you can see what is shared with whom.','check'],['KVKK compliance','Personal data is processed in line with KVKK, limited to specific and legitimate purposes; information and consent steps are built into the platform.','shield-check'],['Role-based access','Company users, pre-review experts, independent validators and financial institutions see only the data their role requires.','network'],['Encryption','Data is encrypted in transit and at rest.','target'],['Audit trail','Who entered, changed or approved what, and when: every action is logged.','chart-column']],
  note:'Validation experts access only the evidence of the companies assigned to them, under a confidentiality commitment. Our data protection processes are designed with the data protection and compliance expertise of BTS &amp; Partners.',ask:'For questions about data security'},
 start:{

 advisory:{eb:'Advisory Board',h:'Advisory Board',p:'The people and partners who contribute to Implika’s advisory process. They bring experience in finance, regulation and sustainability to our strategic priorities and product roadmap.',member:'Advisory Board Member',partner:'Strategic Partner'},
 team:{members:{gozde:{role:'Team Leader · GRI Certified',bio:'Gözde leads the Implika team and is a GRI-certified sustainability professional. A lawyer with over 20 years of experience, she spent 15 years as in-house counsel at Alshaya Group, heading Legal and chairing the Ethics &amp; Compliance, Data Privacy and Disciplinary committees across Türkiye, Azerbaijan and Georgia, and sat on the Executive Leadership Team. She is a Partner at BTS &amp; Partners in sustainability, compliance and commercial law. She graduated from Istanbul University Faculty of Law and holds an LL.M. in Business Law from Istanbul Bilgi University.'},ada:{role:'Sustainability &amp; Compliance',bio:'Ada works mainly on sustainability and compliance, alongside other areas of private law. Before joining BTS &amp; Partners, she handled maritime, employment and insurance law matters at various multinational firms. At Implika she supports sustainability and compliance work. She graduated from Galatasaray University Faculty of Law.'},kaan:{role:'GRI Certified ESG Professional',bio:'Kaan is a GRI-certified sustainability professional. As a Managing Associate at BTS &amp; Partners, he works on compliance, data protection and privacy, IT and telecoms, and media. He advises data- and technology-driven companies, especially start-ups adapting to evolving regulation, and works on product development projects that digitise legal services and design client experiences through data.'}},eb:'Team',h:'The people operating Implika.',hint:'Hover over or tap the photo for the biography.',flip:'Show biography',role:'Manager',bio:'Mehmet brings over 11 years of experience at the intersection of sustainability, climate regulation and green finance. At PwC Turkey, Corpera and Sistem Global, he led CSRD/ESRS and TSRS compliance, double materiality assessments, TCFD/NGFS climate risk scenarios and E&amp;S assessments under IFC/EBRD standards. At İmplika, he helps companies and financial institutions turn sustainability data into a measurable, verifiable asset that unlocks access to finance. He holds degrees from Boğaziçi University and Istanbul Bilgi University, is a Springer-published author and teaches sustainability.'},
 board:{title:'Board of Directors',eb:'Board of Directors',h:'Strategic direction for long-term growth.',p:'The Board of Directors shaping Implika’s strategic direction and long-term growth.',role:'Board Member',chair:'Chairman of the Board',bios:['İhsan Uğur Delikanlı graduated in Public Administration from Middle East Technical University and holds an MBA in Financial Management from the University of Exeter, a master’s in Economic Theory from Gazi University and a PhD in Accounting and Finance from Başkent University, with research on credit derivatives; he is an Associate Professor. He began his career at the Grand National Assembly of Türkiye in 1992 and served for 12 years as a Sworn Bank Auditor at the Undersecretariat of Treasury and the BRSA. He has served as BRSA Board Member and Vice Chairman, and headed Aktif Yatırım Bankası and the Black Sea Trade and Development Bank. He sits on the boards of Fimple and Mint Finansman, and has served on bodies including the Tax Council, the Turkish Accounting Standards Board and the Basel Committee.', 'Yasin Beceni is a Senior Partner at BTS &amp; Partners. For nearly twenty years he has advised large business groups, Fortune 500 technology companies and leading Turkish enterprises on information and communication technology law, policy and strategy, regulatory law and digital technology. Since 2001 he has contributed to academic work on the digital economy and the information society, and he lectures in the ICT Law LL.M. programme at Istanbul Bilgi University and the Data Analytics master’s programme at Sabancı University. He is Chief Legal Advisor to TÜBİSAD. He graduated from Marmara University Faculty of Law and holds an LL.M. in Economic Law from Istanbul Bilgi University.', 'Zafer Yıldız is a Board Member and Partner at Sistem Global Danışmanlık and a founding partner of Sistem Global Antalya. He chairs the Board of Sgreen, the group’s sustainability company. Founded in 1996, Sistem Global is a professional services group serving a broad client base, from SMEs to large enterprises, across tax, finance, R&amp;D, compliance and digital solutions.']},

const MOD_META=[{id:'lite',n:'01',icon:'sparkles'},{id:'rating',n:'02',icon:'gauge'},{id:'mrv',n:'03',icon:'shield-check'},{id:'supply',n:'04',icon:'network'},{id:'finance',n:'05',icon:'circle-dollar-sign'},{id:'tsrs',n:'06',icon:'file-text'}];
const BOARD=[['İU','İhsan Uğur Delikanlı','assets/people/ihsan-ugur-delikanli-v2.jpg',1],['YB','Yasin Beceni','assets/people/yasin-beceni-v2.jpg'],['ZY','Zafer Yıldız','assets/people/zafer-yildiz-v2.jpg']];
const ADVISORY=[['HK','Hüseyin Karslıoğlu',0],['Eİ','Elif İşgör Önen',0],['GK','Gözde Kuşçuoğlu',0],['TB','Tuğçe Balarısı',0],['MY','Mediterra Yatırım',1]];
const NEWS=[{slug:'yesil-donusumun-finansmani-ve-rekabet-gucu',img:'assets/news/yesil-donusumun-finansmani-ve-rekabet-gucu.jpg',thumb:'assets/news/yesil-donusumun-finansmani-ve-rekabet-gucu-thumb.jpg'},{slug:'gri-licensed-software-tools-partner',yt:'gri',poster:'assets/video/implika-gri-partner-',thumb:'assets/news/gri-licensed-software-tools-partner-thumb.jpg'}];
const SITE='https://implika.co';
const YT={film:{tr:'6QFc3rUrldE',en:'8Lhms6Degmw'},gri:{tr:'fnU4wXH-o4Y',en:'fnU4wXH-o4Y'}};
const ytBox=(id,poster,label)=>`<div class="yt" data-yt="${id}"><button type="button" class="yt-play" aria-label="${label}"><img src="${poster}" alt="" loading="lazy" decoding="async"><span class="yt-btn"><i data-i="play" s="26"></i></span></button></div>`;
const shareUrl=slug=>`${SITE}/${lang==='en'?'en/':''}news/${slug}/`;
const newsCard=n=>{const d=T().news.items[n.slug];return `<a class="video-card news-card" href="#news/${n.slug}" aria-label="${T().news.open}: ${d.title}"><div class="video-thumb has-media"><img src="${n.thumb}" alt="" loading="lazy" decoding="async">${n.yt?`<div class="play-btn"><i data-i="play" s="22"></i></div>`:''}<span class="video-topic">${d.tag}</span></div><div class="video-meta"><strong>${d.title}</strong><span>${d.card}</span></div></a>`};
const newsPage=slug=>{const n=NEWS.find(x=>x.slug===slug),t=T().news,d=t.items[slug],u=shareUrl(slug),eu=encodeURIComponent(u),et=encodeURIComponent(d.title.replace(/&amp;/g,'&'));
 const media=n.yt?ytBox(YT[n.yt][lang],`${n.poster}${lang}.jpg`,d.alt):`<a href="${n.img}" target="_blank" rel="noopener"><img src="${n.img}" alt="${d.alt}" decoding="async"></a>`;
 const sh=[['linkedin','LinkedIn',`https://www.linkedin.com/sharing/share-offsite/?url=${eu}`],['x-logo','X',`https://twitter.com/intent/tweet?url=${eu}&text=${et}`],['whatsapp','WhatsApp',`https://wa.me/?text=${et}%20${eu}`],['facebook','Facebook',`https://www.facebook.com/sharer/sharer.php?u=${eu}`],['mail','E-posta',`mailto:?subject=${et}&body=${eu}`]];
 return {title:d.title.replace(/&amp;/g,'&'),html:`<section class="news-detail"><div class="container"><a class="news-back" href="#insights"><i data-i="arrow-left" s="14"></i>${t.back}</a><div class="news-head">${eb(d.tag)}<h1>${d.title}</h1></div><div class="news-layout"><div class="news-media${n.yt?' is-video':''}">${media}</div><div class="news-body">${d.facts.length?`<ul class="news-facts">${d.facts.map(f=>`<li><i data-i="${f[0]}" s="16"></i><span>${f[1]}</span></li>`).join('')}</ul>`:''}${d.body.map(p=>`<p>${p}</p>`).join('')}<div class="news-share"><span class="news-share-label">${t.share}</span><div class="share-row">${sh.map(x=>`<a class="share-btn" href="${x[2]}" target="_blank" rel="noopener" aria-label="${x[1]}" title="${x[1]}"><i data-i="${x[0]}" s="16"></i></a>`).join('')}<button type="button" class="share-btn share-native" data-share="${slug}" aria-label="${t.native}" title="${t.native}" hidden><i data-i="share-2" s="16"></i></button></div><div class="share-link"><input type="text" readonly value="${u}" aria-label="URL"><button type="button" class="share-copy" data-copy="${u}">${t.copy}</button></div></div></div></div></div></section>${cta()}`}};
const TEAM=[{k:'gozde',name:'Gözde Kuşçuoğlu',photo:'assets/people/gozde-kuscuoglu-v2.jpg'},{k:'mehmet',name:'Mehmet Çakmak',photo:'assets/people/mehmet-cakmak-v2.jpg'},{k:'ada',name:'Ada Gürüney',photo:'assets/people/ada-guruney-v2.jpg'},{k:'kaan',name:'Kaan İlısu',photo:'assets/people/kaan-ilisu-v2.jpg'}];
const ECO=[{mark:null,name:null},{mark:'SG',name:'Sistem Global'},{mark:'BTS',name:'BTS'},{mark:'ND',name:'NTT DATA'}];

/* ---------------- State ---------------- */
let lang='tr';
try{const s=localStorage.getItem('implika-lang');if(s==='en'||s==='tr')lang=s}catch(_){}
const T=()=>L[lang];

/* ---------------- Builders ---------------- */
const eb=t=>`<div class="eyebrow"><span></span>${t}</div>`;
const cta=()=>{const c=T().cta;return `<section class="cta-band has-bg bg-topo"><div class="container cta-inner"><div>${eb(c.eb)}<h2>${c.h2}</h2></div><a class="button" href="#contact">${c.btn}<i data-i="arrow-right" s="16"></i></a></div></section>`};
const solutionsGrid=(cls='')=>{const t=T();return `<section class="solutions-section ${cls}"><div class="container"><div class="section-heading split"><div>${eb(t.sol.eb)}<h2>${t.sol.h2}</h2></div><p>${t.sol.p}</p></div><div class="solution-grid">${MOD_META.map(m=>{const d=t.mods[m.id];return `<a class="solution-card" href="#${m.id}"><div class="card-top"><span>${m.n}</span><i data-i="${m.icon}" s="20"></i></div><span class="card-layer">${d.layer}</span><h3>${d.name}</h3><p>${d.card}</p><div class="card-link">${t.sol.link} <i data-i="arrow-up-right" s="16"></i></div></a>`}).join('')}</div></div></section>`};
const flipCard=(i,name,photo,bio,role)=>`<article class="board-card people-card"><div class="flip" tabindex="0" role="button" aria-pressed="false" aria-label="${name} — ${T().team.flip}"><div class="flip-inner"><div class="flip-face flip-front"><img src="${photo}" alt="${name}" width="600" height="600"></div><div class="flip-face flip-back"><span class="flip-mark">${name}</span><p>${bio}</p></div></div></div><span class="board-index">0${i+1}</span><h3>${name}</h3><p>${role}</p></article>`;
const peopleHint=()=>`<p class="team-hint people-hint"><i data-i="rotate-3d" s="15"></i>${T().team.hint}</p>`;
const boardGrid=()=>`${peopleHint()}<div class="board-grid">${BOARD.map((b,i)=>flipCard(i,b[1],b[2],T().board.bios[i],b[3]?T().board.chair:T().board.role)).join('')}</div>`;
const advisorySection=()=>{const a=T().advisory;return `<section class="advisory-section"><div class="container"><div class="section-heading centered">${eb(a.eb)}<h2>${a.h}</h2><p>${a.p}</p></div><ul class="advisory-list">${ADVISORY.map((m,i)=>`<li class="advisory-item${m[2]?' is-partner':''}"><span class="advisory-index" aria-hidden="true">${String(i+1).padStart(2,'0')}</span><span class="monogram" aria-hidden="true"><span>${m[0]}</span></span><h3>${m[1]}</h3><p>${m[2]?a.partner:a.member}</p></li>`).join('')}</ul></div></section>`};
const teamSection=()=>{const t=T().team;return `<section class="team-section"><div class="container"><div class="section-heading centered">${eb(t.eb)}<h2>${t.h}</h2></div>${peopleHint()}<div class="board-grid team-grid">${TEAM.map((m,i)=>{const x=t.members[m.k]||{role:t.role,bio:t.bio};return flipCard(i,m.name,m.photo,x.bio,x.role)}).join('')}</div></div></section>`};
const peopleExtra=()=>advisorySection()+teamSection();
const intro=(o,accent,bg)=>`<section class="page-intro${accent?' accent-intro':''}${bg?` has-bg bg-${bg}`:''}"><div class="container">${eb(o.eb)}<h1>${o.h1||o.h}</h1><p>${o.p}</p></div></section>`;
const flowLine=steps=>`<div class="flow-line" style="--n:${steps.length}">${steps.map((s,i,a)=>`<div class="flow-step"><span>0${i+1}</span><div class="fs-text"><strong>${s[0]}</strong><p>${s[1]}</p></div>${i<a.length-1?'<i data-i="arrow-right" s="17"></i>':''}</div>`).join('')}</div>`;
const noteBox=t=>`<div class="role-note"><i data-i="shield-check" s="18"></i><span>${t}</span></div>`;
const story=(n,ebt,h,ps,alt)=>`<section class="about-story${alt?' alt':''}"><div class="container story-grid"><div class="story-aside"><span class="large-number">${n}</span>${eb(ebt)}</div><div class="story-copy"><h2>${h}</h2>${ps.map(p=>`<p>${p}</p>`).join('')}</div></div></section>`;
const startSection=k=>{const x=T().start[k];if(!x)return '';return `<section class="start-section"><div class="container"><div class="section-heading split"><div>${eb(x.eb)}<h2>${x.h}</h2></div></div>${flowLine(x.steps)}<div class="start-foot">${x.needs?`<div class="start-needs"><strong>${x.needT}</strong><ul>${x.needs.map(n=>`<li><i data-i="check" s="14"></i>${n}</li>`).join('')}</ul>${x.note?`<p>${x.note}</p>`:''}</div>`:''}<a class="button" href="#contact">${x.btn}<i data-i="arrow-right" s="16"></i></a></div></div></section>`};
const audienceDetail=(o,icon,bg,k)=>`${intro(o,true,bg)}<section class="audience-detail"><div class="container audience-detail-grid"><div><div class="feature-icon"><i data-i="${icon}" s="25"></i></div><h2>${o.h2}</h2></div><div><p class="lead">${o.lead}</p><ul class="check-list">${o.list.map(l=>`<li><span><i data-i="check" s="14"></i></span>${l}</li>`).join('')}</ul>${o.note?noteBox(o.note):''}<a class="button" href="#contact">${o.btn}<i data-i="arrow-right" s="16"></i></a></div></div></section>${startSection(k)}${solutionsGrid('compact')}${cta()}`;

const scFlow=()=>{const c=T().sc;return `<div class="sc-flow"><ol class="sc-steps">${c.steps.map((s,i)=>{const ph=i<3?0:i<6?1:2;return `<li class="sc-step p${ph+1}"><span class="sc-num">${i+1}</span><em class="sc-ph">${c.phases[ph]}</em><strong>${s[0]}</strong><p>${s[1]}</p></li>`}).join('')}</ol><div class="sc-phases" aria-hidden="true"><span class="ph1">${c.phases[0]}</span><span class="ph2">${c.phases[1]}</span><span class="ph3">${c.phases[2]}</span></div><div class="sc-props">${c.props.map(x=>`<div><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div></div>`};
const scSpot=()=>{const c=T().sc;return `<section class="sc-section"><div class="container"><div class="section-heading split"><div>${eb(c.eb)}<h2>${c.h}</h2></div></div>${scFlow()}<div class="flow-more"><a class="text-link" href="#supply">${c.link}<i data-i="arrow-right" s="16"></i></a></div></div></section>`};
const supplyExtra=()=>{const c=T().sc;return `<section class="sc-section"><div class="container"><div class="section-heading split"><div>${eb(c.eb)}<h2>${c.h}</h2></div></div>${scFlow()}</div></section>
<section class="cmp-section"><div class="container"><div class="section-heading centered">${eb(c.cmpEb)}<h2>${c.cmpH}</h2></div><table class="cmp-table"><thead><tr><th scope="col"><span class="sr-only">${c.cmpEb}</span></th><th scope="col">${c.cmpCols[1]}</th><th scope="col" class="imp">${c.cmpCols[2]}</th></tr></thead><tbody>${c.cmp.map(r=>`<tr><th scope="row">${r[0]}</th><td data-l="${c.cmpCols[1]}">${r[1]}</td><td class="imp" data-l="${c.cmpCols[2]}">${r[2]}</td></tr>`).join('')}</tbody></table></div></section>

  </div>
 </div>
 <div class="footer-bottom"><span>${fo.copy}</span><div class="socials"><a aria-label="${fo.li}" href="${LINKEDIN}" target="_blank" rel="noopener noreferrer"><i data-i="linkedin" s="16"></i></a><a aria-label="${fo.ig}" href="https://www.instagram.com/implika_tech/" target="_blank" rel="noopener noreferrer"><i data-i="instagram" s="16"></i></a><a aria-label="${fo.xl}" href="https://x.com/implika_tech" target="_blank" rel="noopener noreferrer"><i data-i="x-logo" s="15"></i></a><a aria-label="YouTube" href="https://www.youtube.com/@%C4%B0mplika-m5k" target="_blank" rel="noopener noreferrer"><i data-i="youtube" s="17"></i></a></div><span class="legal-links"><a href="#privacy">${fo.privacy}</a> · <a href="#terms">${fo.terms}</a></span></div>`;
 demoInner.innerHTML=`<button class="demo-close" type="button" aria-label="${d.close}" data-close><i data-i="x" s="20"></i></button>
 <div class="demo-header">${eb(d.eb)}<h2 id="demo-title">${d.h2}</h2></div>
 <div data-form-wrap><form class="form" data-form="demo" novalidate>
  <div class="form-row"><label for="d-name">${d.name}<input id="d-name" name="${d.name}" required autocomplete="name"></label><label for="d-company">${d.company}<input id="d-company" name="${d.company}" data-role="company" required autocomplete="organization"></label></div>
  <label for="d-email">${d.email}<input id="d-email" name="${d.email}" type="email" required autocomplete="email"></label>
  <label for="d-module">${d.module}<select id="d-module" name="${d.module}" data-role="module" required><option value="">${t.contact.f.select}</option>${MOD_META.map(m=>`<option>${t.mods[m.id].name}</option>`).join('')}</select></label>
  <button class="button" type="submit">${d.submit} <i data-i="arrow-right" s="16"></i></button>
 </form></div>`;
 hydrate(document.getElementById('header-inner'));hydrate(document.getElementById('footer-inner'));hydrate(demoInner);
 document.documentElement.lang=lang;
 const md=document.querySelector('meta[name="description"]');if(md)md.content=t.meta.desc;
}

const app=document.getElementById('app');
const demo=document.getElementById('demo');
const demoInner=document.getElementById('demo-inner');
let currentKey='home';
function closeMenus(){document.querySelectorAll('.nav-item.open').forEach(n=>{n.classList.remove('open');n.querySelector('button')?.setAttribute('aria-expanded','false')})}
function render(keepScroll){
 const key=(location.hash||'').replace(/^#\/?/,'')||'home';
 const nm=key.match(/^news\/([\w-]+)$/),ni=nm&&NEWS.find(x=>x.slug===nm[1]);
 let [base,sec]=ni?[key]:key.split('/');if(base==='board'){base='governance';sec=sec||'board'}
 currentKey=ni?'insights':PAGES[base]?base:'home';
 const page=ni?newsPage(ni.slug):PAGES[currentKey]();
 app.innerHTML=page.html;hydrate(app);
 if(navigator.share)app.querySelectorAll('.share-native').forEach(b=>b.hidden=false);
 document.title=currentKey==='home'?page.title:`${page.title} — ${T().brand}`;
 document.querySelectorAll('.nav-item>a').forEach(a=>a.classList.toggle('current',a.getAttribute('href')==='#'+currentKey));
 closeMenus();const nav=document.getElementById('main-nav');nav&&nav.classList.remove('open');
 document.body.classList.toggle('home-dark',currentKey==='home');
 if(!keepScroll){window.scrollTo(0,0);if(sec){const el=document.getElementById(sec);if(el)requestAnimationFrame(()=>el.scrollIntoView())}}
}
function setLang(l){if(l===lang)return;lang=l;try{localStorage.setItem('implika-lang',l)}catch(_){}const wasOpen=!demo.hidden;renderChrome();render(true);if(wasOpen)openDemo()}
window.addEventListener('hashchange',()=>render(false));

document.addEventListener('click',e=>{
 const lb=e.target.closest('[data-lang]');if(lb){setLang(lb.dataset.lang);return}
 const nb=e.target.closest('.nav-item>button');
 if(nb&&canHover()&&nb.dataset.href){location.hash=nb.dataset.href;closeMenus();return}
 if(nb){e.stopPropagation();const item=nb.parentElement;const was=item.classList.contains('open');closeMenus();if(!was){item.classList.add('open');nb.setAttribute('aria-expanded','true')}return}
 if(!e.target.closest('.nav-item'))closeMenus();
 const mb=e.target.closest('.menu-button');if(mb){const nav=document.getElementById('main-nav');const o=nav.classList.toggle('open');mb.setAttribute('aria-expanded',String(o));return}
 if(e.target.closest('[data-demo]')){openDemo();return}
 if(e.target===demo||e.target.closest('[data-close]')){closeDemo();return}
 const cb=e.target.closest('[data-copy]');if(cb)copyText(cb.dataset.copy,cb);
 const yb=e.target.closest('.yt-play');if(yb){const box=yb.parentElement,id=box.dataset.yt;box.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&modestbranding=1&playsinline=1" title="YouTube" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;return}
 const fl=e.target.closest('.flip');if(fl)toggleFlip(fl);
 const ns=e.target.closest('[data-share]');if(ns){const d=T().news.items[ns.dataset.share];navigator.share({title:d.title.replace(/&amp;/g,'&'),text:d.sum.replace(/&amp;/g,'&'),url:shareUrl(ns.dataset.share)}).catch(()=>{})}
});
function toggleFlip(f,v){const on=v===undefined?!f.classList.contains('is-flipped'):v;f.classList.toggle('is-flipped',on);f.setAttribute('aria-pressed',String(on))}
document.addEventListener('keydown',e=>{const f=e.target.closest&&e.target.closest('.flip');if(f&&(e.key==='Enter'||e.key===' ')){e.preventDefault();toggleFlip(f)}});
document.addEventListener('mouseout',e=>{const f=e.target.closest&&e.target.closest('.flip');if(f&&!f.contains(e.relatedTarget)&&matchMedia('(hover:hover)').matches)toggleFlip(f,false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDemo();closeMenus()}});
let hoverT;const canHover=()=>matchMedia('(hover:hover) and (min-width:821px)').matches;
document.addEventListener('mouseover',e=>{if(!canHover())return;const it=e.target.closest&&e.target.closest('.nav-item');if(!it||!it.querySelector('.dropdown'))return;clearTimeout(hoverT);if(!it.classList.contains('open')){closeMenus();it.classList.add('open');it.querySelector('button')?.setAttribute('aria-expanded','true')}});
document.addEventListener('mouseout',e=>{if(!canHover())return;const it=e.target.closest&&e.target.closest('.nav-item.open');if(!it||it.contains(e.relatedTarget))return;clearTimeout(hoverT);hoverT=setTimeout(()=>{if(!it.matches(':hover'))closeMenus()},220)});
function openDemo(){renderDemoForm();demo.hidden=false;demo.querySelector('input')?.focus()}
function renderDemoForm(){if(!demoInner.querySelector('form')){renderChrome()}}
function closeDemo(){demo.hidden=true}

async function copyText(text,btn){
 const label=btn.innerHTML,c=T().copy;
 try{await navigator.clipboard.writeText(text);btn.textContent=c.done}
 catch(_){const tgt=btn.closest('.sent')?.querySelector('pre')||btn.closest('.mail-line')?.querySelector('a');if(tgt){const r=document.createRange();r.selectNodeContents(tgt);const s=getSelection();s.removeAllRanges();s.addRange(r)}btn.textContent=c.sel}
 setTimeout(()=>{btn.innerHTML=label},2200);
}

document.addEventListener('submit',e=>{
 const f=e.target.closest('form[data-form]');if(!f)return;
 e.preventDefault();
 if(!f.checkValidity()){f.reportValidity();return}
 const t=T(),isDemo=f.dataset.form==='demo';
 const company=f.querySelector('[data-role="company"]').value.trim();
 const subject=isDemo?t.demo.subj(f.querySelector('[data-role="module"]').value,company):t.contact.subj(company);
 const msgEl=f.querySelector('[data-role="message"]');
 const lines=[...f.querySelectorAll('input,select')].filter(el=>el.value.trim()).map(el=>`${el.name}: ${el.value.trim()}`);
 if(msgEl)lines.push('',msgEl.value.trim());
 const body=lines.join('\n');
 const full=`${t.sent.to}: ${EMAIL}\n${t.sent.subject}: ${subject}\n\n${body}`;
 const mailto=`mailto:${EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
 const wrap=f.closest('[data-form-wrap]');
 wrap.innerHTML=`<div class="sent"><h3><i data-i="circle-check" s="22"></i>${t.sent.h}</h3><p>${t.sent.p}</p><pre></pre><div class="actions"><a class="button" href="${mailto}" target="_blank" rel="noopener">${t.sent.open} <i data-i="mail" s="16"></i></a><button class="button ghost" type="button" data-copy="">${t.sent.copy} <i data-i="copy" s="16"></i></button></div></div>`;
 wrap.querySelector('pre').textContent=full;
 wrap.querySelector('[data-copy]').dataset.copy=full;
 hydrate(wrap);
});

renderChrome();
render(false);
</script>

</body>
</html>
