const ytBox=(id,poster,label)=>`<div class="yt" data-yt="${id}"><button type="button" class="yt-play" aria-label="${label}"><img src="${poster}" alt="" loading="lazy" decoding="async"><span class="yt-btn"><i data-i="play" s="26"></i></span></button></div>`;
const shareUrl=slug=>`${SITE}/${lang==='en'?'en/':''}news/${slug}/`;
const newsCard=n=>{const d=T().news.items[n.slug];return `<a class="video-card news-card" href="#news/${n.slug}" aria-label="${T().news.open}: ${d.title}"><div class="video-thumb has-media"><img src="${n.thumb}" alt="" loading="lazy" decoding="async">${n.yt?`<div class="play-btn"><i data-i="play" s="22"></i></div>`:''}<span class="video-topic">${d.tag}</span></div><div class="video-meta"><strong>${d.title}</strong><span>${d.card}</span></div></a>`};
const newsPage=slug=>{const n=NEWS.find(x=>x.slug===slug),t=T().news,d=t.items[slug],u=shareUrl(slug),eu=encodeURIComponent(u),et=encodeURIComponent(d.title.replace(/&amp;/g,'&'));
 const media=n.yt?ytBox(YT[n.yt][lang],`${n.poster}${lang}.jpg`,d.alt):`<a href="${n.img}" target="_blank" rel="noopener"><img src="${n.img}" alt="${d.alt}" decoding="async"></a>`;
 const sh=[['linkedin','LinkedIn',`https://www.linkedin.com/sharing/share-offsite/?url=${eu}`],['x-logo','X',`https://twitter.com/intent/tweet?url=${eu}&text=${et}`],['whatsapp','WhatsApp',`https://wa.me/?text=${et}%20${eu}`],['facebook','Facebook',`https://www.facebook.com/sharer/sharer.php?u=${eu}`],['mail','E-posta',`mailto:?subject=${et}&body=${eu}`]];
 return {title:d.title.replace(/&amp;/g,'&'),html:`<section class="news-detail"><div class="container"><a class="news-back" href="#insights"><i data-i="arrow-left" s="14"></i>${t.back}</a><div class="news-head">${eb(d.tag)}<h1>${d.title}</h1></div><div class="news-layout"><div class="news-media${n.yt?' is-video':''}">${media}</div><div class="news-body">${d.facts.length?`<ul class="news-facts">${d.facts.map(f=>`<li><i data-i="${f[0]}" s="16"></i><span>${f[1]}</span></li>`).join('')}</ul>`:''}${d.body.map(p=>`<p>${p}</p>`).join('')}<div class="news-share"><span class="news-share-label">${t.share}</span><div class="share-row">${sh.map(x=>`<a class="share-btn" href="${x[2]}" target="_blank" rel="noopener" aria-label="${x[1]}" title="${x[1]}"><i data-i="${x[0]}" s="16"></i></a>`).join('')}<button type="button" class="share-btn share-native" data-share="${slug}" aria-label="${t.native}" title="${t.native}" hidden><i data-i="share-2" s="16"></i></button></div><div class="share-link"><input type="text" readonly value="${u}" aria-label="URL"><button type="button" class="share-copy" data-copy="${u}">${t.copy}</button></div></div></div></div></div></section>${cta()}`}};

/* ---------------- State ---------------- */
let lang='tr';
try{const s=localStorage.getItem('implika-lang');if(s==='en'||s==='tr')lang=s}catch(_){}
const T=()=>L[lang];

/* ---------------- Builders ---------------- */
const eb=t=>`<div class="eyebrow"><span></span>${t}</div>`;
const cta=()=>{const c=T().cta;return `<section class="cta-band has-bg bg-topo"><div class="container cta-inner"><div>${eb(c.eb)}<h2>${c.h2}</h2></div><a class="button" href="#contact">${c.btn}<i data-i="arrow-right" s="16"></i></a></div></section>`};
const solutionsGrid=(cls='')=>{const t=T();return `<section class="solutions-section ${cls}"><div class="container"><div class="section-heading split"><div>${eb(t.sol.eb)}<h2>${t.sol.h2}</h2></div><p>${t.sol.p}</p></div><div class="solution-grid">${MOD_META.map(m=>{const d=t.mods[m.id];return `<a class="solution-card" href="#${m.id}"><div class="card-top"><span>${m.n}</span><i data-i="${m.icon}" s="20"></i></div><h3>${d.name}</h3><p>${d.card}</p><div class="card-link">${t.sol.link} <i data-i="arrow-up-right" s="16"></i></div></a>`}).join('')}</div></div></section>`};
const flipCard=(i,name,photo,bio,role)=>`<article class="board-card people-card"><div class="flip" tabindex="0" role="button" aria-pressed="false" aria-label="${name} — ${T().team.flip}"><div class="flip-inner"><div class="flip-face flip-front"><img src="${photo}" alt="${name}" width="600" height="600"></div><div class="flip-face flip-back"><span class="flip-mark">${name}</span><p>${bio}</p></div></div></div><span class="board-index">0${i+1}</span><h3>${name}</h3><p>${role}</p></article>`;
const peopleHint=()=>`<p class="team-hint people-hint"><i data-i="rotate-3d" s="15"></i>${T().team.hint}</p>`;
const boardGrid=()=>`${peopleHint()}<div class="board-grid">${BOARD.map((b,i)=>flipCard(i,b[1],b[2],T().board.bios[i],b[3]?T().board.chair:T().board.role)).join('')}</div>`;
const advisorySection=()=>{const a=T().advisory;return `<section class="advisory-section"><div class="container"><div class="section-heading centered">${eb(a.eb)}<h2>${a.h}</h2><p>${a.p}</p></div><ul class="advisory-list">${ADVISORY.map((m,i)=>`<li class="advisory-item${m[2]?' is-partner':''}"><span class="advisory-index" aria-hidden="true">${String(i+1).padStart(2,'0')}</span><span class="monogram" aria-hidden="true"><span>${m[0]}</span></span><h3>${m[1]}</h3><p>${m[2]?a.partner:a.member}</p></li>`).join('')}</ul></div></section>`};
const teamSection=()=>{const t=T().team;return `<section class="team-section"><div class="container"><div class="section-heading centered">${eb(t.eb)}<h2>${t.h}</h2></div>${peopleHint()}<div class="board-grid team-grid">${TEAM.map((m,i)=>{const x=t.members[m.k]||{role:t.role,bio:t.bio};return flipCard(i,m.name,m.photo,x.bio,x.role)}).join('')}</div></div></section>`};
const peopleExtra=()=>advisorySection()+teamSection();
const intro=(o,accent,bg)=>`<section class="page-intro${accent?' accent-intro':''}${bg?` has-bg bg-${bg}`:''}"><div class="container">${eb(o.eb)}<h1>${o.h1||o.h}</h1><p>${o.p}</p></div></section>`;
const flowLine=steps=>`<div class="flow-line" style="--n:${steps.length}">${steps.map((s,i,a)=>`<div class="flow-step"><span>0${i+1}</span><div class="fs-text"><strong>${s[0]}</strong><p>${s[1]}</p></div>${i<a.length-1?'<i data-i="arrow-right" s="17"></i>':''}</div>`).join('')}</div>`;
const noteBox=t=>`<div class="role-note"><i data-i="shield-check" s="18"></i><span>${t}</span></div>`;

 document.documentElement.lang=lang;
 const md=document.querySelector('meta[name="description"]');if(md)md.content=t.meta.desc;
}

const app=document.getElementById('app');
const demo=document.getElementById('demo');
const demoInner=document.getElementById('demo-inner');
let currentKey='home';
function closeMenus(){document.querySelectorAll('.nav-item.open').forEach(n=>{n.classList.remove('open');n.querySelector('button')?.setAttribute('aria-expanded','false')})}
function render(keepScroll){
 const key=(location.hash||'').replace(/^#\/?/,'')||'home';
 const nm=key.match(/^news\/([\w-]+)$/),ni=nm&&NEWS.find(x=>x.slug===nm[1]);
 let [base,sec]=ni?[key]:key.split('/');if(base==='board'){base='governance';sec=sec||'board'}
 currentKey=ni?'insights':PAGES[base]?base:'home';
 const page=ni?newsPage(ni.slug):PAGES[currentKey]();
 app.innerHTML=page.html;hydrate(app);
 if(navigator.share)app.querySelectorAll('.share-native').forEach(b=>b.hidden=false);
 document.title=currentKey==='home'?page.title:`${page.title} — ${T().brand}`;
 document.querySelectorAll('.nav-item>a').forEach(a=>a.classList.toggle('current',a.getAttribute('href')==='#'+currentKey));
 closeMenus();const nav=document.getElementById('main-nav');nav&&nav.classList.remove('open');
 document.body.classList.toggle('home-dark',currentKey==='home');
 if(!keepScroll){window.scrollTo(0,0);if(sec){const el=document.getElementById(sec);if(el)requestAnimationFrame(()=>el.scrollIntoView())}}
}
function setLang(l){if(l===lang)return;lang=l;try{localStorage.setItem('implika-lang',l)}catch(_){}const wasOpen=!demo.hidden;renderChrome();render(true);if(wasOpen)openDemo()}
window.addEventListener('hashchange',()=>render(false));

document.addEventListener('click',e=>{
 const lb=e.target.closest('[data-lang]');if(lb){setLang(lb.dataset.lang);return}
 const nb=e.target.closest('.nav-item>button');
 if(nb&&canHover()&&nb.dataset.href){location.hash=nb.dataset.href;closeMenus();return}
 if(nb){e.stopPropagation();const item=nb.parentElement;const was=item.classList.contains('open');closeMenus();if(!was){item.classList.add('open');nb.setAttribute('aria-expanded','true')}return}
 if(!e.target.closest('.nav-item'))closeMenus();
 const mb=e.target.closest('.menu-button');if(mb){const nav=document.getElementById('main-nav');const o=nav.classList.toggle('open');mb.setAttribute('aria-expanded',String(o));return}
 if(e.target.closest('[data-demo]')){openDemo();return}
 if(e.target===demo||e.target.closest('[data-close]')){closeDemo();return}
 const cb=e.target.closest('[data-copy]');if(cb)copyText(cb.dataset.copy,cb);
 const yb=e.target.closest('.yt-play');if(yb){const box=yb.parentElement,id=box.dataset.yt;box.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&modestbranding=1&playsinline=1" title="YouTube" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;return}
 const fl=e.target.closest('.flip');if(fl)toggleFlip(fl);
 const ns=e.target.closest('[data-share]');if(ns){const d=T().news.items[ns.dataset.share];navigator.share({title:d.title.replace(/&amp;/g,'&'),text:d.sum.replace(/&amp;/g,'&'),url:shareUrl(ns.dataset.share)}).catch(()=>{})}
});
function toggleFlip(f,v){const on=v===undefined?!f.classList.contains('is-flipped'):v;f.classList.toggle('is-flipped',on);f.setAttribute('aria-pressed',String(on))}
document.addEventListener('keydown',e=>{const f=e.target.closest&&e.target.closest('.flip');if(f&&(e.key==='Enter'||e.key===' ')){e.preventDefault();toggleFlip(f)}});
document.addEventListener('mouseout',e=>{const f=e.target.closest&&e.target.closest('.flip');if(f&&!f.contains(e.relatedTarget)&&matchMedia('(hover:hover)').matches)toggleFlip(f,false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDemo();closeMenus()}});
let hoverT;const canHover=()=>matchMedia('(hover:hover) and (min-width:821px)').matches;
document.addEventListener('mouseover',e=>{if(!canHover())return;const it=e.target.closest&&e.target.closest('.nav-item');if(!it||!it.querySelector('.dropdown'))return;clearTimeout(hoverT);if(!it.classList.contains('open')){closeMenus();it.classList.add('open');it.querySelector('button')?.setAttribute('aria-expanded','true')}});
document.addEventListener('mouseout',e=>{if(!canHover())return;const it=e.target.closest&&e.target.closest('.nav-item.open');if(!it||it.contains(e.relatedTarget))return;clearTimeout(hoverT);hoverT=setTimeout(()=>{if(!it.matches(':hover'))closeMenus()},220)});
function openDemo(){renderDemoForm();demo.hidden=false;demo.querySelector('input')?.focus()}
function renderDemoForm(){if(!demoInner.querySelector('form')){renderChrome()}}
function closeDemo(){demo.hidden=true}

async function copyText(text,btn){
 const label=btn.innerHTML,c=T().copy;
 try{await navigator.clipboard.writeText(text);btn.textContent=c.done}
 catch(_){const tgt=btn.closest('.sent')?.querySelector('pre')||btn.closest('.mail-line')?.querySelector('a');if(tgt){const r=document.createRange();r.selectNodeContents(tgt);const s=getSelection();s.removeAllRanges();s.addRange(r)}btn.textContent=c.sel}
 setTimeout(()=>{btn.innerHTML=label},2200);
}

document.addEventListener('submit',e=>{
 const f=e.target.closest('form[data-form]');if(!f)return;
 e.preventDefault();
 if(!f.checkValidity()){f.reportValidity();return}
 const t=T(),isDemo=f.dataset.form==='demo';
 const company=f.querySelector('[data-role="company"]').value.trim();
 const subject=isDemo?t.demo.subj(f.querySelector('[data-role="module"]').value,company):t.contact.subj(company);
 const msgEl=f.querySelector('[data-role="message"]');
 const lines=[...f.querySelectorAll('input,select')].filter(el=>el.value.trim()).map(el=>`${el.name}: ${el.value.trim()}`);
 if(msgEl)lines.push('',msgEl.value.trim());
 const body=lines.join('\n');
 const full=`${t.sent.to}: ${EMAIL}\n${t.sent.subject}: ${subject}\n\n${body}`;
 const mailto=`mailto:${EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
 const wrap=f.closest('[data-form-wrap]');
 wrap.innerHTML=`<div class="sent"><h3><i data-i="circle-check" s="22"></i>${t.sent.h}</h3><p>${t.sent.p}</p><pre></pre><div class="actions"><a class="button" href="${mailto}" target="_blank" rel="noopener">${t.sent.open} <i data-i="mail" s="16"></i></a><button class="button ghost" type="button" data-copy="">${t.sent.copy} <i data-i="copy" s="16"></i></button></div></div>`;
 wrap.querySelector('pre').textContent=full;
 wrap.querySelector('[data-copy]').dataset.copy=full;
 hydrate(wrap);
});

renderChrome();
render(false);
</script>

</body>
</html>
