*,:before,:after{box-sizing:border-box;border-width:0;border-style:solid;border-color:#e5e7eb}
html{line-height:1.5;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
h1,h2,h3,h4,p,figure,blockquote{margin:0;font-size:inherit;font-weight:inherit}
ul,ol{list-style:none;margin:0;padding:0}
img,svg{display:block;vertical-align:middle}
img{max-width:100%;height:auto}
button,input,select,textarea{font:inherit;color:inherit;margin:0;padding:0}
button{border:0;cursor:pointer;background:transparent}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid #7fae54;outline-offset:3px}

:root{font-family:Manrope,"Segoe UI",Helvetica,Arial,sans-serif;color:#17201d;background:#f4f5f0;font-synthesis:none;
--ink:#17201d;--muted:#66716c;--line:#d9ded7;--paper:#f4f5f0;--white:#fbfcf9;--forest:#173a2d;--green:#7fae54;--mint:#dcebd8;--orange:#c96443;
--mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace}
body{margin:0;min-width:320px;background:var(--paper);color:var(--ink);font-family:Manrope,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px}
h1,h2,h3{text-wrap:balance}
.container{width:min(1180px,calc(100% - 64px));margin:0 auto}

/* Header */
.site-header{height:88px;border-bottom:1px solid rgba(23,32,29,.08);position:relative;z-index:10;background:#f4f5f0f5}
.nav-wrap{height:100%;display:flex;align-items:center;justify-content:space-between;gap:28px}
.logo{width:170px;height:42px;display:inline-flex;align-items:center}
.logo-img{height:40px;width:auto;object-fit:contain}
.main-nav{display:flex;align-items:center;gap:22px;margin-left:auto}
.nav-item{position:relative}
.nav-item>a,.nav-item>button{display:flex;align-items:center;gap:5px;background:transparent;color:#4c5851;font-size:12px;font-weight:600;padding:16px 0;transition:color .2s}
.nav-item>a:hover,.nav-item>button:hover,.nav-item>a.current{color:var(--forest)}
.nav-item svg{transition:transform .2s}
.nav-item.open>button svg{transform:rotate(180deg)}
.dropdown{display:none;position:absolute;min-width:210px;top:47px;left:-18px;padding:8px;background:var(--white);border:1px solid var(--line);box-shadow:0 16px 34px #1a2c221a}
.nav-item.open .dropdown{display:grid}
.dropdown a{padding:11px 12px;font-size:12px;color:var(--muted)}
.dropdown a:hover{background:var(--mint);color:var(--forest)}
.dropdown-parent{font-weight:700;color:var(--forest)!important;border-bottom:1px solid var(--line);margin-bottom:4px}
.nav-actions{display:flex;align-items:center;gap:20px}
.button{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 20px;background:var(--forest);color:#fff;border:1px solid var(--forest);font-size:12px;font-weight:700;letter-spacing:.01em;transition:background .2s,transform .2s}
.button:hover{background:#245843;transform:translateY(-2px)}
.button-small{padding:11px 14px;font-size:11px}
.button svg{transition:transform .2s}
.button:hover svg{transform:translate(3px)}
.button.ghost{background:transparent;color:var(--forest)}
.button.ghost:hover{background:var(--mint)}
.text-link{display:inline-flex;align-items:center;gap:8px;color:var(--forest);font-weight:700;font-size:12px}
.text-link svg{transition:transform .2s}
.text-link:hover svg{transform:translate(3px,-3px)}
.menu-button{display:none;background:none;color:var(--forest);padding:5px}

/* Hero */
.hero{min-height:650px;background:var(--paper);position:relative;overflow:hidden}
.hero-grid{min-height:595px;display:grid;grid-template-columns:54% 46%;align-items:center}
.hero-grid>*{min-width:0}
.hero-copy{padding:72px 0 65px;position:relative;z-index:1;max-width:630px}
.eyebrow{display:flex;align-items:center;gap:9px;color:var(--orange);font:10px var(--mono);text-transform:uppercase;letter-spacing:.11em;margin-bottom:20px}
.eyebrow span{width:25px;height:1px;background:var(--orange);display:inline-block;flex:0 0 auto}
.hero h1{max-width:680px;color:var(--forest);font-size:clamp(46px,5vw,75px);line-height:1.02;letter-spacing:-.07em;margin:0 0 25px;font-weight:700}
h1 em,h2 em{color:var(--green);font-style:normal}
.hero-copy>p{color:var(--muted);line-height:1.8;max-width:550px;font-size:14px;margin:0 0 28px}
.hero-actions{display:flex;align-items:center;gap:27px;flex-wrap:wrap}
.hero-footnote{display:flex;gap:8px;align-items:center;color:#89948b;font:10px var(--mono);margin-top:57px}
.hero-art{height:530px;position:relative;display:flex;align-items:center;justify-content:center}
.data-visual{width:405px;height:405px;position:relative}
.visual-grid{position:absolute;top:11%;right:-12%;bottom:-9%;left:3%;opacity:.3;background-image:linear-gradient(#9daaa0 1px,transparent 1px),linear-gradient(90deg,#9daaa0 1px,transparent 1px);background-size:30px 30px;transform:perspective(600px) rotateX(57deg) rotate(-25deg);-webkit-mask-image:linear-gradient(to bottom,transparent,black 35%,transparent 90%);mask-image:linear-gradient(to bottom,transparent,black 35%,transparent 90%)}
.visual-orbit{position:absolute;border:1px solid #b2c5ad;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-28deg)}
.orbit-one{width:355px;height:160px}
.orbit-two{width:250px;height:360px;transform:translate(-50%,-50%) rotate(42deg);border-color:#cad8c5}
.visual-core{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);height:104px;width:104px;display:grid;align-content:center;justify-items:center;gap:5px;background:var(--forest);color:#fff;border-radius:50%;box-shadow:0 0 0 15px #7fae5421,0 0 0 40px #7fae540d}
.visual-core span{font:9px var(--mono);text-align:center;letter-spacing:.12em}
.visual-node{position:absolute;display:grid;place-items:center;background:var(--white);width:44px;height:44px;border-radius:50%;color:var(--orange);border:1px solid #cbd8c7;box-shadow:0 5px 15px #1e3f2d14}
.node-one{top:35px;left:58px}.node-two{top:85px;right:18px;color:#658e52}.node-three{bottom:40px;left:45px;color:#8b8066}
.visual-line{position:absolute;height:1px;background:#aec2a9;transform-origin:left}
.line-one{width:93px;left:95px;top:93px;transform:rotate(31deg)}
.line-two{width:87px;right:44px;top:118px;transform:rotate(157deg)}
.line-three{width:105px;left:79px;bottom:73px;transform:rotate(-28deg)}
.art-label{position:absolute;font:9px var(--mono);letter-spacing:.17em;color:#8b978b;line-height:1.7}
.art-label strong{color:var(--forest);font-weight:500}
.label-top{top:45px;right:18px}.label-bottom{bottom:22px;left:20px}
.label-bottom span{color:var(--orange);padding:0 5px}
.hero-scroll{position:absolute;bottom:22px;left:max(32px,calc((100vw - 1180px)/2));display:flex;align-items:center;gap:11px;color:#9da9a0;font:10px var(--mono)}
.hero-scroll div{width:55px;height:1px;background:#b7c3ba}
.hero-scroll span:first-child{color:var(--forest)}
@media (prefers-reduced-motion:no-preference){
 .orbit-one{animation:spin1 40s linear infinite}.orbit-two{animation:spin2 55s linear infinite}
 @keyframes spin1{to{transform:translate(-50%,-50%) rotate(332deg)}}
 @keyframes spin2{to{transform:translate(-50%,-50%) rotate(-318deg)}}
}

/* Sections */
.flow-section,.audience-section,.all-products{background:var(--white)}
.flow-section{padding:115px 0 120px}
.section-heading.centered{text-align:center;max-width:680px;margin:0 auto 62px}
.section-heading.centered .eyebrow{justify-content:center}
.section-heading h2,.section-heading.split h2{color:var(--forest);font-size:clamp(30px,3.3vw,48px);line-height:1.08;letter-spacing:-.06em;margin:0;font-weight:700}
.section-heading p{color:var(--muted);font-size:13px;line-height:1.8;margin:17px auto 0;max-width:530px}
.flow-line{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.flow-step{position:relative;padding:25px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.flow-step:not(:last-child):after{content:"";position:absolute;right:0;top:0;height:100%;width:1px;background:var(--line)}
.flow-step>svg{position:absolute;right:-8px;top:50%;color:var(--green);background:var(--white);z-index:1}
.flow-step span,.product-index,.large-number{color:var(--orange);font:10px var(--mono)}
.flow-step strong{color:var(--forest);font-size:14px}
.solutions-section{padding:123px 0;background:var(--paper)}
.solutions-section.compact{padding:90px 0}
.section-heading.split{display:flex;align-items:flex-end;justify-content:space-between;gap:50px;margin-bottom:55px}
.section-heading.split>div{max-width:650px}
.section-heading.split p{margin:0;width:330px;font-size:13px;line-height:1.75}
.solution-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.solution-card{min-height:310px;padding:25px 22px;background:var(--white);border:1px solid #e4e8e1;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s,background .25s}
.solution-card:hover{transform:translateY(-6px);background:var(--forest);color:#fff;box-shadow:0 18px 34px #153b2c24}
.card-top{display:flex;justify-content:space-between;color:var(--green);margin-bottom:45px}
.solution-card:hover .card-top{color:#a9ce89}
.card-top span{font:10px var(--mono)}
.solution-card h3{font-size:18px;letter-spacing:-.04em;color:var(--forest);margin:0 0 15px;font-weight:700}
.solution-card:hover h3{color:#fff}
.solution-card p{color:var(--muted);font-size:12px;line-height:1.7;margin:0 0 24px}
.solution-card:hover p{color:#c3d3c9}
.card-link{display:flex;align-items:center;gap:7px;margin-top:auto;color:var(--forest);font-size:11px;font-weight:700}
.solution-card:hover .card-link{color:#fff}
.audience-section{padding:115px 0}
.audience-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.audience-card{padding:42px;background:var(--mint);position:relative;overflow:hidden;min-height:330px}
.audience-card:nth-child(2){background:#e7e7da}
.audience-icon{color:var(--forest);margin-bottom:47px}
.audience-card h3{color:var(--forest);font-size:26px;margin:0 0 12px;letter-spacing:-.05em;font-weight:700}
.audience-card p{color:#5c6d60;font-size:13px;line-height:1.75;max-width:420px}
.audience-card ul{display:flex;flex-wrap:wrap;gap:9px 21px;padding:11px 0 20px;margin:0;color:#56675b;font-size:11px}
.audience-card li{display:flex;align-items:center;gap:7px}
.audience-card li svg{color:var(--orange)}
.products-section{padding:117px 0;background:var(--paper)}
.product-list{border-top:1px solid var(--line)}
.product-row{min-height:90px;display:grid;grid-template-columns:60px 1.2fr 2fr 150px 24px;align-items:center;gap:20px;border-bottom:1px solid var(--line);transition:padding .2s,background .2s}
.product-row:hover{padding:0 16px;background:var(--white)}
.product-row>svg{color:var(--green)}
.product-name{color:var(--forest);font-size:16px;font-weight:700}
.product-description{color:var(--muted);font-size:11px;line-height:1.5}
.status{justify-self:start;padding:6px 9px;border:1px solid #cbd2ca;color:#7b867d;font:9px var(--mono)}
.status.available{color:#5e8c48;border-color:#b9d2ad}
.cta-band{background:var(--forest);color:#fff;padding:92px 0;position:relative;overflow:hidden}
.cta-band:after{content:"";position:absolute;width:420px;height:420px;border:1px solid rgba(177,210,155,.2);border-radius:50%;right:8%;top:-130px;box-shadow:0 0 0 54px #b1d29b0d,0 0 0 112px #b1d29b08}
.cta-inner{display:flex;align-items:center;justify-content:space-between;gap:30px;position:relative;z-index:1}
.cta-band .eyebrow,.accent-intro .eyebrow,.about-closing .eyebrow,.iaas-section .eyebrow{color:#a8cb8c}
.cta-band .eyebrow span,.accent-intro .eyebrow span,.about-closing .eyebrow span,.iaas-section .eyebrow span{background:#a8cb8c}
.cta-band h2{font-size:clamp(34px,4.2vw,58px);line-height:1.06;letter-spacing:-.06em;margin:0;font-weight:700}
.cta-band h2 em{color:#a8cb8c}
.cta-band .button{background:#b0d28d;color:var(--forest);border-color:#b0d28d}
.cta-band .button:hover{background:#fff}

/* Inner pages */
.page-intro{padding:100px 0 105px;background:var(--paper)}
.page-intro h1{color:var(--forest);max-width:820px;font-size:clamp(44px,5.2vw,72px);line-height:1.03;letter-spacing:-.07em;margin:0 0 25px;font-weight:700}
.page-intro p{color:var(--muted);font-size:15px;line-height:1.8;max-width:650px;margin:0}
.accent-intro{background:var(--forest)}
.accent-intro h1{color:#fff}
.accent-intro p{color:#bfcec2}
.detail-section{background:var(--white);padding:125px 0}
.detail-grid{display:grid;grid-template-columns:minmax(0,37fr) minmax(0,63fr);gap:80px}
.feature-icon{display:grid;place-items:center;width:55px;height:55px;color:var(--orange);border:1px solid #dfc8be;margin-bottom:55px}
.detail-sticky .large-number{font-size:13px}
.detail-sticky h2{color:var(--forest);font-size:42px;line-height:1.04;letter-spacing:-.065em;margin:16px 0;font-weight:700}
.detail-content{padding-top:25px;min-width:0}
.content-block{margin-bottom:58px}
.lead{color:var(--forest);font-size:22px;line-height:1.45;letter-spacing:-.035em;margin:0}
.content-block h3{color:var(--forest);font-size:24px;margin:0 0 15px;letter-spacing:-.04em;font-weight:700}
.content-block p:not(.lead){color:var(--muted);line-height:1.8;font-size:14px;max-width:600px}
.capability-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 20px;margin-bottom:65px;border-top:1px solid var(--line)}
.capability{display:flex;gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}
.capability span{color:var(--orange);font:10px var(--mono);padding-top:3px}
.capability strong{color:var(--forest);font-size:13px}
.about-story{background:var(--white);padding:125px 0}
.about-story.alt{background:var(--paper)}
.about-story.alt .story-aside .large-number{color:var(--green)}
.expertise-icon{display:grid;place-items:center;width:44px;height:44px;color:var(--orange);border:1px solid #dfc8be;margin:18px 0 0}
.about-closing{background:var(--forest);color:#fff;padding:95px 0}
.about-closing h2{font-size:clamp(34px,4vw,54px);line-height:1.06;letter-spacing:-.065em;margin:0 0 20px;font-weight:700}
.about-closing p{color:#bfcec2;font-size:15px;line-height:1.8;max-width:620px;margin:0}
.about-board{background:var(--white);padding-top:120px}
.story-grid{display:grid;grid-template-columns:minmax(0,32fr) minmax(0,68fr);gap:80px}
.story-aside .large-number{display:block;font-size:13px;margin-bottom:95px}
.story-copy{min-width:0}
.story-copy h2{color:var(--forest);max-width:680px;font-size:45px;line-height:1.06;letter-spacing:-.065em;margin:0 0 27px;font-weight:700}
.story-copy p{color:var(--muted);font-size:14px;line-height:1.9;max-width:680px}
.story-copy p+p{margin-top:16px}
.expertise-section,.ecosystem-section{padding:120px 0;background:var(--paper)}
.expertise-grid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.expertise-item{padding:25px 24px 10px 0;border-right:1px solid var(--line);margin-right:24px}
.expertise-item:last-child{border:0;margin-right:0}
.expertise-item>span{color:var(--orange);font:10px var(--mono)}
.expertise-item h3{color:var(--forest);font-size:18px;letter-spacing:-.04em;margin:45px 0 13px;font-weight:700}
.expertise-item p,.ecosystem-card p{color:var(--muted);font-size:12px;line-height:1.7}
.ecosystem-section{background:var(--white)}
.ecosystem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.ecosystem-card{min-height:285px;padding:25px 20px;border:1px solid var(--line)}
.ecosystem-brand{height:42px;color:var(--orange);font:11px var(--mono)}
.mini-brand{display:grid;place-items:center;height:29px;width:29px;background:var(--forest);color:#fff;font:16px Manrope,sans-serif}
.ecosystem-card h3{color:var(--forest);font-size:19px;letter-spacing:-.05em;margin:28px 0 8px;font-weight:700}
.ecosystem-card strong{color:var(--green);font-size:11px}
.ecosystem-card p{margin-top:16px}
.audience-detail{background:var(--white);padding:125px 0}
.audience-detail-grid{display:grid;grid-template-columns:minmax(0,46fr) minmax(0,54fr);gap:90px}
.audience-detail-grid h2{color:var(--forest);font-size:43px;line-height:1.06;letter-spacing:-.065em;margin:0;font-weight:700}
.audience-detail-grid>div:last-child{padding-top:34px;min-width:0}
.check-list{padding:18px 0 25px;margin:24px 0 0;border-top:1px solid var(--line)}
.check-list li{display:flex;align-items:center;gap:13px;color:var(--forest);font-size:13px;padding:11px 0;border-bottom:1px solid var(--line)}
.check-list li span{display:grid;place-items:center;height:21px;width:21px;border-radius:50%;background:var(--mint);color:var(--green);flex:0 0 auto}
.board-section{background:var(--white);padding:115px 0 140px}
.board-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}
.board-card{border:1px solid var(--line);padding:16px}
.portrait{height:330px;background:#dfe7dc;position:relative;display:grid;place-items:center;overflow:hidden}
.portrait:after{content:"";height:215px;width:215px;border:1px solid rgba(23,58,45,.25);border-radius:50%;position:absolute}
.portrait span{position:relative;z-index:1;color:var(--forest);font-size:48px;font-weight:700;letter-spacing:-.1em}
.portrait-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(23,58,45,.1) 1px,transparent 1px),linear-gradient(90deg,rgba(23,58,45,.1) 1px,transparent 1px);background-size:28px 28px;opacity:.35;transform:rotate(18deg) scale(1.4)}
.board-index{display:block;margin-top:24px;color:var(--orange);font:10px var(--mono)}
.board-card h2{color:var(--forest);font-size:20px;letter-spacing:-.05em;margin:13px 0 7px;font-weight:700}
.board-card p{color:var(--green);font-size:11px;margin:0 0 12px}
.insights-videos{background:var(--white);padding:100px 0 80px}
.video-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.video-card{border:1px solid var(--line);background:var(--paper);overflow:hidden;transition:transform .25s,box-shadow .25s}
.video-card:hover{transform:translateY(-5px);box-shadow:0 14px 28px #173a2d1a}
.video-thumb{height:180px;background:var(--forest);position:relative;display:grid;place-items:center}
.play-btn{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:#ffffff26;border:1px solid rgba(255,255,255,.3);color:#fff;transition:background .2s,transform .2s}
.video-card:hover .play-btn{background:var(--green);transform:scale(1.1)}
.video-topic{position:absolute;top:12px;left:12px;font:9px var(--mono);color:#a8cb8c;letter-spacing:.12em;text-transform:uppercase}
.video-meta{padding:18px 16px 22px}
.video-meta strong{display:block;color:var(--forest);font-size:14px;line-height:1.35;letter-spacing:-.03em;margin-bottom:7px}
.video-meta span{color:var(--muted);font-size:11px}
.insights-articles{background:var(--paper);padding:80px 0 120px}
.article-list{border-top:1px solid var(--line)}
.article-row{display:grid;grid-template-columns:130px 1fr 90px 22px;align-items:center;gap:20px;padding:24px 0;border-bottom:1px solid var(--line);transition:padding .2s,background .2s}
.article-row:hover{padding:24px 14px;background:var(--white)}
.article-tag{color:var(--orange);font:9px var(--mono);text-transform:uppercase;letter-spacing:.1em}
.article-row strong{color:var(--forest);font-size:15px;letter-spacing:-.03em}
.article-date{color:var(--muted);font:10px var(--mono)}
.article-row svg{color:var(--green)}
.iaas-section{background:var(--forest);color:#fff;padding:90px 0}
.iaas-grid{display:grid;grid-template-columns:minmax(0,38fr) minmax(0,62fr);gap:70px;align-items:center}
.iaas-section h2{color:#fff;font-size:clamp(28px,3vw,42px);line-height:1.08;letter-spacing:-.06em;margin:0;font-weight:700}
.iaas-body p{color:#bfcec2;font-size:14px;line-height:1.85;margin:0 0 28px}
.iaas-pills{display:flex;flex-wrap:wrap;gap:10px}
.iaas-pills span{padding:8px 16px;border:1px solid rgba(168,203,140,.3);color:#a8cb8c;font:11px var(--mono);border-radius:99px}

/* Forms */
.demo-overlay{position:fixed;inset:0;background:#17201d99;backdrop-filter:blur(4px);z-index:1000;display:grid;place-items:center;padding:20px;overflow-y:auto}
.demo-modal{background:var(--white);max-width:480px;width:100%;padding:40px;position:relative;box-shadow:0 24px 60px #173a2d33}
.demo-close{position:absolute;top:16px;right:16px;color:var(--muted);padding:4px}
.demo-close:hover{color:var(--forest)}
.demo-header h2{color:var(--forest);font-size:28px;line-height:1.1;letter-spacing:-.05em;margin:0;font-weight:700}
.form{display:grid;gap:22px}
.demo-modal .form{margin-top:28px;gap:20px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.form label{display:grid;gap:9px;color:var(--forest);font-size:11px;font-weight:700}
.form input,.form textarea,.form select{width:100%;border:0;border-bottom:1px solid #cbd3cb;background:transparent;color:var(--ink);padding:10px 0;outline:none;border-radius:0;resize:vertical;font-weight:500;font-size:14px}
.form input:focus,.form textarea:focus,.form select:focus{border-color:var(--green)}
.form .button{justify-self:start;margin-top:8px}
.demo-modal .form .button{justify-self:stretch}
.form small{color:#89948b;font-size:10px;line-height:1.5}
.contact-section{background:var(--white);padding:120px 0}
.contact-grid{display:grid;grid-template-columns:minmax(0,38fr) minmax(0,62fr);gap:95px}
.contact-grid>*{min-width:0}
.contact-aside h2{color:var(--forest);font-size:42px;line-height:1.06;letter-spacing:-.065em;margin:0 0 24px;font-weight:700}
.contact-aside>p{color:var(--muted);line-height:1.8;font-size:13px}
.contact-mail{display:grid;gap:8px;margin-top:36px;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.contact-mail small{color:var(--orange);font:10px var(--mono);text-transform:uppercase;letter-spacing:.11em}
.mail-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mail-line a{color:var(--forest);font-size:20px;font-weight:700;letter-spacing:-.03em;user-select:all}
.copy-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);padding:6px 10px;color:var(--forest);font:10px var(--mono);background:var(--white)}
.copy-btn:hover{background:var(--mint)}
.contact-note{display:flex;gap:11px;color:#718074;font-size:11px;line-height:1.5;margin-top:36px}
.contact-note svg{flex:0 0 auto;color:var(--green)}
.sent{display:grid;gap:16px;padding:26px;background:var(--mint)}
.sent h3{color:var(--forest);font-size:20px;letter-spacing:-.04em;font-weight:700;display:flex;gap:10px;align-items:center}
.sent h3 svg{color:var(--green)}
.sent p{color:#4c5851;font-size:13px;line-height:1.7}
.sent pre{margin:0;white-space:pre-wrap;word-break:break-word;background:var(--white);border:1px solid #c9dcc4;padding:14px;font:12px/1.6 var(--mono);color:var(--ink);max-height:220px;overflow:auto}
.sent .actions{display:flex;gap:12px;flex-wrap:wrap}

/* Footer */
.site-footer{background:#122c23;color:#c6d2c8;padding:75px 0 25px}
.footer-top{display:grid;grid-template-columns:1fr 1fr;gap:80px;padding-bottom:75px}
.footer-top>div>p{max-width:315px;color:#92a499;font-size:11px;line-height:1.8;margin-top:27px}
.footer-columns{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.footer-columns>div{display:flex;flex-direction:column;gap:13px;min-width:0}
.footer-columns strong{color:#96c57a;font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.footer-columns a,.footer-columns span{color:#aebcb1;font-size:11px}
.footer-columns a:hover{color:#fff}
.footer-bottom{display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(201,218,204,.16);padding-top:23px;color:#84978b;font:10px var(--mono)}
.socials{display:flex;gap:14px}
.socials a{display:grid;place-items:center;color:#aebcb1}
.socials a:hover{color:#fff}

.hero-badge svg{color:var(--green);flex:0 0 auto}

/* ---- Astrolabe (hero background) ---- */
.astro-wrap{position:absolute;left:50%;top:50%;width:780px;height:853px;transform:translate(-50%,-52%);pointer-events:none;color:var(--forest);opacity:.075;z-index:0}
.astro-wrap svg{width:100%;height:100%;display:block}
.hero-art>*:not(.astro-wrap){z-index:1}
.hero-art>.data-visual{position:relative}
.astro .rete,.astro .rule{transform-box:view-box;transform-origin:500px 500px}

@keyframes astroSpin{to{transform:rotate(360deg)}}

/* ---------- People: board photos, advisory board, team ---------- */
.portrait.has-photo{background:#dfe7dc}
.portrait.has-photo:after{display:none}
.portrait.has-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block}

@media (max-width:820px){.mega-cards,.mega-cards.three{grid-template-columns:1fr;gap:0}.dropdown.mega a.mega-card{border:0;background:none;padding:8px 0}.mc-d,.mc-i{display:none}.mc-n{display:none}.mc-t{font-size:12px;font-weight:600}}
/* ---------- About: films ---------- */
.films-section{padding:104px 0 112px}
.films-section .section-heading h2{color:#fff}
.films-section .section-heading p{color:rgba(233,239,230,.75)}
.films-section .eyebrow{color:#b0d28d}.films-section .eyebrow span{background:#b0d28d}
.films-head{margin-bottom:48px}
.films-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
.film{margin:0}
.film-frame{padding:10px;border:1px solid rgba(216,199,156,.3);background:rgba(10,18,15,.55)}
.film-frame video{display:block;width:100%;aspect-ratio:16/9;background:#0b1310}
.film figcaption{display:flex;align-items:center;gap:14px;margin-top:16px;color:#e9efe6}
.film-lang{border:1px solid rgba(176,210,141,.5);color:#b0d28d;font:10px var(--mono);letter-spacing:.1em;padding:5px 8px}
.film figcaption strong{font-size:16px;font-weight:600;letter-spacing:-.02em}
.film-dur{margin-left:auto;color:rgba(233,239,230,.55);font:10px var(--mono);letter-spacing:.11em;text-transform:uppercase}
@media (max-width:820px){.films-section{padding:56px 0 64px}.films-grid{grid-template-columns:1fr;gap:32px}}
/* ---------- Team card smaller than board ---------- */
.team-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.team-grid .people-card .flip-inner{height:390px}
.team-grid .people-card .flip-front img{object-position:center 30%}
.team-grid .people-card .flip-back{padding:20px 18px 16px}
.team-grid .people-card .flip-back p{font-size:11.5px;line-height:1.5}
.team-grid .people-card .flip-mark{padding-bottom:10px;margin-bottom:10px}
@media (max-width:1080px){.team-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:820px){.team-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.team-grid .people-card .flip-inner{height:420px}}
@media (max-width:480px){.team-grid{grid-template-columns:1fr}.team-grid .people-card .flip-inner{height:460px}}

/* ---------- YouTube facade ---------- */
.yt{position:relative;aspect-ratio:16/9;background:#0b1310;overflow:hidden}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.yt-play{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;background:none;cursor:pointer;display:block}
.yt-play img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease,filter .3s}
.yt-play:hover img{transform:scale(1.02);filter:brightness(1.08)}
.yt-btn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:rgba(12,21,18,.72);border:1px solid rgba(176,210,141,.7);color:#b0d28d;box-shadow:0 0 28px rgba(127,174,84,.35);backdrop-filter:blur(3px);transition:background .2s,transform .2s}
.yt-play:hover .yt-btn{background:#b0d28d;color:#173a2d;transform:translate(-50%,-50%) scale(1.06)}
.yt-btn svg{margin-left:4px}
.yt-play:focus-visible{outline:2px solid #b0d28d;outline-offset:3px}
.film-frame .yt-btn{left:74%}

/* ---------- v9: flow link, why grid, hero GRI badge, eco pills ---------- */
.flow-more{text-align:center;margin-top:30px}
.why-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.why-grid .expertise-item:nth-child(n+4){border-top:1px solid var(--line)}
a.hero-badge{text-decoration:none;gap:12px;padding:7px 14px 7px 8px}
.hero-badge img{width:30px;height:30px;display:block;flex:0 0 auto}
a.hero-badge:hover{border-color:#b0d28d}
.eco-pills{display:flex;flex-wrap:wrap;gap:10px;margin:-18px 0 34px}
.eco-pills span{padding:8px 16px;border:1px solid var(--line);color:var(--forest);font:11px var(--mono);border-radius:99px;background:var(--white)}
/* start sections */
.start-section{background:var(--paper);padding:88px 0}
.start-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;margin-top:34px}
.start-needs{max-width:720px}
.start-needs strong{display:block;color:var(--forest);font-size:15px;margin-bottom:14px}
.start-needs ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 28px}
.start-needs li{display:flex;gap:9px;align-items:flex-start;color:#2c3a33;font-size:13.5px;line-height:1.5}
.start-needs li svg{color:var(--green);flex:0 0 auto;margin-top:2px}
.start-needs p{margin:16px 0 0;color:var(--muted);font-size:13px}
/* methodology */
.meth-section{background:var(--white);padding:96px 0}
.meth-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--forest)}
.meth-steps li{padding:28px 22px 30px;border-left:1px solid var(--line)}
.meth-steps li:first-child{border-left:0;padding-left:0}
.meth-steps span{display:block;color:var(--orange);font:10px var(--mono);margin-bottom:22px}
.meth-steps h3{color:var(--forest);font-size:18px;letter-spacing:-.04em;margin:0 0 10px;font-weight:700}
.meth-steps p{color:var(--muted);font-size:13px;line-height:1.65;margin:0}
.levels-section{background:var(--paper);padding:96px 0}
.levels-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.level-item{background:var(--white);border:1px solid var(--line);padding:26px 24px 28px}
.level-bar{height:4px;background:var(--mint);margin-bottom:22px}
.level-bar i{display:block;height:100%;background:var(--green)}
.level-item span{color:var(--orange);font:10px var(--mono)}
.level-item h3{color:var(--forest);font-size:20px;letter-spacing:-.05em;margin:10px 0 8px;font-weight:700}
.level-item p{color:var(--muted);font-size:13px;line-height:1.6;margin:0}
.scope-section{background:var(--white);padding:96px 0}
.scope-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:1000px;margin:0 auto}
.scope-col{border:1px solid var(--line);padding:30px 32px}
.scope-col strong{display:block;font:11px var(--mono);text-transform:uppercase;letter-spacing:.11em;margin-bottom:18px}
.scope-col.is strong{color:var(--green)}.scope-col.isnt strong{color:var(--orange)}
.scope-col ul{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.scope-col li{display:flex;gap:10px;color:#2c3a33;font-size:14px;line-height:1.55}
.scope-col.is svg{color:var(--green);flex:0 0 auto;margin-top:3px}.scope-col.isnt svg{color:var(--orange);flex:0 0 auto;margin-top:3px}
.gri-section{padding:100px 0;color:#fff}
.gri-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:60px;align-items:center}
.gri-section h2{color:#fff;font-size:clamp(26px,2.8vw,40px);line-height:1.1;letter-spacing:-.05em;margin:0 0 18px;font-weight:700}
.gri-section p{color:rgba(233,239,230,.8);font-size:15px;line-height:1.7;margin:0 0 24px}
.gri-section .eyebrow{color:#b0d28d}.gri-section .eyebrow span{background:#b0d28d}
.gri-link{display:inline-flex;align-items:center;gap:8px;margin-top:22px;color:#b0d28d;font:11px var(--mono);letter-spacing:.08em;text-decoration:none}
.gri-marks{display:flex;gap:24px;justify-content:flex-end;flex-wrap:wrap}
.gri-marks figure{margin:0;text-align:center}
.gri-marks img{width:180px;height:180px;display:block}
.gri-marks figcaption{margin-top:10px;color:rgba(233,239,230,.6);font:10px var(--mono);letter-spacing:.06em}
/* security */
.sec-section{background:var(--white);padding:96px 0}
.sec-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-bottom:28px}
.sec-item{border:1px solid var(--line);padding:26px 26px 30px;background:var(--white)}
.sec-item span{display:block;color:var(--orange);font:10px var(--mono);margin:18px 0 8px}
.sec-item h3{color:var(--forest);font-size:19px;letter-spacing:-.045em;margin:0 0 8px;font-weight:700}
.sec-item p{color:var(--muted);font-size:13.5px;line-height:1.65;margin:0}
.sec-ask{margin:22px 0 0;color:var(--muted);font-size:14px}
.sec-ask a{color:var(--forest);font-weight:700}
@media (max-width:1080px){.meth-steps{grid-template-columns:repeat(3,minmax(0,1fr))}.meth-steps li:nth-child(4){border-left:0;padding-left:0}.meth-steps li:nth-child(n+4){border-top:1px solid var(--line)}.levels-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){.why-grid{grid-template-columns:1fr}.why-grid .expertise-item{border-top:1px solid var(--line)}.start-section,.meth-section,.levels-section,.scope-section,.sec-section{padding:56px 0}.gri-section{padding:64px 0}.start-foot{flex-direction:column;align-items:flex-start}.start-needs ul{grid-template-columns:1fr}.meth-steps{grid-template-columns:1fr}.meth-steps li{border-left:0!important;padding-left:0!important;border-top:1px solid var(--line)}.scope-grid,.gri-grid,.sec-grid{grid-template-columns:1fr}.gri-marks{justify-content:flex-start}.gri-marks img{width:130px;height:130px}.levels-grid{grid-template-columns:1fr}}
</style>

</head>

  pEb:'Sorun',pH:'Yeşil finansman KOBİ’ye neden ulaşamıyor?',pP:['Uluslararası finans kuruluşlarının (IFI) sağladığı kaynaklar, Türkiye’de bankaların kurumsal kredi portföyünde önemli bir yer tutuyor. Ancak bu kaynaklardan sağlanan yeşil ve sosyal krediler proje bazlıdır; finansman belirli bir yeşil dönüşüm projesine bağlanır.','KOBİ’nin asıl ihtiyacı ise işletme sermayesidir. Sürdürülebilirlik bağlantılı krediler proje şartı taşımaz; fakat olgunluk ölçümü ve KPI takibi bugüne kadar pahalı ve uzun süreçler olduğu için bu krediler çoğunlukla büyük şirketlere gidiyor.'],
  sEb:'Çözüm',sH:'Sürdürülebilirlik bağlantılı krediyi KOBİ ölçeğine taşıyoruz.',sP:['İmplika, KOBİ’nin sürdürülebilirlik olgunluğunu erişilebilir bir maliyetle ölçer ve bir olgunluk skoruna dönüştürür. Bu skor, KOBİ’nin kredi değerlendirmesine alınması için ilk kapıdır.','Kredi süresince KPI’lar platformda izlenir, uzman ağıyla doğrulanır ve bankanın raporlamasına hazır hâle gelir. KOBİ KPI’larını tutturdukça skoru yükselir; program koşullarına bağlı olarak vade ve fiyat avantajları bu gelişime bağlanabilir.'],
  flowEb:'Program nasıl işler?',flowH:'Beş adımda sürdürülebilirlik bağlantılı finansman.',
  steps:[['Program çerçevesi','IFI ve katılımcı bankalar kaynağı, KPI setini ve koşulları belirler'],['Ölçüm ve skor','KOBİ, İmplika’da olgunluk ölçümünü tamamlar'],['Kredi değerlendirmesi','Skor bankayla paylaşılır; kredi kararını banka verir'],['İzleme ve doğrulama','KPI’lar izlenir, uzman ağıyla doğrulanır ve raporlanır'],['Gelişim ve avantaj','Skor yükseldikçe program koşullarına göre avantaj sağlanabilir']],
  rolesEb:'Kim ne yapar?',rolesH:'Her tarafın rolü net.',
  roles:[['Uluslararası finans kuruluşu','Program çerçevesini, kaynak havuzunu ve KPI setini belirler.'],['Katılımcı banka','Kredi kararını verir; fiyatlama, kullandırım ve risk değerlendirmesini yürütür.'],['Ekosistem sahibi','Programı tedarikçi ve satıcı ağına duyurur, davet eder ve sahiplenir.'],['İmplika','Olgunluk ölçümü, skor, KPI izleme, doğrulama altyapısı ve raporlamayı sağlar.']],
  note:'İmplika kredi vermez, kredi kararına karışmaz ve risk taşımaz. Ekosistem sahibi de kredi kanalı değildir; rolü KOBİ’lere erişimi kolaylaştırmaktır.',
  stdEb:'Uluslararası çerçevelerle uyumlu',stdH:'Standartlara dayalı ölçüm ve izleme.',stdP:'Olgunluk ölçümü uluslararası sürdürülebilirlik çerçevelerine, KPI seti ise sürdürülebilirlik bağlantılı kredilere yönelik uluslararası ilkelere dayanır. Hangi KPI’ların uygulanacağına program çerçevesinde karar verilir.',stdPills:['LMA / APLMA / LSTA SLL İlkeleri','KOBİ’lere özel kriter seti','30 KPI’lık standart set']},
 companies:{title:'KOBİ’ler ve Şirketler',eb:'KOBİ’ler ve şirketler için',h1:'Olgunluğunuzu ölçün, finansmana ve pazarlara hazırlanın.',p:'KOBİ’ler, ihracatçılar, tedarikçiler ve kurumsal şirketler için olgunluk ölçümü, gelişim yol haritası ve KPI takibi.',h2:'Sürdürülebilirliği bir yük değil, avantaj hâline getirin.',lead:'İmplika, şirketinizin bugün nerede durduğunu ölçer, neyi geliştirmeniz gerektiğini gösterir ve bu gelişimi finansmana ve ticari fırsatlara bağlar.',list:['Sürdürülebilirlik olgunluk skorunuzu öğrenin','Önerilen aksiyonlar ve eğitimlerle gelişin','KPI’larınızı tek platformda izleyin','Sürdürülebilirlik bağlantılı finansmana hazırlanın','AB ihracat kriterlerine ve SKDM’ye hazırlanın','Kurumsal raporlama (TSRS) girdilerinizi yönetin'],btn:'Nasıl çalıştığını görün'},
 institutions:{title:'Bankalar ve IFI’lar',eb:'Bankalar ve uluslararası finans kuruluşları için',h1:'Sürdürülebilirlik bağlantılı krediyi KOBİ ölçeğinde ölçülebilir kılın.',p:'Bankalar ve uluslararası finans kuruluşları için olgunluk skoru, KPI izleme, doğrulama ve raporlama altyapısı.',h2:'Güvenilir veriyle daha geniş bir KOBİ kitlesine ulaşın.',lead:'İmplika, KOBİ’nin sürdürülebilirlik olgunluğunu kredi sürecinin başında görünür kılar ve kredi süresince KPI’ları izlenebilir ve raporlanabilir hâle getirir.',list:['Olgunluk skoruyla ön değerlendirme','Kredi süresince KPI izleme ve raporlama','Uzman ağıyla ölçüm ve doğrulama','KOBİ eğitimi ve gelişim platformu','Firma düzeyinde etki ölçümü','API ile bankacılık sistemlerine entegrasyon'],note:'Kredi kararı, fiyatlama ve risk değerlendirmesi tamamen bankanındır. İmplika skoru, KOBİ’nin değerlendirmeye alınması için bir ön kapıdır.',btn:'Nasıl çalıştığını görün'},
 ecosystem:{title:'Ekosistem Sahipleri',eb:'Ekosistem sahipleri için',h1:'Tedarikçi ve satıcı ağınızın olgunluğunu yükseltin.',p:'Tedarikçi ve satıcı ağı olan büyük şirketler, pazaryerleri ve sektör birlikleri için sürdürülebilirlik ve finansmana erişim programı.',h2:'Ağınız güçlendikçe siz de güçlenirsiniz.',lead:'Ekosistem sahibi programı ağına duyurur ve sahiplenir; İmplika ölçümü, gelişimi ve izlemeyi üstlenir. Ağınız hem sürdürülebilirlik olgunluğu hem de finansal dayanıklılık kazanır.',list:['Programı tedarikçi ve satıcı ağınıza duyurun','Ağınızın olgunluk gelişimini izleyin','Kapsam 3 verisine tek yerden ulaşın','Ağınızın uygun finansmana erişimini kolaylaştırın','Ağınızı AB mevzuatına ve ihracat kriterlerine hazırlayın'],note:'Ekosistem sahibi kredi kanalı ya da risk taşıyan taraf değildir. Rolü, programı duyurmak ve ağına erişimi kolaylaştırmaktır.',btn:'Nasıl çalıştığını görün'},
 about:{title:'Hakkımızda',eb:'İmplika hakkında',filmEb:'Tanıtım filmi',filmH:'İmplika’yı <em>90 saniyede</em> tanıyın.',filmP:'Yeşil dönüşümü ölçülebilir ve finanse edilebilir kılan platformumuzu kısa filmimizle keşfedin.',filmTR:'Türkçe',filmEN:'English',filmDur:'90 sn',h1:'Veri, uzmanlık ve finans arasında köprü kuruyoruz.',p:'İmplika, KOBİ’lerin ve şirketlerin sürdürülebilirlik olgunluğunu ölçen, geliştiren ve finansmana bağlayan bir sürdürülebilirlik teknolojisi platformudur.',
  s1eb:'İmplika kimdir?',s1h:'Sistem Global ve BTS’nin girişimiyle kurulduk.',s1p:['İmplika A.Ş., Sistem Global ve BTS’nin girişimiyle kuruldu. BTS’nin sürdürülebilirlik ve ESG’nin hukuk ve regülasyon tarafındaki birikimiyle, NTT DATA ile birlikte platformumuzu geliştirdik. İmplika, GRI Licensed Software &amp; Tools Partner’dır.','Platform; şirketlerin sürdürülebilirlik olgunluğunu ölçmesini, geliştirmesini ve KPI’larını izlemesini sağlarken, bankaların ve uluslararası finans kuruluşlarının bu veriyi kredi süreçlerinde kullanmasına olanak tanır.'],
  s2eb:'Çıkış noktamız',s2h:'Sürdürülebilirlik neden yalnızca büyük şirketlerin konusu olsun?',s2p:['Sürdürülebilirlik ölçümü ve raporlaması bugüne kadar pahalı ve uzun süreçler gerektirdi. Bu yüzden sürdürülebilirlik bağlantılı finansman da çoğunlukla büyük şirketlere ulaştı.','Amacımız, KOBİ’lerin de sürdürülebilirlik olgunluklarını kolay ve erişilebilir şekilde ölçebilmesini, geliştirebilmesini ve bu gelişimi finansmana ve yeni pazarlara dönüştürebilmesini sağlamak.'],
  exEb:'Uzmanlık ekosistemimiz',exH:'Dört bakış açısı.<br>Tek platform.',ex:[['Teknoloji','Dijital platform, veri altyapısı, yazılım ve entegrasyon.'],['Sürdürülebilirlik ve ESG','Olgunluk ölçümü, KPI setleri ve raporlama.'],['Saha ve Doğrulama','Mali müşavir, hukukçu ve yeşil uzmanlardan oluşan ölçüm ve doğrulama ağı.'],['Regülasyon ve Finans','Uluslararası standartlar, kredi çerçevelerine uyum ve sürdürülebilir finansman.']],
  ecoEb:'Kurucular ve ortaklar',ecoH:'Farklı uzmanlıklar,<br>aynı hedef.',ecoP:'İmplika; teknolojiyi, sahadaki erişim gücünü, hukuk ve regülasyon birikimini ve finansal karar alma süreçlerini aynı yapıda buluşturur.',
  eco:[['Teknoloji ve Platform','Sürdürülebilirlik platformu ve veri altyapısı; GRI Licensed Software &amp; Tools Partner.'],['Kurucu Ortak · Saha ve Doğrulama','Mali müşavir ağıyla KOBİ’lere erişim, saha ölçümü ve doğrulama.'],['Kurucu Ortak · Hukuk ve Regülasyon','Sürdürülebilirliğin hukuk ve regülasyon tarafı; standartlara ve kredi çerçevelerine uyum mimarisi.'],['Teknoloji Ortağı','Platform geliştirme, teknik altyapı ve entegrasyon.']],
  closeEb:'Vizyonumuz',closeH:'Sürdürülebilirlik olgunluğundan finansal değere.',closeP:'İmplika; şirketleri, bankaları ve uluslararası finans kuruluşlarını aynı güvenilir veri üzerinde buluşturan teknoloji altyapısı olarak konumlanır.'},

 vm:{eb:'Vizyon &amp; Misyon',h:'Sürdürülebilirlik olgunluğundan finansal değere.',vT:'Vizyonumuz',v:'Sürdürülebilirlik verisinin, her ölçekteki şirket için finansmana ve yeni pazarlara erişimin ortak dili olduğu bir ekonomi.',mT:'Misyonumuz',m:'KOBİ’lerin ve şirketlerin sürdürülebilirlik olgunluğunu güvenilir, doğrulanabilir ve erişilebilir biçimde ölçmek; bu veriyi bankalar ve uluslararası finans kuruluşları için karar alınabilir hale getirerek yeşil dönüşümü finanse edilebilir kılmak.'},
 values:{eb:'Değerlerimiz',h:'Bizi yönlendiren ilkeler.',items:[['Güvenilir veri','Ölçtüğümüz her veri izlenebilir, doğrulanabilir ve uluslararası standartlarla uyumludur.'],['Erişilebilirlik','Sürdürülebilirliği büyük şirketlerin ayrıcalığı olmaktan çıkarıp her ölçekteki işletme için ulaşılabilir kılarız.'],['Şeffaflık','Metodolojimizi, skorlarımızı ve süreçlerimizi paydaşlarımızla açıkça paylaşırız.'],['Ölçülebilir etki','Başarıyı raporla değil; finansmana erişim, gelişen KPI’lar ve gerçek dönüşümle ölçeriz.']]},
 gov:{title:'Kurumsal Yönetişim',eb:'Kurumsal yönetişim',h1:'Güçlü yönetişim, uzun vadeli değer.',p:'İmplika’nın stratejik yönünü belirleyen Yönetim Kurulu, danışma sürecine katkı sunan Danışma Kurulu ve platformu hayata geçiren ekibimiz.'},
 meth:{title:'Metodoloji',eb:'Metodoloji',h1:'Skor nasıl hesaplanır?',p:'İmplika skoru; çevre, sosyal ve yönetişim başlıklarını kapsayan bir soru seti, kanıta dayalı yanıtlar, uzman doğrulaması ve 30 KPI’lık standart setle sürekli izlemeden oluşur. Şirketin ve bankanın aynı skora güvenebilmesi için her adım izlenebilirdir.',
  stepsEb:'Beş adımda skor',stepsH:'Sorudan doğrulanmış veriye.',
  steps:[['Soru seti','Çevre, sosyal ve yönetişim başlıklarını kapsayan, şirketin ölçeğine ve sektörüne göre uyarlanan soru seti: kurumsal şirketler için GRI Standartlarına dayanan genişletilmiş set, KOBİ’ler için sadeleştirilmiş Lite set.'],['Yanıt ve kanıt','Evet/hayır, çoktan seçmeli, sayısal ve belge yüklemeli yanıt tipleri. Belgeyle desteklenen yanıtlar skora daha yüksek güvenle yansır.'],['Puanlama','Her soru önem derecesine göre ağırlıklandırılır; başlık skorları ve genel olgunluk skoru hesaplanır, şirket bir olgunluk seviyesine yerleştirilir.'],['Doğrulama','Kanıtlar ve kritik yanıtlar uzman doğrulama ağı tarafından incelenir; onaylanan veri platformda doğrulanmış olarak işaretlenir.'],['İzleme ve raporlama','İlerleme 30 KPI’lık standart setle dönemsel olarak izlenir; skor güncellenir, raporlar banka ve paydaşlarla paylaşılmaya hazır hâle gelir.']],
  lvlEb:'Olgunluk seviyeleri',lvlH:'Skor, şirketin nerede durduğunu ve neyi geliştirmesi gerektiğini gösterir.',
  levels:[['Başlangıç','Sürdürülebilirlik yönetimi yeni başlıyor; temel veriler ve politikalar oluşturulmalı.'],['Gelişen','Temel uygulamalar var; veri toplama ve hedef belirleme sistematik hâle getirilmeli.'],['İleri','Yönetim sistemi ve KPI takibi oturmuş; performans düzenli ölçülüyor ve raporlanıyor.'],['Lider','Sürdürülebilirlik iş stratejisine entegre; doğrulanmış veri finansman ve pazar avantajına dönüşüyor.']],
  isEb:'Skorun kapsamı',isH:'Skor neyi gösterir, neyi göstermez?',isT:'Gösterir',isntT:'Göstermez',
  is:['Şirketin sürdürülebilirlik olgunluğunu ve verisinin güvenilirliğini','Gelişim alanlarını ve önceliklendirilmiş aksiyonları','Zaman içindeki ilerlemeyi ve KPI performansını'],
  isnt:['Bir kredi notu ya da kredi kararı değildir; kredi kararı tamamen bankanındır','Bir güvence denetimi ya da sertifika değildir','Şirketin finansal durumunu değerlendirmez'],
  stdEb:'Dayandığımız çerçeveler',stdH:'Uluslararası standartlara dayalı ölçüm.',stdPills:['GRI Standartları','LMA / APLMA / LSTA SLL İlkeleri','TSRS ile uyumlu veri yapısı','30 KPI’lık standart set'],
  griEb:'GRI lisansı',griH:'GRI Licensed Software &amp; Tools Partner · 2026',griP:'İmplika, GRI’ın 2026 dönemi lisanslı yazılım ve araç ortakları arasında yer alır. Platformda kullanılan GRI Standartları içerikleri GRI’ın izniyle kullanılmaktadır. GRI’ın doğrulaması yalnızca GRI Standartları içeriğinin doğru kullanımıyla sınırlıdır; GRI, platformun ya da platformla üretilen çıktıların doğruluğu, uygunluğu veya kalitesi hakkında herhangi bir beyanda bulunmaz ve bu çıktıları onaylamaz.',griCap1:'Software and Tools Partner 2026',griCap2:'Content Used with Permission 2026'},
 sec:{title:'Veri Güvenliği',eb:'Veri güvenliği ve gizlilik',h1:'Veriniz sizindir.',p:'İmplika’ya yüklediğiniz veri, onayınız olmadan kimseyle paylaşılmaz, yalnızca yetkili kişilerce görülür ve 6698 sayılı Kişisel Verilerin Korunması Kanunu’na (KVKK) uygun işlenir.',
  hEb:'İlkelerimiz',h:'Güvenliğin altı ilkesi.',
  items:[['Veri sahipliği','Platforma girdiğiniz tüm veri ve belgeler şirketinize aittir; dilediğiniz zaman dışa aktarabilir ya da silinmesini talep edebilirsiniz.','database'],['Onaya dayalı paylaşım','Skorunuz ve raporlarınız bir bankayla ya da ekosistem sahibiyle yalnızca açık onayınızla paylaşılır; neyin kiminle paylaşıldığını görürsünüz.','check'],['KVKK uyumu','Kişisel veriler KVKK’ya uygun olarak, belirli ve meşru amaçlarla sınırlı şekilde işlenir; aydınlatma ve rıza süreçleri platforma entegredir.','shield-check'],['Rol bazlı erişim','Şirket kullanıcıları, doğrulama uzmanları ve finans kuruluşları yalnızca rollerinin gerektirdiği veriyi görür.','network'],['Şifreleme','Veri, aktarım sırasında ve saklanırken şifrelenir.','target'],['İz kaydı','Kim, neyi, ne zaman girdi, değiştirdi ya da onayladı; tüm işlemler kayıt altındadır.','chart-column']],
  note:'Doğrulama uzmanları yalnızca kendilerine atanan şirketin kanıtlarına, gizlilik taahhüdüyle erişir. Veri koruma süreçlerimiz BTS &amp; Partners’ın veri koruma ve uyum uzmanlığıyla tasarlanır.',ask:'Veri güvenliğiyle ilgili sorularınız için'},
 start:{
  companies:{eb:'Nasıl başlarım?',h:'Dört adımda ilk skorunuz.',steps:[['Başvurun','Formu doldurun; ekibimiz sizinle iletişime geçsin.'],['Hesabınızı açın','Kısa bir tanışma görüşmesinin ardından hesabınız açılır ve size uygun soru seti tanımlanır.'],['Yanıtlayın, belge yükleyin','Soruları çevrim içi yanıtlayın, belgelerinizi yükleyin; uzmanlarımız süreç boyunca yanınızda.'],['Skorunuzu alın','Olgunluk skorunuz, gelişim önerileriniz ve bankayla paylaşılabilir raporunuz hazır.']],needT:'Hazırlamanız gerekenler',needs:['Temel şirket bilgileri ve faaliyet alanı','Enerji, su ve atık kayıtları (fatura ya da sayaç verileri)','Çalışan, iş sağlığı ve güvenliği ve eğitim kayıtları','Varsa politika ve prosedür belgeleri'],note:'Uygun durumlarda kamu destek programlarından yararlanmanız için yönlendirme sağlıyoruz.',btn:'Ölçüme başlayın'},
  institutions:{eb:'Nasıl başlarız?',h:'Portföyünüz için bir pilotla başlayın.',steps:[['Tanışma','Hedef KOBİ segmentinizi ve mevcut kredi süreçlerinizi birlikte değerlendiririz.'],['Program tasarımı','KPI setini, skor eşiklerini ve raporlama formatını birlikte belirleriz.'],['Pilot','Seçilen KOBİ grubuyla ölçüm, skor ve izleme süreci işletilir.'],['Ölçekleme','Sonuçlara göre program portföye yayılır; API ile sistemlerinize bağlanır.']],btn:'Pilot görüşmesi talep edin'},
  ecosystem:{eb:'Nasıl başlarız?',h:'Ağınız için programı birlikte kuralım.',steps:[['Tanışma','Tedarikçi ve satıcı ağınızı, önceliklerinizi ve hedeflerinizi konuşuruz.'],['Program tasarımı','Kapsamı, soru setini ve ağınıza sunulacak avantajları belirleriz.'],['Duyuru ve katılım','Programı ağınıza duyurursunuz; ölçüm ve destek süreci İmplika’dadır.'],['İzleme','Ağınızın olgunluk gelişimini ve Kapsam 3 verisini tek panelden izlersiniz.']],btn:'Program görüşmesi talep edin'}},
 advisory:{eb:'Danışma Kurulu',h:'Danışma Kurulu',p:'İmplika’nın danışma sürecine katkı sunan kişiler ve iş ortakları. Finans, regülasyon ve sürdürülebilirlik alanlarındaki deneyimleriyle stratejik önceliklere ve ürün yol haritasına yön verirler.',member:'Danışma Kurulu Üyesi',partner:'Stratejik Ortak'},
 team:{members:{gozde:{role:'Takım Lideri · GRI Sertifikalı',bio:'Gözde, İmplika ekibine liderlik eden GRI sertifikalı bir sürdürülebilirlik uzmanıdır. 20 yılı aşkın deneyime sahip bir hukukçu olarak 15 yıl Alshaya Group’ta şirket içi hukuk müşaviri olarak çalıştı; Türkiye, Azerbaycan ve Gürcistan’da Hukuk biriminin yanı sıra Etik ve Uyum, Veri Gizliliği ve Disiplin kurullarına başkanlık etti, üst yönetim ekibinde yer aldı. BTS &amp; Partners’ta sürdürülebilirlik, uyum ve ticaret hukuku alanlarında Ortak’tır. İstanbul Üniversitesi Hukuk Fakültesi mezunudur, İstanbul Bilgi Üniversitesi’nde Ticaret Hukuku yüksek lisansı yapmıştır.'},ada:{role:'Sürdürülebilirlik ve Uyum',bio:'Ada, ağırlıklı olarak sürdürülebilirlik ve uyum alanlarında, bunların yanı sıra özel hukukun farklı alanlarında çalışıyor. BTS &amp; Partners’a katılmadan önce çeşitli çok uluslu firmalarda deniz ticareti, iş ve sigorta hukuku konularında görev aldı. İmplika’da sürdürülebilirlik ve uyum çalışmalarına destek veriyor. Galatasaray Üniversitesi Hukuk Fakültesi mezunudur.'},kaan:{role:'Veri Koruma ve Uyum · GRI Sertifikalı',bio:'Kaan, GRI sertifikalı bir sürdürülebilirlik uzmanıdır. BTS &amp; Partners’ta Kıdemli Avukat olarak uyum, kişisel verilerin korunması ve gizlilik, bilişim ve telekomünikasyon ile medya alanlarında çalışıyor. Veri ve teknolojiyle büyüyen şirketlere, özellikle girişimlerin değişen regülasyona uyum sağlamasına danışmanlık veriyor; veriden yararlanarak hukuki hizmetlerin dijitalleştirilmesine ve müşteri deneyimi tasarımına yönelik ürün geliştirme projelerinde yer alıyor.'}},eb:'Ekip',h:'İmplika’yı hayata geçiren ekip.',hint:'Biyografi için fotoğrafın üzerine gelin ya da dokunun.',flip:'Biyografiyi göster',role:'Müdür',bio:'Mehmet, sürdürülebilirlik, iklim regülasyonu ve yeşil finansın kesişiminde 11 yılı aşkın deneyime sahiptir. PwC Türkiye, Corpera ve Sistem Global’de CSRD/ESRS ve TSRS uyumu, çifte önemlilik analizleri, TCFD/NGFS iklim riski senaryoları ve IFC/EBRD standartlarında çevresel ve sosyal (Ç&amp;S) değerlendirme çalışmalarına liderlik etti. İmplika’da şirketlerin ve finansal kuruluşların sürdürülebilirlik verisini finansmana erişimin kapısını açan, ölçülebilir ve doğrulanabilir bir varlığa dönüştürmesine yardımcı oluyor. Boğaziçi Üniversitesi ve İstanbul Bilgi Üniversitesi mezunudur; Springer yayınları bulunan bir yazar olup sürdürülebilirlik dersleri vermektedir.'},
 board:{title:'Yönetim Kurulu',eb:'Yönetim Kurulu',h:'Uzun vadeli gelişim için stratejik yön.',p:'İmplika’nın stratejik yönünü ve uzun vadeli gelişimini şekillendiren Yönetim Kurulu.',role:'Yönetim Kurulu Üyesi',chair:'Yönetim Kurulu Başkanı',bios:['İhsan Uğur Delikanlı, ODTÜ Kamu Yönetimi Bölümü’nden mezun olmuş; University of Exeter’de Finansal Yönetim alanında MBA, Gazi Üniversitesi’nde İktisat Teorisi alanında yüksek lisans ve kredi türevleri üzerine çalışmasıyla Başkent Üniversitesi’nde Muhasebe-Finansman alanında doktora yapmıştır; doçenttir. Kariyerine 1992’de TBMM’de başlamış, Hazine Müsteşarlığı ve BDDK’da 12 yıl Yeminli Banka Denetçisi olarak görev yapmıştır. BDDK Yönetim Kurulu Üyeliği ve Başkan Yardımcılığı yapmış, Aktif Yatırım Bankası ile Karadeniz Ticaret ve Kalkınma Bankası’nda başkanlık görevlerinde bulunmuştur. Fimple ve Mint Finansman A.Ş. yönetim kurullarında görev almakta; Vergi Konseyi, Türkiye Muhasebe Standartları Kurulu ve Basel Komitesi dahil pek çok kurulda üye olarak yer almıştır.', 'Yasin Beceni, BTS &amp; Partners’ın Kıdemli Ortağıdır. Yaklaşık yirmi yıldır bilgi ve iletişim teknolojileri hukuku, politika ve stratejileri, regülasyon hukuku ve dijital teknolojiler alanında büyük iş gruplarına, Fortune 500 teknoloji şirketlerine ve Türkiye ekonomisinin önde gelen kuruluşlarına danışmanlık vermektedir. 2001’den bu yana dijital ekonomi ve bilgi toplumu üzerine akademik çalışmalara katkı sunmakta; İstanbul Bilgi Üniversitesi’nde BT Hukuku yüksek lisans programında ve Sabancı Üniversitesi’nde Veri Analitiği yüksek lisans programında ders vermektedir. TÜBİSAD Baş Hukuk Danışmanıdır. Marmara Üniversitesi Hukuk Fakültesi mezunudur; İstanbul Bilgi Üniversitesi’nde Ekonomi Hukuku yüksek lisansı yapmıştır.', 'Zafer Yıldız, Sistem Global Danışmanlık’ta Yönetim Kurulu Üyesi ve Partner, Sistem Global Antalya’nın kurucu ortağıdır. Grubun sürdürülebilirlik şirketi Sgreen’in Yönetim Kurulu Başkanı olarak görev yapmaktadır. Sistem Global, 1996’dan bu yana vergi, finans, Ar-Ge, uyum ve dijital çözümler alanında KOBİ’lerden büyük ölçekli şirketlere uzanan geniş bir müşteri kitlesine hizmet veren bir profesyonel hizmetler grubudur.']},

 meta:{title:'Implika — Turn Sustainability Data into Value',desc:'Implika, a GRI Licensed Software & Tools Partner, is a technology platform that measures the sustainability maturity of SMEs and companies, monitors and validates their KPIs, and connects them to sustainability-linked finance.'},

 sol:{eb:'Modules',h2:'Modular infrastructure from measurement to finance.',p:'Each module works on its own. Together, they form a single flow from maturity assessment to access to finance.',link:'Explore module'},
 mods:{
  lite:{name:'Lite Module',card:'Measure your sustainability maturity and get your maturity score.',row:'Maturity assessment, maturity score and improvement guidance.',status:'Available',
   intro:'Maturity assessment, maturity score and an improvement roadmap for SMEs and companies.',h2:'Measure your<br>maturity.',
   lead:'The first step in any sustainability journey is knowing where you stand today. The Lite Module measures it quickly, clearly and in line with recognised standards.',
   caps:['SME-specific criteria set','Maturity score','Recommended actions','Training and expert content'],
   how:'The company answers the criteria on the platform. Implika assesses the answers and turns them into a maturity score, together with recommended actions, expert comments and training content. The score can also be used for pre-assessment in sustainability-linked finance programmes.'},
  mrv:{name:'KPI Monitoring & Validation',card:'Monitor your KPIs on one platform, validate them through our expert network and report on them.',row:'Extended KPI set, expert validation and bank reporting.',status:'Available',
   intro:'Infrastructure that monitors, validates and reports sustainability KPIs throughout a programme or loan (measurement, reporting and verification).',h2:'Monitor.<br>Validate.',
   lead:'A KPI can only support financial decisions once it is reliably measured and validated. Implika brings monitoring, validation and reporting into a single flow.',
   caps:['30-KPI set based on international standards','Continuous KPI monitoring','Measurement and validation by experts','Reporting to banks and IFIs'],
   how:'The KPI set is built on international standards, and the programme framework decides which KPIs apply. The company tracks its progress on the platform, while the bank uses the same data in its own reporting. Measurement and validation are supported by our network of accountants, lawyers and green finance experts.'},
  supply:{name:'Supply Chain',card:'Manage the sustainability maturity and Scope 3 data of your supplier and seller network.',row:'Supplier onboarding, maturity tracking and Scope 3 data.',status:'Available',
   intro:'Make sustainability maturity, data and risks visible across every link of your supply chain.',h2:'Make your network<br>visible.',
   lead:'A large company’s sustainability performance cannot be separated from that of its suppliers. Implika brings the supply chain into a single data infrastructure.',
   caps:['Supplier and seller onboarding','Maturity tracking','Scope 3 data','Automated sustainability audits'],
   how:'Suppliers and sellers are invited to the platform, complete their maturity assessment and track their progress. The ecosystem owner gets an overall view of the network’s maturity and Scope 3 data in one place.'},
  finance:{name:'Sustainable Finance',card:'Programme infrastructure that connects SMEs to sustainability-linked loans (SLLs).',row:'Maturity score, KPI monitoring and reporting for SLL programmes.',status:'Available'}
 },

 home:{
  eb:'Sustainability technology provider',h1:'GOGREEN BUSINESS <em>ENABLER</em> WITH TECH',artTop:'GREEN<br><strong>BUSINESS</strong>',
  p:'Implika is a sustainability technology platform. It measures the ESG and sustainability maturity of SMEs and companies, turns it into a maturity score, and monitors and validates their KPIs. Companies use it to manage their progress and prepare for sustainability-linked finance, while banks and financial institutions use the same trusted data in credit assessment and reporting.',
  b1:'Request a Demo',b2:'Explore Modules',aud:'Built for:',audList:[['SMEs & companies','companies'],['Banks & IFIs','institutions'],['Ecosystem owners','ecosystem']],
  badge:'GRI Licensed Software &amp; Tools Partner',core:'MATURITY<br>SCORE',flowLabel:'MEASURE <span>→</span> VALIDATE <span>→</span> REPORT <span>→</span> CREATE VALUE',scroll:'Scroll to explore',
  iaasEb:'Technology and expertise',iaasH:'A platform and an expert validation network in one.',iaasP:'Implika delivers its technology through SaaS and APIs. Measurement and validation draw on our ecosystem’s expert network: Sistem Global’s accountants and green transition experts, and the legal and regulatory team of BTS &amp; Partners. Every validation is carried out by experts bound by principles of independence and confidentiality.',pills:['SaaS Platform','API Integration','Licensed GRI Content','Expert Validation Network'],
  flowEb:'How it works',flowH:'Turn sustainability data into value.',flowLink:'How is the score calculated?',flowP:'Implika is not a one-off assessment tool. It is a living platform that companies use throughout their sustainability journey.',
  steps:[['Measure','Sustainability maturity assessment, score and improvement guidance'],['Validate','Evidence-based answers, expert validation and continuous monitoring of 30 KPIs'],['Report','Standards-based reports ready to share with banks and stakeholders'],['Create value','Validated data opens access to finance and new markets']],
  whyEb:'Why now?',whyH:'Sustainability is now a condition for markets, regulation and finance.',
  why:[['EU export requirements','Buyers in Europe increasingly ask their supply chains for sustainability data.'],['CBAM','Emissions data is becoming a precondition for exporting carbon-intensive products.'],['Digital Product Passport','Environmental information on products is expected to be traceable.'],['TSRS and supply chains','Companies reporting under the Turkish Sustainability Reporting Standards now ask their suppliers for data too.'],['Climate Law and Türkiye ETS','The emissions trading system established by Türkiye’s Climate Law turns emissions data into an obligation at home as well.'],['Sustainable finance','International and local finance is increasingly tied to sustainability KPIs.']],
  audEb:'Who is it for?',audH:'Same data. Different decisions.',
  cards:[
   {h:'SMEs & Companies',p:'For companies that want to measure and improve their sustainability maturity and prepare for finance and export markets.',l:['SMEs','Exporters','Suppliers','Corporates'],href:'companies',icon:'earth'},
   {h:'Banks & IFIs',p:'For financial institutions that want to make sustainability-linked lending measurable, trackable and reportable at SME scale.',l:['Banks','International financial institutions','Credit teams','Risk teams'],href:'institutions',icon:'circle-dollar-sign'},
   {h:'Ecosystem Owners',p:'For companies and platforms that want to raise the sustainability maturity of their supplier and seller networks and ease their access to finance.',l:['Large buyers','Marketplaces','Industry associations','Supply chains'],href:'ecosystem',icon:'network'}

 },
 modulesPage:{title:'Modules',eb:'Modules',h1:'Modular infrastructure from measurement to finance.',p:'Maturity assessment, KPI monitoring and validation, supply chain and sustainable finance modules.'},
 financePage:{title:'Sustainable Finance',eb:'Sustainable Finance',h1:'Connecting SMEs to sustainability-linked finance.',p:'Implika provides the measurement, monitoring and reporting infrastructure that lets international finance reach SMEs as working capital through sustainability-linked loans (SLLs).',
  pEb:'The problem',pH:'Why doesn’t green finance reach SMEs?',pP:['Funding from international financial institutions (IFIs) makes up a significant share of Turkish banks’ corporate loan books. But the green and social loans funded this way are project-based: the financing is tied to a specific green transition project.','What SMEs actually need is working capital. Sustainability-linked loans carry no project requirement, yet maturity assessment and KPI tracking have so far been costly and slow, so these loans have mostly gone to large companies.'],
  sEb:'Our solution',sH:'Bringing sustainability-linked lending to SME scale.',sP:['Implika measures an SME’s sustainability maturity at an accessible cost and turns it into a maturity score. That score is the SME’s first gate into credit assessment.','Throughout the loan, KPIs are monitored on the platform, validated by our expert network and made ready for the bank’s reporting. As the SME meets its KPIs its score rises and, depending on programme terms, better tenor and pricing can be linked to that progress.'],
  flowEb:'How the programme works',flowH:'Sustainability-linked finance in five steps.',
  steps:[['Programme framework','IFIs and participating banks set the funding, KPI set and terms'],['Assessment and score','The SME completes its maturity assessment on Implika'],['Credit assessment','The score is shared with the bank, which makes the credit decision'],['Monitoring and validation','KPIs are monitored, validated by experts and reported'],['Progress and benefits','As the score rises, programme terms can reward progress']],
  rolesEb:'Who does what?',rolesH:'Clear roles for every party.',
  roles:[['International financial institution','Sets the programme framework, funding pool and KPI set.'],['Participating bank','Makes the credit decision and runs pricing, disbursement and risk assessment.'],['Ecosystem owner','Announces the programme to its supplier and seller network, invites them and champions it.'],['Implika','Provides the maturity assessment, score, KPI monitoring, validation infrastructure and reporting.']],
  note:'Implika does not lend, does not take part in credit decisions and carries no risk. The ecosystem owner is not a lending channel either; its role is to make it easier to reach SMEs.',
  stdEb:'Aligned with international frameworks',stdH:'Measurement and monitoring built on standards.',stdP:'The maturity assessment is based on international sustainability frameworks, and the KPI set on international principles for sustainability-linked loans. Which KPIs apply is decided within each programme framework.',stdPills:['LMA / APLMA / LSTA SLL Principles','SME-specific criteria set','30-KPI standard set']},
 companies:{title:'SMEs & Companies',eb:'For SMEs and companies',h1:'Measure your maturity. Get ready for finance and new markets.',p:'Maturity assessment, an improvement roadmap and KPI tracking for SMEs, exporters, suppliers and corporates.',h2:'Turn sustainability from a burden into an advantage.',lead:'Implika measures where your company stands today, shows what to improve, and links that progress to finance and commercial opportunities.',list:['Get your sustainability maturity score','Improve with recommended actions and training','Track your KPIs on one platform','Prepare for sustainability-linked finance','Get ready for EU export requirements and CBAM','Manage your corporate (TSRS) reporting inputs'],btn:'See how it works'},
 institutions:{title:'Banks & IFIs',eb:'For banks and international financial institutions',h1:'Make sustainability-linked lending measurable at SME scale.',p:'Maturity scoring, KPI monitoring, validation and reporting infrastructure for banks and international financial institutions.',h2:'Reach a wider SME base with data you can trust.',lead:'Implika makes an SME’s sustainability maturity visible at the start of the credit process and keeps its KPIs trackable and reportable for the life of the loan.',list:['Pre-assessment with a maturity score','KPI monitoring and reporting throughout the loan','Measurement and validation by our expert network','Training and improvement platform for SMEs','Firm-level impact measurement','API integration with banking systems'],note:'Credit decisions, pricing and risk assessment remain entirely with the bank. The Implika score is a first gate for bringing an SME into assessment.',btn:'See how it works'},
 ecosystem:{title:'Ecosystem Owners',eb:'For ecosystem owners',h1:'Raise the maturity of your supplier and seller network.',p:'A sustainability and access-to-finance programme for large companies, marketplaces and industry associations with supplier or seller networks.',h2:'A stronger network makes a stronger business.',lead:'The ecosystem owner announces and champions the programme; Implika takes care of assessment, improvement and monitoring. Your network gains both sustainability maturity and financial resilience.',list:['Announce the programme to your suppliers and sellers','Track your network’s maturity progress','Access Scope 3 data in one place','Ease your network’s access to affordable finance','Prepare your network for EU regulation and export requirements'],note:'The ecosystem owner is neither a lending channel nor a risk-bearing party. Its role is to announce the programme and make it easier to reach its network.',btn:'See how it works'},
 about:{title:'About',eb:'About Implika',filmEb:'Corporate film',filmH:'Meet Implika <em>in 90 seconds.</em>',filmP:'Discover the platform that makes the green transition measurable and financeable, in our short film.',filmTR:'Türkçe',filmEN:'English',filmDur:'90 sec',h1:'Bridging data, expertise and finance.',p:'Implika is a sustainability technology platform that measures and improves the sustainability maturity of SMEs and companies and connects it to finance.',
  s1eb:'Who we are',s1h:'Founded by Sistem Global and BTS.',s1p:['Implika was founded as a joint initiative of Sistem Global and BTS. Built on BTS’s expertise in the legal and regulatory side of sustainability and ESG, we developed our platform together with NTT DATA. Implika is a GRI Licensed Software &amp; Tools Partner.','The platform helps companies measure and improve their sustainability maturity and track their KPIs, while enabling banks and international financial institutions to use that data in their lending processes.'],
  s2eb:'Where we started',s2h:'Why should sustainability be reserved for large companies?',s2p:['Sustainability measurement and reporting have long been costly and slow. As a result, sustainability-linked finance has mostly reached large companies.','Our goal is to let SMEs measure and improve their sustainability maturity easily and affordably, and turn that progress into finance and new markets.'],
  exEb:'Expertise ecosystem',exH:'Four perspectives.<br>One platform.',ex:[['Technology','Digital platform, data infrastructure, software and integration.'],['Sustainability & ESG','Maturity assessment, KPI sets and reporting.'],['Field & Validation','A measurement and validation network of accountants, lawyers and green finance experts.'],['Regulation & Finance','International standards, loan framework compliance and sustainable finance.']],

 values:{eb:'Our values',h:'The principles that guide us.',items:[['Trustworthy data','Every data point we measure is traceable, verifiable and aligned with international standards.'],['Accessibility','We make sustainability accessible to businesses of every size, rather than a privilege of large corporations.'],['Transparency','We share our methodology, scores and processes openly with our stakeholders.'],['Measurable impact','We measure success not by reports, but by access to finance, improving KPIs and real transformation.']]},

 meth:{title:'Methodology',eb:'Methodology',h1:'How is the score calculated?',p:'The Implika score combines a question set covering environmental, social and governance topics, evidence-based answers, expert validation and continuous monitoring against a standard set of 30 KPIs. Every step is traceable, so the company and the bank can rely on the same score.',
  stepsEb:'Five steps to a score',stepsH:'From questions to validated data.',
  steps:[['Question set','A question set covering environmental, social and governance topics and tailored to the company’s size and sector: an extended set based on the GRI Standards for corporates, and a streamlined Lite set for SMEs.'],['Answers and evidence','Yes/no, multiple-choice, numeric and document-upload answer types. Answers supported by documents feed into the score with higher confidence.'],['Scoring','Each question is weighted by materiality; topic scores and an overall maturity score are calculated, and the company is placed on a maturity level.'],['Validation','Evidence and critical answers are reviewed by the expert validation network; approved data is marked as validated on the platform.'],['Monitoring and reporting','Progress is tracked periodically against the standard set of 30 KPIs; the score is updated and reports become ready to share with banks and stakeholders.']],
  lvlEb:'Maturity levels',lvlH:'The score shows where a company stands and what it needs to improve.',
  levels:[['Starting','Sustainability management is just beginning; core data and policies need to be put in place.'],['Developing','Basic practices exist; data collection and target setting need to become systematic.'],['Advanced','Management systems and KPI tracking are established; performance is measured and reported regularly.'],['Leading','Sustainability is embedded in strategy; validated data turns into finance and market advantages.']],
  isEb:'Scope of the score',isH:'What the score shows, and what it does not.',isT:'It shows',isntT:'It does not',
  is:['The company’s sustainability maturity and the reliability of its data','Areas for improvement and prioritised actions','Progress over time and KPI performance'],
  isnt:['It is not a credit rating or a credit decision; the credit decision rests entirely with the bank','It is not an assurance audit or a certification','It does not assess the company’s financial position'],

  griEb:'GRI licence',griH:'GRI Licensed Software &amp; Tools Partner · 2026',griP:'Implika is one of GRI’s licensed software and tools partners for 2026. Content from the GRI Standards used on the platform is used with GRI’s permission. GRI’s verification is limited to the accurate use of GRI Standards content; GRI makes no representation as to the correctness, fitness for purpose or quality of the platform or of any outputs produced with it, and does not approve such outputs.',griCap1:'Software and Tools Partner 2026',griCap2:'Content Used with Permission 2026'},
 sec:{title:'Data Security',eb:'Data security and privacy',h1:'Your data is yours.',p:'The data you upload to Implika is never shared without your consent, is visible only to authorised people and is processed in line with Türkiye’s Personal Data Protection Law No. 6698 (KVKK).',
  hEb:'Our principles',h:'Six principles of security.',
  items:[['Data ownership','All data and documents you enter belong to your company; you can export them or request their deletion at any time.','database'],['Consent-based sharing','Your score and reports are shared with a bank or ecosystem owner only with your explicit consent, and you can see what is shared with whom.','check'],['KVKK compliance','Personal data is processed in line with KVKK, limited to specific and legitimate purposes; information and consent steps are built into the platform.','shield-check'],['Role-based access','Company users, validation experts and financial institutions see only the data their role requires.','network'],['Encryption','Data is encrypted in transit and at rest.','target'],['Audit trail','Who entered, changed or approved what, and when: every action is logged.','chart-column']],
  note:'Validation experts access only the evidence of the companies assigned to them, under a confidentiality commitment. Our data protection processes are designed with the data protection and compliance expertise of BTS &amp; Partners.',ask:'For questions about data security'},
 start:{

 team:{members:{gozde:{role:'Team Leader · GRI Certified',bio:'Gözde leads the Implika team and is a GRI-certified sustainability professional. A lawyer with over 20 years of experience, she spent 15 years as in-house counsel at Alshaya Group, heading Legal and chairing the Ethics &amp; Compliance, Data Privacy and Disciplinary committees across Türkiye, Azerbaijan and Georgia, and sat on the Executive Leadership Team. She is a Partner at BTS &amp; Partners in sustainability, compliance and commercial law. She graduated from Istanbul University Faculty of Law and holds an LL.M. in Business Law from Istanbul Bilgi University.'},ada:{role:'Sustainability &amp; Compliance',bio:'Ada works mainly on sustainability and compliance, alongside other areas of private law. Before joining BTS &amp; Partners, she handled maritime, employment and insurance law matters at various multinational firms. At Implika she supports sustainability and compliance work. She graduated from Galatasaray University Faculty of Law.'},kaan:{role:'Data Protection &amp; Compliance · GRI Certified',bio:'Kaan is a GRI-certified sustainability professional. As a Managing Associate at BTS &amp; Partners, he works on compliance, data protection and privacy, IT and telecoms, and media. He advises data- and technology-driven companies, especially start-ups adapting to evolving regulation, and works on product development projects that digitise legal services and design client experiences through data.'}},eb:'Team',h:'The people operating Implika.',hint:'Hover over or tap the photo for the biography.',flip:'Show biography',role:'Manager',bio:'Mehmet brings over 11 years of experience at the intersection of sustainability, climate regulation and green finance. At PwC Turkey, Corpera and Sistem Global, he led CSRD/ESRS and TSRS compliance, double materiality assessments, TCFD/NGFS climate risk scenarios and E&amp;S assessments under IFC/EBRD standards. At İmplika, he helps companies and financial institutions turn sustainability data into a measurable, verifiable asset that unlocks access to finance. He holds degrees from Boğaziçi University and Istanbul Bilgi University, is a Springer-published author and teaches sustainability.'},
 board:{title:'Board of Directors',eb:'Board of Directors',h:'Strategic direction for long-term growth.',p:'The Board of Directors shaping Implika’s strategic direction and long-term growth.',role:'Board Member',chair:'Chairman of the Board',bios:['İhsan Uğur Delikanlı graduated in Public Administration from Middle East Technical University and holds an MBA in Financial Management from the University of Exeter, a master’s in Economic Theory from Gazi University and a PhD in Accounting and Finance from Başkent University, with research on credit derivatives; he is an Associate Professor. He began his career at the Grand National Assembly of Türkiye in 1992 and served for 12 years as a Sworn Bank Auditor at the Undersecretariat of Treasury and the BRSA. He has served as BRSA Board Member and Vice Chairman, and headed Aktif Yatırım Bankası and the Black Sea Trade and Development Bank. He sits on the boards of Fimple and Mint Finansman, and has served on bodies including the Tax Council, the Turkish Accounting Standards Board and the Basel Committee.', 'Yasin Beceni is a Senior Partner at BTS &amp; Partners. For nearly twenty years he has advised large business groups, Fortune 500 technology companies and leading Turkish enterprises on information and communication technology law, policy and strategy, regulatory law and digital technology. Since 2001 he has contributed to academic work on the digital economy and the information society, and he lectures in the ICT Law LL.M. programme at Istanbul Bilgi University and the Data Analytics master’s programme at Sabancı University. He is Chief Legal Advisor to TÜBİSAD. He graduated from Marmara University Faculty of Law and holds an LL.M. in Economic Law from Istanbul Bilgi University.', 'Zafer Yıldız is a Board Member and Partner at Sistem Global Danışmanlık and a founding partner of Sistem Global Antalya. He chairs the Board of Sgreen, the group’s sustainability company. Founded in 1996, Sistem Global is a professional services group serving a broad client base, from SMEs to large enterprises, across tax, finance, R&amp;D, compliance and digital solutions.']},

const NEWS=[{slug:'yesil-donusumun-finansmani-ve-rekabet-gucu',img:'assets/news/yesil-donusumun-finansmani-ve-rekabet-gucu.jpg',thumb:'assets/news/yesil-donusumun-finansmani-ve-rekabet-gucu-thumb.jpg'},{slug:'gri-licensed-software-tools-partner',yt:'gri',poster:'assets/video/implika-gri-partner-',thumb:'assets/news/gri-licensed-software-tools-partner-thumb.jpg'}];
